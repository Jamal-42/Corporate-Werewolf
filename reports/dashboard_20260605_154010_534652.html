<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>职场狼人杀评测Dashboard</title>
<style>
:root{--bg:#1a1a2e;--bg2:#16213e;--surface:rgba(255,255,255,.05);--border:rgba(255,255,255,.1);--accent:#00d2ff;--danger:#ff6b6b;--warn:#ffd700;--success:#4ecdc4;--info:#285a84;--text:#e0e0e0;--muted:#888;--font:-apple-system,"Microsoft YaHei","PingFang SC",sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:linear-gradient(135deg,var(--bg) 0%,var(--bg2) 100%);color:var(--text);min-height:100vh;padding:20px;font-size:16px;line-height:1.6}
.container{max-width:1400px;margin:0 auto}
.header{text-align:center;padding:30px 0;border-bottom:1px solid var(--border);margin-bottom:30px}
.header h1{font-size:2.2rem;background:linear-gradient(90deg,#00d2ff,#3a7bd5);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header .meta{color:var(--muted);margin-top:10px;font-size:.9rem}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:30px}
.card{background:var(--surface);border-radius:12px;padding:18px;border:1px solid var(--border);transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.card .label{color:var(--muted);font-size:.85rem;margin-bottom:6px}
.card .value{font-size:1.8rem;font-weight:700;color:var(--accent)}
.section{background:var(--surface);border-radius:12px;padding:24px;margin-bottom:28px;border:1px solid var(--border)}
.section h2{color:#fff;margin-bottom:18px;padding-bottom:10px;border-bottom:1px solid var(--border);font-size:1.3rem}
.llm-only{display:none}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border)}
th{background:rgba(0,210,255,.1);color:var(--accent);font-weight:600;white-space:nowrap}
tr:hover{background:rgba(255,255,255,.03)}
.role-wolf{color:var(--danger)}
.role-good{color:var(--success)}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.75rem;margin:1px 2px}
.tag-strategy{background:rgba(0,210,255,.2);color:var(--accent)}
.tag-risk-high{background:rgba(255,107,107,.2);color:var(--danger)}
.tag-risk-mid{background:rgba(255,215,0,.2);color:var(--warn)}
.tag-risk-low{background:rgba(78,205,196,.2);color:var(--success)}
.tag-mistake{background:rgba(255,107,107,.15);color:#ff9999}
.tag-impact{background:rgba(255,215,0,.15);color:#ffe066}
.bar-chart{display:flex;flex-direction:column;gap:6px}
.bar-row{display:flex;align-items:center;gap:8px}
.bar-label{width:80px;font-size:.82rem;text-align:right;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-container{flex:1;height:22px;background:rgba(255,255,255,.08);border-radius:6px;overflow:hidden;display:flex}
.bar-fill{height:100%;border-radius:6px;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;font-size:.72rem;color:#fff;min-width:24px;transition:width .5s ease}
.bar-rule{background:linear-gradient(90deg,#3a7bd5,#00d2ff)}
.bar-llm{background:linear-gradient(90deg,#ffd700,#ff8c00)}
.bar-fused{background:linear-gradient(90deg,#4ecdc4,#00d2ff)}
.charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;margin-top:16px}
.chart-box{background:rgba(255,255,255,.03);border-radius:10px;padding:16px;border:1px solid rgba(255,255,255,.06)}
.chart-box h3{margin-bottom:12px;color:#fff;font-size:1rem}
.finding-card{padding:14px;margin-bottom:10px;border-radius:0 8px 8px 0;border-left:3px solid}
.finding-high{background:rgba(255,107,107,.1);border-color:var(--danger)}
.finding-medium{background:rgba(255,215,0,.08);border-color:var(--warn)}
.finding-low{background:rgba(40,90,132,.1);border-color:var(--info)}
.finding-card .title{font-weight:700;margin-bottom:4px}
.finding-card .evidence{color:var(--muted);font-size:.85rem;margin-bottom:4px}
.finding-card .rec{color:var(--success);font-size:.85rem}
.finding-card .cf{color:var(--warn);font-size:.82rem;margin-top:4px;padding-top:4px;border-top:1px dashed rgba(255,255,255,.1)}
.finding-card .llm-comment{color:#c0c0ff;font-size:.82rem;margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.08)}
.player-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:16px}
.player-card{background:rgba(255,255,255,.03);border-radius:10px;padding:18px;border:1px solid rgba(255,255,255,.06)}
.player-card .pheader{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--border);margin-bottom:12px}
.player-card .pname{font-size:1.1rem;font-weight:700}
.player-card .pscore{font-size:1.4rem;font-weight:700;color:var(--accent)}
.player-card .stat{display:flex;justify-content:space-between;margin-bottom:6px;font-size:.88rem}
.player-card .stat .k{color:var(--muted)}
.stat-bar{height:6px;background:rgba(255,255,255,.08);border-radius:3px;margin-top:3px;overflow:hidden}
.stat-bar-fill{height:100%;border-radius:3px}
.event-timeline{margin-top:10px;max-height:200px;overflow-y:auto;font-size:.78rem}
.event-timeline .ev{padding:3px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.discrepancy-card{background:rgba(255,215,0,.06);border:1px solid rgba(255,215,0,.2);border-radius:8px;padding:14px;margin-bottom:10px}
.discrepancy-card .gap{font-size:1.2rem;font-weight:700;color:var(--warn)}
.agg-table{width:100%;font-size:.85rem}
.agg-table td,.agg-table th{padding:6px 8px}
.expand-btn{cursor:pointer;color:var(--accent);font-size:.82rem;border:none;background:none;padding:4px 0}
.expand-btn:hover{text-decoration:underline}
.counterfactual-card{background:rgba(255,215,0,.06);border-left:3px solid var(--warn);padding:12px;margin-bottom:8px;border-radius:0 8px 8px 0}
.counterfactual-card .cf-title{color:var(--warn);font-weight:700;font-size:.9rem}
.counterfactual-card .cf-body{color:var(--muted);font-size:.85rem;margin-top:4px}
@media(max-width:900px){.cards{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}.charts-grid{grid-template-columns:1fr}.player-grid{grid-template-columns:1fr}}
@media(max-width:560px){body{padding:10px}.section{padding:14px}table{font-size:.78rem}th,td{padding:6px}}
</style>
</head>

  h+=`<div class="card"><div class="label">投票事件</div><div class="value">${cov.vote||0}</div></div>`;
  h+=`<div class="card"><div class="label">技能事件</div><div class="value">${cov.skill||0}</div></div>`;
  h+=`<div class="card"><div class="label">发言事件</div><div class="value">${cov.speech||0}</div></div>`;
  if(hasLLM()){
    const avgConf=llmCount?R.llm_judge_scores.reduce((a,x)=>a+(x.llm_confidence||0),0)/llmCount:0;
    h+=`<div class="card"><div class="label">LLM评测</div><div class="value" style="color:var(--success)">${llmCount}条</div></div>`;
    h+=`<div class="card"><div class="label">LLM置信度</div><div class="value" style="color:var(--success)">${fmt(avgConf*100,0)}%</div></div>`;
  }
  h+=`</div>`;
  document.getElementById("summary-section").innerHTML=h;
  document.getElementById("header-meta").textContent=`生成时间: ${R.generated_at||""} | 来源: ${R.source_file||""}`;
}

function renderLeaderboard(){
  const lb=R.leaderboard||[];
  const llm=hasLLM();
  let h=`<thead><tr><th>#</th><th>玩家</th><th>角色</th><th>决策</th><th>发言</th><th>投票</th><th>技能</th><th>综合</th>`;
  if(llm)h+=`<th>融合分</th><th>策略标签</th>`;
  h+=`<th>高危</th></tr></thead><tbody>`;
  lb.forEach((e,i)=>{
    const rc=roleCls(e.role);
    h+=`<tr><td>${i+1}</td><td>${esc(e.player)}</td><td class="${rc}">${roleDisplay(e.role)}</td>`;
    h+=`<td>${e.decision_count||0}</td>`;
    h+=`<td>${fmt(e.speech_score,1)}</td><td>${fmt(e.vote_score,1)}</td><td>${fmt(e.skill_score,1)}</td>`;
    h+=`<td style="font-weight:700;color:${scoreColor(e.overall_score)}">${fmt(e.overall_score)}</td>`;
    if(llm){
      const ls=llmForPlayer(e.player);
      const fused=ls.length?ls.reduce((a,x)=>a+(x.fused_score||0),0)/ls.length:e.overall_score;
      h+=`<td style="color:${scoreColor(fused)}">${fmt(fused)}</td>`;
      h+=`<td style="font-size:.8rem">${playerTags(e.player)||"-"}</td>`;
    }
    h+=`<td>${e.critical_mistakes||0}</td></tr>`;
  });
  h+=`</tbody>`;
  document.getElementById("leaderboard-table").innerHTML=h;
}

function renderDimensionComparison(){
  const ds=R.dimension_scores||{};
  const el=document.getElementById("dimension-section");
  let h=`<div class="chart-box"><h3>规则引擎评分</h3><div class="bar-chart">`;
  Object.entries(ds).forEach(([k,v])=>{
    h+=`<div class="bar-row"><div class="bar-label">${DIM_CN[k]||k}</div><div class="bar-container">${barFill(v,"linear-gradient(90deg,#3a7bd5,#00d2ff)")}</div></div>`;
  });
  h+=`</div></div>`;
  if(hasLLM()){
    const agg=R.llm_aggregate||{};const cu=agg.comparison_units||{};
    const dimAvg={};const dimCnt={};
    Object.values(cu).forEach(u=>{
      Object.entries(u.dimension_scores||{}).forEach(([dn,ds])=>{
        if(!dimAvg[dn]){dimAvg[dn]=0;dimCnt[dn]=0}
        dimAvg[dn]+=ds.mean;dimCnt[dn]++;
      });
    });
    Object.keys(dimAvg).forEach(k=>{dimAvg[k]/=dimCnt[k]});
    h+=`<div class="chart-box"><h3>LLM维度评分（均值）</h3><div class="bar-chart">`;
    const sorted=Object.entries(dimAvg).sort((a,b)=>b[1]-a[1]);
    sorted.forEach(([k,v])=>{
      h+=`<div class="bar-row"><div class="bar-label">${k}</div><div class="bar-container">${barFill(v,"linear-gradient(90deg,#ffd700,#ff8c00)")}</div></div>`;
    });
    h+=`</div></div>`;
    h+=`<div class="chart-box"><h3>规则 vs LLM 对比</h3><div class="bar-chart">`;
    const ruleMap={"推理质量":"other","信息利用":"other","言行一致性":"speech","博弈深度":"other","信息隐藏":"other"};
    sorted.forEach(([k,v])=>{
      const rk=ruleMap[k]||"other";const rv=ds[rk]||0;
      h+=`<div class="bar-row"><div class="bar-label">${k}</div>`;
      h+=`<div class="bar-container"><div class="bar-fill" style="width:${Math.max(2,rv)}%;background:linear-gradient(90deg,#3a7bd5,#00d2ff)">${Math.round(rv)}</div>`;
      h+=`<div class="bar-fill" style="width:${Math.max(2,v)}%;background:linear-gradient(90deg,#ffd700,#ff8c00)">${Math.round(v)}</div></div></div>`;
    });
    h+=`</div></div>`;
  }
  el.innerHTML=h;
}

function renderStrategyDistribution(){
  if(!hasLLM())return;
  const cu=(R.llm_aggregate||{}).comparison_units||{};
  const byRole={};
  Object.values(cu).forEach(u=>{
    const r=u.role||"?";const sd=u.strategy_distribution||{};
    if(!byRole[r])byRole[r]={};
    Object.entries(sd).forEach(([s,c])=>{byRole[r][s]=(byRole[r][s]||0)+c});
  });
  let h=`<div class="charts-grid">`;
  Object.entries(byRole).forEach(([role,strats])=>{
    const total=Object.values(strats).reduce((a,b)=>a+b,0);
    h+=`<div class="chart-box"><h3>${roleDisplay(WORK2TRAD[role]||role,true)}</h3><div class="bar-chart">`;
    Object.entries(strats).sort((a,b)=>b[1]-a[1]).forEach(([s,c])=>{
      h+=`<div class="bar-row"><div class="bar-label">${esc(s)}</div><div class="bar-container">${barFill(c/total*100,"linear-gradient(90deg,#4ecdc4,#00d2ff)")}<span style="margin-left:6px;font-size:.8rem">${c}次</span></div></div>`;
    });
    h+=`</div></div>`;
  });
  h+=`</div>`;
  document.getElementById("strategy-section").innerHTML=h;
}

function renderGameDepth(){
  if(!hasLLM())return;
  const bins={};DEPTH.forEach(d=>bins[d.k]=0);
  (R.llm_judge_scores||[]).forEach(x=>{
    const s=(x.llm_scores||{})["博弈深度"];if(s==null)return;
    bins[depthLvl(s).k]++;
  });
  const total=Object.values(bins).reduce((a,b)=>a+b,0)||1;
  let h=`<div class="bar-chart" style="max-width:600px">`;
  DEPTH.forEach(d=>{
    const c=bins[d.k];
    h+=`<div class="bar-row"><div class="bar-label">${d.k} ${d.n}</div><div class="bar-container">${barFill(c/total*100,"linear-gradient(90deg,#ff6b6b,#ffd700,#4ecdc4,#00d2ff,#a855f7)".split(",").slice(DEPTH.indexOf(d),DEPTH.indexOf(d)+1)[0]||"#00d2ff")}<span style="margin-left:6px;font-size:.8rem">${c}次</span></div></div>`;
  });
  h+=`</div>`;
  const colors=["#ff6b6b","#ffd700","#4ecdc4","#00d2ff","#a855f7"];
  let h2=`<div class="bar-chart" style="max-width:600px">`;
  DEPTH.forEach((d,i)=>{
    const c=bins[d.k];
    h2+=`<div class="bar-row"><div class="bar-label">${d.k} ${d.n}</div><div class="bar-container">${barFill(c/total*100,colors[i])}<span style="margin-left:6px;font-size:.8rem">${c}次</span></div></div>`;
  });
  h2+=`</div>`;
  document.getElementById("depth-section").innerHTML=h2;
}

function renderFindings(){
  const fs=R.findings||[];const top=fs.slice(0,15);
  let h="";
  if(!top.length){h=`<p style="color:var(--success)">未发现明显失误</p>`;document.getElementById("findings-section").innerHTML=h;return}
  top.forEach(f=>{
    const sc=f.severity==="high"?"finding-high":f.severity==="medium"?"finding-medium":"finding-low";
    h+=`<div class="finding-card ${sc}">`;
    h+=`<div class="title"><span class="tag ${f.severity==="high"?"tag-risk-high":f.severity==="medium"?"tag-risk-mid":"tag-risk-low"}">${f.severity}</span> 第${f.round||"-"}轮 ${esc(f.player)}（${roleDisplay(f.role)}）— ${esc(f.title)}</div>`;
    h+=`<div class="evidence">${esc(f.evidence||"")}</div>`;
    h+=`<div class="rec">建议: ${esc(f.recommendation||"")}</div>`;
    if(f.counterfactual)h+=`<div class="cf">反事实: ${esc(f.counterfactual)}</div>`;
    const llm=llmForDecision(f.player,f.round);
    if(llm){
      h+=`<div class="llm-comment">`;
      if(llm.overall_comment)h+=`<div>LLM点评: ${esc(llm.overall_comment)}</div>`;
      const dt=llm.decision_tags||{};
      if(dt.strategy_used)h+=`<span class="tag tag-strategy">${esc(dt.strategy_used)}</span>`;
      if(dt.mistake_type)h+=`<span class="tag tag-mistake">${esc(dt.mistake_type)}</span>`;
      if(dt.game_impact)h+=`<span class="tag tag-impact">${esc(dt.game_impact)}</span>`;
      h+=`</div>`;
    }
    h+=`</div>`;
  });
  if(fs.length>15)h+=`<div style="color:var(--muted);font-size:.85rem">共${fs.length}条，显示前15条</div>`;
  document.getElementById("findings-section").innerHTML=h;
}

function renderPlayerCards(){
  const lb=R.leaderboard||[];const evts=R.events||[];
  let h="";
  lb.forEach(e=>{
    const rc=roleCls(e.role);
    const pEvts=evts.filter(x=>x.player===e.player).slice(-10);
    const llm=llmForPlayer(e.player);
    h+=`<div class="player-card">`;
    h+=`<div class="pheader"><div><div class="pname">${esc(e.player)}</div><div class="${rc}" style="font-size:.85rem">${roleDisplay(e.role)}</div></div>`;
    h+=`<div class="pscore" style="color:${scoreColor(e.overall_score)}">${fmt(e.overall_score)}</div></div>`;
    [["发言",e.speech_score,"#00d2ff"],["投票",e.vote_score,"#4ecdc4"],["技能",e.skill_score,"#ffd700"]].forEach(([lb2,v,c])=>{
      h+=`<div class="stat"><span class="k">${lb2}</span><span>${fmt(v,1)}</span></div>`;
      h+=`<div class="stat-bar"><div class="stat-bar-fill" style="width:${Math.max(1,v)}%;background:${c}"></div></div>`;
    });
    if(llm.length){
      const fused=llm.reduce((a,x)=>a+(x.fused_score||0),0)/llm.length;
      h+=`<div class="stat" style="margin-top:8px"><span class="k">融合分</span><span style="color:${scoreColor(fused)}">${fmt(fused)}</span></div>`;
      const tags=playerTags(e.player);
      if(tags)h+=`<div style="margin-top:4px;font-size:.8rem">${tags}</div>`;
    }
    h+=`<div class="event-timeline">`;
    pEvts.forEach(ev=>{
      h+=`<div class="ev">第${ev.round||"-"}轮 ${ev.category==="vote"?"投票→"+esc(ev.target||"?"):ev.category==="skill"?esc(ev.action||"技能"):"发言"} <span style="color:${scoreColor(ev.score||0)}">${fmt(ev.score,0)}</span></div>`;
    });
    h+=`</div></div>`;
  });
  document.getElementById("players-section").innerHTML=h;
}

function renderLLMAggregate(){
  if(!hasLLM())return;
  const cu=(R.llm_aggregate||{}).comparison_units||{};
  let h="";
  Object.entries(cu).forEach(([key,u])=>{
    const parts=key.split("|");const role=u.role||parts[0]||"?";const et=u.event_type||parts[1]||"?";const stage=u.game_stage||parts[2]||"";
    h+=`<div class="chart-box" style="margin-bottom:16px">`;
    h+=`<h3>${roleDisplay(WORK2TRAD[role]||role,true)} | ${et}${stage?" | "+stage:""} <span style="color:var(--muted);font-size:.8rem">(${u.sample_count||0}样本)</span></h3>`;
    h+=`<div class="bar-chart">`;
    Object.entries(u.dimension_scores||{}).sort((a,b)=>b[1].mean-a[1].mean).forEach(([dn,ds])=>{
      h+=`<div class="bar-row"><div class="bar-label">${dn}</div><div class="bar-container">${barFill(ds.mean,"linear-gradient(90deg,#4ecdc4,#00d2ff)")}<span style="margin-left:6px;font-size:.78rem;color:var(--muted)">${fmt(ds.mean,1)} ±${fmt(ds.std,1)} [${fmt(ds.ci95[0],1)},${fmt(ds.ci95[1],1)}]</span></div></div>`;
    });
    h+=`</div>`;
    const sd=u.strategy_distribution||{};
    if(Object.keys(sd).length){
      h+=`<div style="margin-top:8px;font-size:.85rem">策略: `;
      Object.entries(sd).sort((a,b)=>b[1]-a[1]).forEach(([s,c])=>{h+=`<span class="tag tag-strategy">${esc(s)}×${c}</span>`});
      h+=`</div>`;
    }
    const cm=u.common_mistakes||[];
    if(cm.length)h+=`<div style="margin-top:4px;font-size:.82rem;color:var(--danger)">常见失误: ${cm.map(esc).join(", ")}</div>`;
    h+=`</div>`;
  });
  document.getElementById("aggregate-section").innerHTML=h;
}

function renderDiscrepancies(){
  if(!hasLLM())return;
  const items=[];
  (R.llm_judge_scores||[]).forEach(x=>{
    (x.score_discrepancies||[]).forEach(d=>{items.push({...d,player:x.player,round:x.round,event_type:x.event_type,comment:x.overall_comment})});
  });
  items.sort((a,b)=>Math.abs(b.gap)-Math.abs(a.gap));
  const top=items.slice(0,12);
  if(!top.length){document.getElementById("discrepancy-section").innerHTML=`<p style="color:var(--muted)">规则引擎与LLM评分无显著差异</p>`;return}
  let h="";
  top.forEach(d=>{
    h+=`<div class="discrepancy-card">`;
    h+=`<div style="font-weight:700">${esc(d.player)} 第${d.round||"-"}轮 ${d.event_type||""} — <span class="gap">差距 ${fmt(d.gap,1)}</span></div>`;
    h+=`<div style="margin-top:4px;font-size:.88rem">规则: <span style="color:var(--accent)">${fmt(d.rule)}</span> | LLM: <span style="color:var(--warn)">${fmt(d.llm)}</span></div>`;
    if(d.comment)h+=`<div style="margin-top:4px;font-size:.82rem;color:var(--muted)">LLM点评: ${esc(d.comment)}</div>`;
    h+=`</div>`;
  });
  document.getElementById("discrepancy-section").innerHTML=h;
}

function renderCounterfactuals(){
  const cfs=R.counterfactuals||[];const fs=R.findings||[];
  if(!cfs.length&&!fs.length){document.getElementById("counterfactual-section").innerHTML=`<p style="color:var(--muted)">暂无反事实数据</p>`;return}
  let h="";
  cfs.slice(0,10).forEach((c,i)=>{
    h+=`<div class="counterfactual-card"><div class="cf-title">推演 #${i+1}</div><div class="cf-body">${esc(c)}</div></div>`;
  });
  if(cfs.length>10)h+=`<div style="color:var(--muted);font-size:.85rem">共${cfs.length}条，显示前10条</div>`;
  document.getElementById("counterfactual-section").innerHTML=h;
}

document.addEventListener("DOMContentLoaded",()=>{
  try{R=JSON.parse(document.getElementById("report-data").textContent)}catch(e){console.error("Failed to parse report data",e);return}
  if(hasLLM())document.querySelectorAll(".llm-only").forEach(el=>el.style.display="block");
  renderSummary();renderLeaderboard();renderDimensionComparison();
  if(hasLLM()){renderStrategyDistribution();renderGameDepth();renderLLMAggregate();renderDiscrepancies()}
  renderFindings();renderPlayerCards();renderCounterfactuals();
});
</script>
</body>
</html>

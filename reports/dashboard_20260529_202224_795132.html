<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>职场狼人杀评测Dashboard</title>
<style>
:root{--bg:#1a1a2e;--bg2:#16213e;--surface:rgba(255,255,255,.05);--border:rgba(255,255,255,.1);--accent:#00d2ff;--danger:#ff6b6b;--warn:#ffd700;--success:#4ecdc4;--info:#285a84;--text:#e0e0e0;--muted:#888;--font:-apple-system,"Microsoft YaHei","PingFang SC",sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:linear-gradient(135deg,var(--bg) 0%,var(--bg2) 100%);color:var(--text);min-height:100vh;padding:20px;font-size:16px;line-height:1.6}
.container{max-width:1400px;margin:0 auto}
.header{text-align:center;padding:30px 0;border-bottom:1px solid var(--border);margin-bottom:30px}
.header h1{font-size:2.2rem;background:linear-gradient(90deg,#00d2ff,#3a7bd5);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header .meta{color:var(--muted);margin-top:10px;font-size:.9rem}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:30px}
.card{background:var(--surface);border-radius:12px;padding:18px;border:1px solid var(--border);transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.card .label{color:var(--muted);font-size:.85rem;margin-bottom:6px}
.card .value{font-size:1.8rem;font-weight:700;color:var(--accent)}
.section{background:var(--surface);border-radius:12px;padding:24px;margin-bottom:28px;border:1px solid var(--border)}
.section h2{color:#fff;margin-bottom:18px;padding-bottom:10px;border-bottom:1px solid var(--border);font-size:1.3rem}
.llm-only{display:none}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border)}
th{background:rgba(0,210,255,.1);color:var(--accent);font-weight:600;white-space:nowrap}
tr:hover{background:rgba(255,255,255,.03)}
.role-wolf{color:var(--danger)}
.role-good{color:var(--success)}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.75rem;margin:1px 2px}
.tag-strategy{background:rgba(0,210,255,.2);color:var(--accent)}
.tag-risk-high{background:rgba(255,107,107,.2);color:var(--danger)}
.tag-risk-mid{background:rgba(255,215,0,.2);color:var(--warn)}
.tag-risk-low{background:rgba(78,205,196,.2);color:var(--success)}
.tag-mistake{background:rgba(255,107,107,.15);color:#ff9999}
.tag-impact{background:rgba(255,215,0,.15);color:#ffe066}
.bar-chart{display:flex;flex-direction:column;gap:6px}
.bar-row{display:flex;align-items:center;gap:8px}
.bar-label{width:80px;font-size:.82rem;text-align:right;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-container{flex:1;height:22px;background:rgba(255,255,255,.08);border-radius:6px;overflow:hidden;display:flex}
.bar-fill{height:100%;border-radius:6px;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;font-size:.72rem;color:#fff;min-width:24px;transition:width .5s ease}
.bar-rule{background:linear-gradient(90deg,#3a7bd5,#00d2ff)}
.bar-llm{background:linear-gradient(90deg,#ffd700,#ff8c00)}
.bar-fused{background:linear-gradient(90deg,#4ecdc4,#00d2ff)}
.charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;margin-top:16px}
.chart-box{background:rgba(255,255,255,.03);border-radius:10px;padding:16px;border:1px solid rgba(255,255,255,.06)}
.chart-box h3{margin-bottom:12px;color:#fff;font-size:1rem}
.finding-card{padding:14px;margin-bottom:10px;border-radius:0 8px 8px 0;border-left:3px solid}
.finding-high{background:rgba(255,107,107,.1);border-color:var(--danger)}
.finding-medium{background:rgba(255,215,0,.08);border-color:var(--warn)}
.finding-low{background:rgba(40,90,132,.1);border-color:var(--info)}
.finding-card .title{font-weight:700;margin-bottom:4px}
.finding-card .evidence{color:var(--muted);font-size:.85rem;margin-bottom:4px}
.finding-card .rec{color:var(--success);font-size:.85rem}
.finding-card .cf{color:var(--warn);font-size:.82rem;margin-top:4px;padding-top:4px;border-top:1px dashed rgba(255,255,255,.1)}
.finding-card .llm-comment{color:#c0c0ff;font-size:.82rem;margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.08)}
.player-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:16px}
.player-card{background:rgba(255,255,255,.03);border-radius:10px;padding:18px;border:1px solid rgba(255,255,255,.06)}
.player-card .pheader{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--border);margin-bottom:12px}
.player-card .pname{font-size:1.1rem;font-weight:700}
.player-card .pscore{font-size:1.4rem;font-weight:700;color:var(--accent)}
.player-card .stat{display:flex;justify-content:space-between;margin-bottom:6px;font-size:.88rem}
.player-card .stat .k{color:var(--muted)}
.stat-bar{height:6px;background:rgba(255,255,255,.08);border-radius:3px;margin-top:3px;overflow:hidden}
.stat-bar-fill{height:100%;border-radius:3px}
.event-timeline{margin-top:10px;max-height:200px;overflow-y:auto;font-size:.78rem}
.event-timeline .ev{padding:3px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.discrepancy-card{background:rgba(255,215,0,.06);border:1px solid rgba(255,215,0,.2);border-radius:8px;padding:14px;margin-bottom:10px}
.discrepancy-card .gap{font-size:1.2rem;font-weight:700;color:var(--warn)}
.agg-table{width:100%;font-size:.85rem}
.agg-table td,.agg-table th{padding:6px 8px}
.expand-btn{cursor:pointer;color:var(--accent);font-size:.82rem;border:none;background:none;padding:4px 0}
.expand-btn:hover{text-decoration:underline}
.counterfactual-card{background:rgba(255,215,0,.06);border-left:3px solid var(--warn);padding:12px;margin-bottom:8px;border-radius:0 8px 8px 0}
.counterfactual-card .cf-title{color:var(--warn);font-weight:700;font-size:.9rem}
.counterfactual-card .cf-body{color:var(--muted);font-size:.85rem;margin-top:4px}
@media(max-width:900px){.cards{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}.charts-grid{grid-template-columns:1fr}.player-grid{grid-template-columns:1fr}}
@media(max-width:560px){body{padding:10px}.section{padding:14px}table{font-size:.78rem}th,td{padding:6px}}
</style>
</head>

ek-v4-flash", "input_tokens": null, "output_tokens": null, "latency_ms": null}, "score": 55.0, "metrics": {}}, {"id": 26, "round": null, "phase": "day_discussion", "player": "知心姐", "role": "狼人", "category": "other", "action": "模型调用", "target": null, "reason": "", "raw": "{\"event_type\": \"model_call\", \"timestamp\": \"2026-05-28T00:19:20\", \"player\": \"知心姐\", \"role\": \"狼人\", \"phase\": \"day_discussion\", \"model_name\": \"deepseek-v4-flash\", \"prompt_version\": \"v2\", \"input_tokens\": null, \"output_tokens\": null, \"latency_ms\": null, \"seat\": \"4号\", \"output_content\": {\"content\": \"（语气温和，缓缓开口）\\n\\n好的，我是4号。刚才1号、2号、3号都发言了，让我先说说我的感受。\\n\\n首先，2号你站出来亮明身份，这个勇气我是认可的。换位思考一下，如果真的HR总监，第一晚查出间谍第二天肯定要站出来，这个逻辑没问题。而且你说6号是间谍，6号确实出局了，这个信息表面上看是自洽的。\\n\\n但是呢，3号刚才也提了一个角度——他说\\\"任何一个看到6号出局的间谍都能编出这个说法\\\"——我觉得这个点也是值得我们冷静思考的。咱们先别急着站队，也别急着质疑，先让信息再多一点。\\n\\n我个人的想法是这样：今天这个场合，如果真的有真HR总监在，那现在应该站出来跟2号对跳才是。如果没有人跳出来质疑2号，那说实话，2号说自己是HR总监这个信息，至少目前是第一手信息来源，我们只能先参考着用。\\n\\n我想说的是，大家都冷静冷静，与其现在急着下定论，不如我们先聊聊——在座的各位，有没有谁对2号的说法有不同意见？或者有没有其他信息想跟大家分享的？\\n\\n（语气温和地笑了笑）\\n我4号就是个普通员工，平时主要负责关心大家的感受，今天这个局面，我希望咱们都能理性沟通，别太情绪化。2号你继续说吧，我也在认真听。\", \"metadata\": null}}", "metadata": {"model_name": "deepseek-v4-flash", "input_tokens": null, "output_tokens": null, "latency_ms": null}, "score": 55.0, "metrics": {}}, {"id": 27, "round": null, "phase": "day_discussion", "player": "PUA总裁", "role": "女巫", "category": "other", "action": "模型调用", "target": null, "reason": "", "raw": "{\"event_type\": \"model_call\", \"timestamp\": \"2026-05-28T00:19:32\", \"player\": \"PUA总裁\", \"role\": \"女巫\", \"phase\": \"day_discussion\", \"model_name\": \"deepseek-v4-flash\", \"prompt_version\": \"v2\", \"input_tokens\": null, \"output_tokens\": null, \"latency_ms\": null, \"seat\": \"5号\", \"output_content\": {\"content\": \"（慢条斯理地十指交叉放在桌上，目光温和地看向2号，再缓缓扫过全场）\\n\\n好，大家都发表了自己的看法。5号我来总结一下现在的情况，跟各位对齐一下思路。\\n\\n首先，2号你的勇气我欣赏——站出来亮明身份，说自己是HR总监，背调6号是间谍。这个信息点的表面自洽性，大家都能看到。\\n\\n但是，我想请大家思考一个底层逻辑的问题——\\n\\n3号刚才提的那个角度很有意思，他说的没错：如果2号是真 : null, "reason": "", "raw": "{\"event_type\": \"model_call\", \"timestamp\": \"2026-05-28T00:19:54\", \"player\": \"逻辑怪\", \"role\": \"预言家\", \"phase\": \"day_discussion\", \"model_name\": \"deepseek-v4-flash\", \"prompt_version\": \"v2\", \"input_tokens\": null, \"output_tokens\": null, \"latency_ms\": null, \"seat\": \"8号\", \"output_content\": {\"content\": \"（冷静听完所有人的发言，整理好数据链，语气平稳有力地开口）\\n\\n**我是8号，我要对2号刚才的发言做一个完整的逻辑拆解。**\\n\\n首先，我需要公布一个关键数据点——**我才是真正的HR总监**。昨晚我背调了6号，结果是：**6号是清白员工，不是商业间谍。**\\n\\n2号，你这个推理链条已经断了。让我逐层论证为什么：\\n\\n---\\n\\n**第一层：2号的信息自洽性分析**\\n\\n2号声称背调6号是间谍，6号首夜出局。表面上看\\\"信息吻合\\\"，但这是典型的**事后编造逻辑**——任何一个看到6号出局的玩家，都可以跳出来说\\\"我查了6号是间谍\\\"，因为6号已经死了，死无对证。这个说法零成本、零风险，但信息价值为零。\\n\\n**第二层：2号逻辑的根本矛盾**\\n\\n如果6号真是商业间谍，为什么间谍团队要在第一晚就窃取自己队友的信息？从逻辑上讲，商业间谍的目标是淘汰好人员工、保护自己队友。首夜就刀自己的队友，这种行为完全违背了间谍阵营的基本利益函数。数据不支持这个结论。\\n\\n**第三层：我的背调数据是确凿证据**\\n\\n我的背调结果是：6号是清白员工。那么6号被间谍团队首夜窃取信息的原因就很清晰了——**间谍团队选择了一个好人员工下手**，这是最常规的开局操作。而2号看到6号出局后，借机编造\\\"我查了6号是间谍\\\"来给自己镀金，这是冒充HR总监的标准话术。\\n\\n**第四层：为什么2号选择冒充**\\n\\n从博弈论角度分析，2号作为商业间谍，他需要尽快建立一个\\\"可信\\\"的身份来引导投票。他看到6号出局，认为这是一个完美的\\\"查杀\\\"素材——因为6号无法站起来反驳他。这个操作逻辑上成立，但被我确凿的背调数据直接证伪。\\n\\n---\\n\\n**我的结论非常清晰：**\\n\\n1. **2号是商业间谍**，他在冒充HR总监\\n2. **6号是清白员工**，被间谍团队首夜淘汰\\n3. **我是真正的HR总监**，我的背调数据是客观可信的\\n4. **今天应该投票让2号离职**，而不是让6号——6号已经出局了，但我们需要清算冒充者\\n\\n5号刚才提的那个问题非常好——\\\"为什么间谍团队会精准地在第一晚就窃取6号的信息？如果6号真的是间谍，间谍为什么要刀自己的队友？\\\" 这个质疑直接击穿了2号逻辑链的漏洞。\\n\\n各位公司阵营的同事，现在信息已经明朗了。我们有两个自称HR总监的人——我和2号。我拿出了具体的背调结果（6号是清白员工），2号编造了一个\\\"查杀死人\\\"的故事。请用你们的逻辑判断，谁的信息经得起推敲。\\n\\n**今天集中票型，让2号离职。**\", \"metadata\": null}}", "metadata": {"model_name": "deepseek-v4-flash", "input_tokens": null, "output_tokens": null, "latency_ms": null}, "score": 55.0, "metrics": {}}, {"id": 30, "round": null, "phase": "day_discussion", "player": "老油条", "role": "村民", "category": "other", "action": "模型调用", "target": null, "reason": "", "raw": "{\"event_type\": \"model_call\", \"timestamp\": \"2026-05-28T00:20:02\", \"player\": \"老油条\", \"role\": \"村民\", \"phase\": \"day_discussion\", \"model_name\": \"deepseek-v4-flash\", \"prompt_version\": \"v2\", \"input_tokens\": null, \"output_tokens\": null, \"latency_ms\": null, \"seat\": \"9号\", \"output_content\": {\"content\": \"（清了清嗓子，不紧不慢地开口）\\n\\n嗯...9号我说两句。这个局面啊，确实挺有意思的。\\n\\n现在2号和8号都自称是HR总监，信息完全相反——2号说查杀6号是间谍，8号说6号是清白员工。这个矛盾是实打实的，肯定有一个人在说谎。\\n\\n不过呢...9号我在这家公司混了十几年，见过太多大场面了。这种对跳的局，最忌讳的就是急着站队。你说对吧？\\n\\n我先说说我观察到的几个点：\\n\\n第一，2号确实是最先跳出来的，勇气可嘉。但你那个\\\"我查了6号是间谍，6号出局了所以信息吻合\\\"这个逻辑，正如3号和5号分析的，确实存在\\\"事后编造\\\"的可能——看到死人再编查杀，这个操作成本太低了。\\n\\n第二，8号跳出来对质，信息很具体——\\\"6号是清白员工\\\"。这个信息跟6号被首刀的事实更吻合——正常情况下间谍首夜就是刀好人嘛，哪有刀自己队友的道理。5号刚才也点出了这个矛盾点。\\n\\n但是呢...（停顿一下，语气犹豫）但是话又说回来，万一8号才是冒充的那个呢？毕竟8号是在2号跳完之后才跳的，这有个\\\"跟跳\\\"的嫌疑。而且8号如果真是HR总监，为什么不在2号一跳就马上对质？非要等1、2、3、4、5、7都发完言了才出来...这个节奏也值得琢磨。\\n\\n所以9号我的想法是——再看看，再看看。现在两位的信息我都先记着，但让我现在就选边站...9号我保留意见。等大家再多聊聊，看看后面还有没有其他信息浮出水面，或者看看投票前的票型走势，我再做决定。\\n\\n（环视一圈，笑着摊手）\\n咱们公司办事儿嘛，讲究的是稳妥、留有余地，对吧？\", \"metadata\": null}}", "metadata": {"model_name": "deepseek-v4-flash", "input_tokens": null, "output_tokens": null, "latency_ms": null}, "score": 55.0, "metrics": {}}, {"id": 31, "round": null, "phase": "day_discussion", "player": "铁头哥", "role": "狼人", "category": "other", "action": "模型调用", "target": null, "reason": "", "raw": "{\"event_type\": \"model_call\", \"timestamp\": \"2026-05-28T00:20:15\", \"player\": \"铁头哥\", \"role\": \"狼人\", \"phase\": \"day_discussion\", \"model_name\": \"deepseek-v4-flash\", \"prompt_version\": \"v2\", \"input_tokens\": null, \"output_tokens\": null, \"latency_ms\": null, \"seat\": \"10号\", \"output_content\": {\"content\": \"（语气沉稳，不紧不慢地开口）\\n\\n我是10号。前面1号到9号都发过言了，我一直在听，没急着说话。\\n\\n先说说我的判断逻辑。\\n\\n**第一，关于2号和8号的矛盾。**\\n\\n现在的情况很清楚——两个人跳HR总监，信息完全相反。2号说6号是间谍，8号说6号是清白员工。这俩人里肯定有一个在说谎。\\n\\n我先说说我观察到的几个点：\\n\\n2号是最先跳出来的，而且是主动跳的，不是被逼的。如果2号是冒充的，他冒的风险很大——因为不知道真HR会不会出来对跳。但2号跳的时候那个语气，是做好了有人对跳准备的。\\n\\n8号呢，是在2号跳完之后，等了好几个人发言才出来的。这个节奏我有点在意——如果你真是HR总监，听到有人冒充你、发假信息，为什么不第一时间跳出来对质？要等1、2、3、4、5、7都发完言了再出来？这个\\\"观望\\\"的节奏，说实话，有点像一个在判断风向的人。\\n\\n**第二，关于逻辑层面。**\\n\\n5号问的那个问题确实好——\\\"如果6号是间谍， 息有前后矛盾，谁就更值得怀疑。** 咱们让子弹再飞一会儿，等人齐了，等8号回答完我的问题，再做决定。\\n\\n11号发言完毕。\", \"metadata\": null}}", "metadata": {"model_name": "deepseek-v4-flash", "input_tokens": null, "output_tokens": null, "latency_ms": null}, "score": 55.0, "metrics": {}}, {"id": 33, "round": null, "phase": "day_discussion", "player": "暴躁哥", "role": "守护者", "category": "other", "action": "模型调用", "target": null, "reason": "", "raw": "{\"event_type\": \"model_call\", \"timestamp\": \"2026-05-28T00:20:43\", \"player\": \"暴躁哥\", \"role\": \"守护者\", \"phase\": \"day_discussion\", \"model_name\": \"deepseek-v4-flash\", \"prompt_version\": \"v2\", \"input_tokens\": null, \"output_tokens\": null, \"latency_ms\": null, \"seat\": \"12号\", \"output_content\": {\"content\": \"（12号一拍桌子，语气暴躁地开口）\\n\\n**我靠，可算轮到我12号说话了！憋了半天了！**\\n\\n我先回应一下2号——你说让我12号聊聊？行，那我就直说了！\\n\\n**首先，2号你那个\\\"查杀6号是间谍\\\"的说法，12号我觉得经不起推敲！** 你这不扯淡吗？你查了6号是间谍，然后间谍团队第一晚就把自己队友给刀了？哪个间谍团队这么蠢？脑子进水了吧！\\n\\n**8号跳出来说6号是清白员工，这个逻辑才对得上！** 正常情况，间谍第一晚肯定搞好人啊，哪有搞自己人的道理？你这逻辑链条根本站不住脚！\\n\\n但是——（话锋一转）**8号，你跳的时机也确实有问题！** 你也别怪我说话直，你既然是真HR总监，2号一上来冒充你的时候你就该拍桌子怼他！非得等1、3、4、5、7都发完言了再出来，这个观望的节奏，确实让人犯嘀咕！\\n\\n不过话说回来，从信息量上看——**8号的信息\\\"6号是清白员工\\\"比2号的\\\"6号是间谍\\\"更合理，因为首夜间谍刀好人，这是最基本的操作逻辑。** 2号那个说法，纯粹就是看见死人编查杀，零成本零风险，12号不吃这套！\\n\\n11号你说的那个\\\"间谍自刀队友造信息差\\\"——行，理论上存在这种可能，但那得是多高的操作水平？你当这是打职业比赛呢？第一局第一天就玩自刀？别想太复杂了！\\n\\n**12号的结论——我现在更倾向于信8号。** 2号那个逻辑太硬伤，说服不了我！\\n\\n但是8号你也别觉得完事儿了——**你下一晚的背调结果必须能跟大家对上！** 要是你后面给不出有用的信息，或者信息前后矛盾，12号第一个回头踩你！\\n\\n还有，**2号你现在有什么反制的说法？** 你再给12号解释解释——为啥间谍团队要首夜刀自己的队友？你给我把这个逻辑说圆了，不然12号今天就投你！\", \"metadata\": null}}", "metadata": {"model_name": "deepseek-v4-flash", "input_tokens": null, "output_tokens": null, "latency_ms": null}, "score": 55.0, "metrics": {}}, {"id": 34, "round": null, "phase": "day_vote_discussion", "player": "表格人", "role": "村民", "category": "other", "action": "模型调用", "target": null, "reason": "", "raw": "{\"event_type\": \"model_call\", \"timestamp\": \"2026-05-28T00:21:01\", \"player\": \"表格人\", \"role\": \"村民\", \"phase\": \"day_vote_discussion\", \"model_name\": \"deepseek-v4-flash\", \"prompt_version\": \"v2\", \"input_tokens\": null, \"output_tokens\": null, \"latency_ms\": null, \"seat\": \"1号\", \"output_content\": {\"content\": \"好的，我是1号，我用数据分析的视角来梳理一下当前的信息。\\n\\n**现有的数据点整理：**\\n\\n2号和8号都自称HR总监，背调信息完全矛盾（2号说6号是间谍，8号说6号是清白员工）。这是一个典型的双跳局面，其中必有一假。\\n\\n**从概率层面拆解两种可能性：**\\n\\n**假设A：2号是真HR，8号是冒充的间谍**\\n- 2号查出6号是间谍 → 间谍团队首夜刀掉6号（自己队友）\\n- 从概率上讲，间谍首夜刀队友的概率极低。12人局通常3-4名间谍，首夜刀中自己人的概率在25%-33%之间——但如果2号真的查杀了6号，间谍团队有更优选择：他们可以刀其他人，让6号白天被票出局，这样能多淘汰一个好人。刀掉自己队友是资源浪费，不符合利益函数。\\n- 但11号提到的\\\"自刀造信息\\\"战术在理论上存在，只是成本极高——牺牲一个队友来给冒充者镀金。\\n\\n**假设B：8号是真HR，2号是冒充的间谍**\\n- 8号查出6号是清白员工 → 间谍团队首夜刀掉6号（一个好人）\\n- 这是最常规的开局操作，从数据分布上看概率最高。2号看到6号出局后编造\\\"查杀6号\\\"的说法，操作成本低、风险为零——因为死人不会反驳。\\n- 这个假设在逻辑上更平滑，不需要引入额外假设来解释\\\"为什么间谍要刀自己人\\\"。\\n\\n**但有一个值得警惕的数据异常——8号的跳身份时机。**\\n\\n从发言序列来看：2号抢跳HR总监后，3号、4号、5号、7号依次发言，8号到第8位才跳出对质。如果8号是真HR总监，按理说听到2号冒充自己的那一刻就应该立即打断或跳出来反驳，而不是观望4个人的发言后再行动。这个延迟响应在\\\"数据层面\\\"是一个值得关注的异常点——反应时滞越长，越像是在判断风向后再做决策。\\n\\n**我的定量分析结论：**\\n\\n现阶段，从信息自洽度和逻辑平滑度来看，**8号的信息（6号是清白员工）与首夜出局数据的吻合度更高**，其概率权重略大于2号的信息。但8号的跳身份时机确实存在数据异常，降低了其可信度的置信区间。\\n\\n**我的策略建议：**\\n\\n现在下结论还为时过早，样本量不够做确定性判断。我建议今天先听两人后续的补充发言——特别是8号回答11号的问题，以及2号如何回应12号关于\\\"刀队友\\\"逻辑的质问。同时，如果2号是真HR，他今晚会有第二晚的背调数据来验证自己；如果8号是真HR，他也会用后续数据说话。\\n\\n**在此之前，我1号不会急着站队，但会重点监听2号和8号各自发言中的逻辑矛盾点。** 谁的发言出现前后不一致的内部矛盾，谁就更可能是编造信息的一方。\\n\\n还有一点——从数据角度，我建议关注其他玩家的投票倾向。如果多人快速倒向某一方且缺乏独立判断，那可能是有组织的间谍行动。反之，如果票型分散，说明好人阵营在独立思考，这是健康的信号。\", \"metadata\": null}}", "metadata": {"model_name": "deepseek-v4-flash", "input_tokens": null, "output_tokens": null, "latency_ms": null}, "score": 55.0, "metrics": {}}, {"id": 35, "round": null, "phase": "day_vote_discussion", "player": "卷王", "role": "狼人", "category": "other", "action": "模型调用", "target": null, "reason": "", "raw": "{\"event_type\": \"model_call\", \"timestamp\": \"2026-05-28T00:21:13\", \"player\": \"卷王\", \"role\": \"狼人\", \"phase\": \"day_vote_discussion\", \"model_name\": \"deepseek-v4-flash\", \"prompt_version\": \"v2\", \"input_tokens\": null, \"o 没有完全站边任何一方**。我跟3号和5号的想法一致：今天不急着在2号和8号之间二选一投票，等明天的第二晚背调数据出来再说。\\n\\n**关于今天的投票方向。**\\n\\n我建议可以投给12号。为什么呢？因为12号今天的态度**过于坚决、过于急切**——一上来就全仓押8号，恨不得直接带队把2号投出去。这种带节奏的力度，比一个正常好人该有的谨慎程度要强得多。倒不是说12号一定是间谍，但比起在2和8之间赌博，先把一个带节奏带得太急的人投出去验证一下，更符合公司的稳健风格。\\n\\n当然，这只是我11号的个人建议。最终怎么投，大家一起商量着定。但无论如何——**我坚决反对今天就在2和8之间二选一，这个风险太大，赌不起。**\\n\\n11号发言完毕。\", \"metadata\": null}}", "metadata": {"model_name": "deepseek-v4-flash", "input_tokens": null, "output_tokens": null, "latency_ms": null}, "score": 55.0, "metrics": {}}, {"id": 44, "round": null, "phase": "day_vote_discussion", "player": "暴躁哥", "role": "守护者", "category": "other", "action": "模型调用", "target": null, "reason": "", "raw": "{\"event_type\": \"model_call\", \"timestamp\": \"2026-05-28T00:23:27\", \"player\": \"暴躁哥\", \"role\": \"守护者\", \"phase\": \"day_vote_discussion\", \"model_name\": \"deepseek-v4-flash\", \"prompt_version\": \"v2\", \"input_tokens\": null, \"output_tokens\": null, \"latency_ms\": null, \"seat\": \"12号\", \"output_content\": {\"content\": \"（12号猛地站起来，语气暴躁地指着11号）\\n\\n**11号你什么意思？你说12号带节奏？你这不扯淡吗！**\\n\\n12号第一轮发言的时候，我就说得很清楚——**我是基于逻辑在做判断**！2号的\\\"灭口说\\\"在时间线上根本就站不住脚，8号刚才已经把这个问题拆得明明白白了——夜里间谍刀人的时候，他们怎么可能知道HR总监的背调结果？这两个行动是并行的！2号那个\\\"灭口\\\"逻辑纯属事后诸葛亮！\\n\\n**12号说话直，但我说的每一句都有逻辑打底，不是瞎带节奏！**\\n\\n而且11号，你说12号\\\"全仓押8号\\\"——我什么时候说全仓了？你耳朵不好使还是脑子不好使？我原话说的明明是——**\\\"我现在更倾向于信8号，但8号你后面背调结果必须能对上，不然12号第一个回头踩你！\\\"** 这叫全仓？这叫有保留的判断！\\n\\n你再看看你自己——你一边说\\\"8号时间线逻辑确实硬\\\"，一边又说\\\"但太完美了像背稿子\\\"——你这是用感觉否定逻辑啊！你这不是双标是什么？\\n\\n**还有，你说今天投12号？行啊，那你告诉大家，12号哪里像间谍了？** 12号第一晚活得好好的，6号没了，我要是间谍我至于这么高调带节奏？我安安稳稳苟着不好吗？我12号脾气暴归暴，但我从来都是有什么说什么，不藏着掖着！\\n\\n（转头看向2号）\\n\\n**2号，我现在给你最后一个机会——你给我解释解释，为什么你那个\\\"灭口\\\"逻辑跟8号说的时间线对不上？** 夜里间谍怎么可能知道你的背调结果？你说不清楚，12号今天就投你没商量！\\n\\n（再看向8号）\\n\\n**8号，你也别觉得稳了。** 你那个跳身份的时机确实让人犯嘀咕，你说你是\\\"先收集情报再亮明身份\\\"——行，这个解释我勉强接受。但你明天要是拿不出第二晚的背调信息，或者你的信息跟实际情况对不上，12号照样不买你的账！\\n\\n最后回应10号和11号——你们觉得12号太激进？**12号这叫该出手时就出手！** 吞吞吐吐、畏畏缩缩的，那叫好人？那叫墙头草！间谍最喜欢的就是墙头草，好忽悠！\\n\\n**12号立场不变——今天先听2号怎么解释时间线的问题。解释不清楚，12号就投2号！**\", \"metadata\": null}}", "metadata": {"model_name": "deepseek-v4-flash", "input_tokens": null, "output_tokens": null, "latency_ms": null}, "score": 55.0, "metrics": {}}, {"id": 45, "round": null, "phase": "day_vote", "player": "表格人", "role": "村民", "category": "other", "action": "模型调用", "target": null, "reason": "", "raw": "{\"event_type\": \"model_call\", \"timestamp\": \"2026-05-28T00:26:53\", \"player\": \"表格人\", \"role\": \"村民\", \"phase\": \"day_vote\", \"model_name\": \"deepseek-v4-flash\", \"prompt_version\": \"v2\", \"input_tokens\": null, \"output_tokens\": null, \"latency_ms\": null, \"seat\": \"1号\", \"output_content\": {\"content\": \"我是1号，发言顺序靠后，我简单做个数据分析汇总再投票。\\n\\n**关键数据矛盾点整理：**\\n\\n关于2号的\\\"灭口\\\"逻辑，8号指出的时间线问题是客观存在的硬伤——夜间间谍行动和HR背调是并行发生的，间谍不可能在刀人时就已知晓背调结果。这个逻辑断层的存在，从数据层面降低了2号信息的可信度。\\n\\n但同时，8号的延迟跳身份也是一个异常数据点——先收集4个人的发言再亮明身份，用\\\"收集情报\\\"来解释虽然合理，但反应时滞确实超出了常规预期。\\n\\n**我的概率权重分配：**\\n- 8号信息可信度：约55%（逻辑更平滑，但跳身份时机存疑）\\n- 2号信息可信度：约45%（时间线硬伤拉低了可信度）\\n\\n这个置信度差距不足以让我完全站死一边，但投票必须有方向。\\n\\n**投票决策逻辑：**\\n如果今天不处理2号与8号之间的矛盾，明天真HR可能会在夜间被刀，导致信息断链。考虑到8号的背调信息（6号是清白员工）与首夜常规操作的吻合度更高，且2号的时间线逻辑存在实质性硬伤——我选择投2号。\\n\\n这并非完全确信，而是在现有样本量下的最优概率决策。如果2号是真HR，我明天会重新校准判断。\", \"metadata\": {\"vote\": \"2号\", \"reason\": \"8号指出的时间线硬伤是关键——间谍夜刀时不可能知道背调结果，2号的灭口逻辑存在逻辑断层。从概率上，6号作为首夜被刀的好人比作为被查杀的间谍更符合常规操作。虽未完全确信，但这是基于现有数据的最优概率决策。\", \"suspicion_level\": 6}}}", "metadata": {"model_name": "deepseek-v4-flash", "input_tokens": null, "output_tokens": null, "latency_ms": null}, "score": 55.0, "metrics": {}}, {"id": 46, "round": null, "phase": "day_vote", "player": "卷王", "role": "狼人", "category": "other", "action": "模型调用", "target": null, "reason": "", "raw": "{\"event_type\": \"model_call\", \"timestamp\": \"2026-05-28T00:26:53\", \"player\": \"卷王\", \"role\": \"狼人\", \"phase\": \"day_vote\", \"model_name\": \"deepseek-v4-flash\", \"prompt_version\": \"v2\", \"input_tokens\": null, \"output_tokens\": null, \"latency_ms\": null, \"seat\": \"2号\", \"output_content\": {\"content\": \"（语速飞快，抢在投票前做最后发言）\\n\\n好！我是2号，投票前我最后再说几句！\\n\\n 05-28T00:26:53\", \"player\": \"知心姐\", \"role\": \"狼人\", \"phase\": \"day_vote\", \"model_name\": \"deepseek-v4-flash\", \"prompt_version\": \"v2\", \"input_tokens\": null, \"output_tokens\": null, \"latency_ms\": null, \"seat\": \"4号\", \"output_content\": {\"content\": \"（语气温和，语速平缓）\\n\\n好的，我是4号。最后一轮发言了，大家应该都说得差不多了，我也简单说说我的最终想法。\\n\\n首先，我刚才一直在认真听8号的回应，也听了2号的补充。说实话，8号指出来的那个时间线问题——夜里间谍刀人和HR背调是并行发生的，间谍不可能提前知道2号的背调结果——这个逻辑确实很硬，我没办法否认这一点。\\n\\n但是呢，换位思考一下，我也理解2号为什么觉得委屈——他第一个跳出来亮明身份，赌上了自己的游戏体验，如果他是假的他图什么呢？而且就像他自己说的，如果他是冒充的，编个查杀6号，8号一跳他就暴露了，这风险也太大了。\\n\\n所以我现在和3号、5号、9号、10号、11号的想法一样——今天真的不适合在2号和8号之间二选一投票。信息太少了，万一投错了真HR，对我们好人阵营的打击太大了。\\n\\n关于今天的投票方向，我听了11号的建议——他说投12号，理由是12号今天态度过于坚决，一上来就全仓押8号，带节奏的力度比正常好人该有的谨慎程度要强。我得说，这个观察角度是有道理的。\\n\\n而且12号刚才拍桌子回怼11号那个状态……我理解12号你性格直爽，但说实话，一个真正的好人面对这种复杂的对跳局面，多少会有点犹豫和纠结吧？12号你从第一轮发言就几乎锁定要投2号了，这个判断速度确实有点快。\\n\\n所以我今天的投票倾向是：**投12号。** 不是说我认定12号就是间谍，而是在今天这个信息量不足、2号和8号之间不能冒险的情况下，选一个行为最值得怀疑的人来验证一下，是比较稳妥的选择。\\n\\n（语气温和地笑了笑）\\n当然，这只是我4号个人的想法，最终怎么投票大家自己判断。大家辛苦了，咱们投票见分晓吧。\", \"metadata\": {\"vote\": \"12号\", \"reason\": \"12号从第一轮发言就全仓押8号、态度过于坚决地要投2号，判断速度过快，带节奏力度远超正常好人的谨慎程度，值得今天验证。\", \"suspicion_level\": 6}}}", "metadata": {"model_name": "deepseek-v4-flash", "input_tokens": null, "output_tokens": null, "latency_ms": null}, "score": 55.0, "metrics": {}}, {"id": 49, "round": null, "phase": "day_vote", "player": "PUA总裁", "role": "女巫", "category": "other", "action": "模型调用", "target": null, "reason": "", "raw": "{\"event_type\": \"model_call\", \"timestamp\": \"2026-05-28T00:26:53\", \"player\": \"PUA总裁\", \"role\": \"女巫\", \"phase\": \"day_vote\", \"model_name\": \"deepseek-v4-flash\", \"prompt_version\": \"v2\", \"input_tokens\": null, \"output_tokens\": null, \"latency_ms\": null, \"seat\": \"5号\", \"output_content\": {\"content\": \"（缓缓站起身，目光沉稳地扫视全场，语气温和但带着不容置疑的分量）\\n\\n好的，投票时间到了。5号来做最后的表态。\\n\\n经过两轮的完整发言，5号梳理出了几个关键数据点，跟大家对齐一下我的判断逻辑——\\n\\n**第一，关于时间线的硬伤。**\\n\\n8号指出的那个点非常关键：夜里间谍刀人行动和HR总监背调是同时发生的。2号所谓的\\\"灭口\\\"逻辑——如果间谍团队在夜里就知道了2号的背调结果然后刀掉6号——这在时间线上根本说不通，因 : null, \"latency_ms\": null, \"seat\": \"1号\", \"output_content\": {\"content\": \"我是1号，第二轮发言。现在信息量比昨天多了不少，我来做一轮数据分析更新。\\n\\n**数据点一：关于2号的出局性质。**\\n\\n2号昨天被投出后，系统没有特别公告他的身份信息。这本身是一个数据信号——如果他是真HR总监，系统通常会显示\\\"HR总监已离职\\\"这类信息来告知阵营损失。没有特别提示，从数据层面反向推断，2号大概率是普通间谍身份而非神职。这在一定程度上验证了昨天的投票决策是合理的。\\n\\n**数据点二：关于8号的背调结果——7号是清白员工。**\\n\\n这个数据点的价值在于：7号是活人，不同于已出局的6号。这意味着8号的信息是可以被后续验证的——如果7号后续行为异常或与其他信息矛盾，8号的可信度就会大幅下降。目前来看，7号的发言风格一贯是谨慎摇摆型，与\\\"清白员工\\\"的身份特征吻合，没有明显矛盾。\\n\\n从概率角度分析，如果8号是冒充的间谍，他有两个选择：\\nA. 给一个活人发\\\"金水\\\"（说他是好人）——安全，因为活人不太会自爆是间谍\\nB. 给一个活人发\\\"查杀\\\"（说他是间谍）——高风险，因为对方会激烈反驳\\n\\n8号选择了A方案，这是最稳妥的冒充策略。所以单从\\\"给活人发金水\\\"这个操作本身，并不能作为8号可信的证据——因为间谍也会选择同样的低风险策略。\\n\\n**数据点三：关于昨晚的平安夜。**\\n\\n平安夜有两种可能解释：\\n- 解释1：间谍想刀8号但被保护了——这支持8号是真的HR总监\\n- 解释2：间谍团队故意不行动，让局势更模糊——这有利于冒充者巩固地位\\n\\n目前没有足够数据区分这两种可能。12号声称\\\"有理由相信8号被保护了\\\"——但12号并没有公布自己的身份或信息源，这部分信息缺乏验证条件。从样本量来看，单凭平安夜这一个数据点不足以支撑任何方向的确定性判断。\\n\\n**数据点四：关注投票数据异常。**\\n\\n我注意到一个现象——昨天12号极度激进地支持8号、攻击2号；今天12号依然保持同样力度，甚至开始声称有\\\"内部信息\\\"证明8号被保护了。从数据层面看，这种持续高强度的单边站队行为，在概率分布上属于异常值——正常好人面对双跳局面应该有一定程度的摇摆和审慎，而非从一开始就全仓押注。当然，这只是一个统计异常信号，并非确凿证据。\\n\\n**我的决策逻辑：**\\n\\n目前我的概率权重分配如下：\\n- 8号是真实HR总监的概率：约60%（背调结果自洽、时间线逻辑占优）\\n- 8号是冒充间谍的概率：约40%（独自控场、缺乏制衡、给活人发金水也可能是策略）\\n\\n这个置信度有所提升，但还没到完全确信的程度。今天我会继续观察8号的后续信息和他对11号提问的回应。如果8号能给出更多无法伪造的独家信息，我会进一步上调可信度。\\n\\n关于今天的投票，我暂时不锁定目标，先听完所有人的发言再做分析决策。\", \"metadata\": null}}", "metadata": {"model_name": "deepseek-v4-flash", "input_tokens": null, "output_tokens": null, "latency_ms": null}, "score": 55.0, "metrics": {}}, {"id": 107, "round": null, "phase": "day_vote_discussion", "player": "沉默侠", "role": "猎人", "category": "other", "action": "模型调用", "target": null, "reason": "", "raw": "{\"event_type\": \"model_call\", \"timestamp\": \"2026-05-28T00:32:24\", \"player\": \"沉默侠\", \"role\": \"猎人\", \"phase\": \"day_vote_discussion\", \"model_name\": \"deepseek-v4-flash\", \"prompt_version\": \"v2\", \"input_tokens\": null, \"output_tokens\": null, \"latency_ms\": null, \"seat\": \"3号\", \"output_content\": {\"content\": \ put_tokens": null, "latency_ms": null}, "score": 55.0, "metrics": {}}, {"id": 110, "round": null, "phase": "day_vote_discussion", "player": "小透明", "role": "村民", "category": "other", "action": "模型调用", "target": null, "reason": "", "raw": "{\"event_type\": \"model_call\", \"timestamp\": \"2026-05-28T00:33:08\", \"player\": \"小透明\", \"role\": \"村民\", \"phase\": \"day_vote_discussion\", \"model_name\": \"deepseek-v4-flash\", \"prompt_version\": \"v2\", \"input_tokens\": null, \"output_tokens\": null, \"latency_ms\": null, \"seat\": \"7号\", \"output_content\": {\"content\": \"（有些紧张地搓了搓手，先是看了看8号，又看了看3号和12号）\\n\\n那个...我是7号。刚才大家都提到了我，说8号给了我一个金水，说我是清白员工。\\n\\n首先我得说...我自己知道我是普通员工，所以我确实不是间谍。8号这个背调结果...至少在我这里是准的。但我也知道，光是我自己说\\\"我是好人\\\"没有用，大家还是要看后面信息能不能对得上。\\n\\n然后我想说说3号跳法务总监这个事情...（声音不大）\\n\\n我不太确定该怎么说，但是...3号前两轮发言我一直觉得挺有道理的，逻辑很清晰，说话也很冷静。如果3号真的是法务总监，那有个能带队的人也挺好。但是我又有点担心...昨天是2号和8号对跳HR，今天就只有8号一个人了，然后3号又跳出来说法务总监...我这个小透明都有点晕了。\\n\\n不过3号建议投12号...（犹豫了一下）我其实昨天也觉得12号有点太着急了。12号从昨天就开始猛站8号，今天又说\\\"有理由相信8号被保护了\\\"但也不说为什么...这个确实让我有点在意。如果12号是好人，他怎么会知道8号被保护了的细节呢？除非他是安保主管或者CEO...但他也没亮明身份啊。\\n\\n可能我想多了...但我就是觉得，12号这个信息源说清楚会比较好。\\n\\n（看了看8号，声音更小）\\n8号，谢谢你给我发金水...虽然我也不知道怎么证明自己是好人，但我会继续认真听大家的分析的。我就先听大家怎么说，再看看今天投谁比较合适。\", \"metadata\": null}}", "metadata": {"model_name": "deepseek-v4-flash", "input_tokens": null, "output_tokens": null, "latency_ms": null}, "score": 55.0, "metrics": {}}, {"id": 111, "round": null, "phase": "day_vote_discussion", "player": "逻辑怪", "role": "预言家", "category": "other", "action": "模型调用", "target": null, "reason": "", "raw": "{\"event_type\": \"model_call\", \"timestamp\": \"2026-05-28T00:33:27\", \"player\": \"逻辑怪\", \"role\": \"预言家\", \"phase\": \"day_vote_discussion\", \"model_name\": \"deepseek-v4-flash\", \"prompt_version\": \"v2\", \"input_tokens\": null, \"output_tokens\": null, \"latency_ms\": null, \"seat\": \"8号\", \"output_content\": {\"content\": \"（整理了一下桌面，双手平放，目光沉静地扫视全场）\\n\\n好，现在信息量已经足够大，8号来做第三轮的系统性分析。\\n\\n---\\n\\n**第一，关于3号亮明法务总监身份。**\\n\\n从逻辑上讲，法务总监在这个 adata\": null}}", "metadata": {"model_name": "deepseek-v4-flash", "input_tokens": null, "output_tokens": null, "latency_ms": null}, "score": 55.0, "metrics": {}}, {"id": 224, "round": null, "phase": "day_discussion", "player": "老油条", "role": "村民", "category": "other", "action": "模型调用", "target": null, "reason": "", "raw": "{\"event_type\": \"model_call\", \"timestamp\": \"2026-05-28T00:48:51\", \"player\": \"老油条\", \"role\": \"村民\", \"phase\": \"day_discussion\", \"model_name\": \"deepseek-v4-flash\", \"prompt_version\": \"v2\", \"input_tokens\": null, \"output_tokens\": null, \"latency_ms\": null, \"seat\": \"9号\", \"output_content\": {\"content\": \"（慢悠悠地站起身，听到7号的话后微微挑眉，但很快恢复平静）\\n\\n9号说两句。7号刚才提到我，说觉得我一直在观望、然后跟风投票——这个观察我认。没错，9号我确实性格谨慎，不喜欢冲在第一线当出头鸟，在公司混了十几年养成的习惯，没办法。\\n\\n但是7号，你说我\\\"看到风向明确了就跟着走\\\"——这个说法我得稍微掰扯一下。\\n\\n第一天的投票，我投了2号。当时8号指出了2号\\\"灭口说\\\"的时间线硬伤，我觉得有道理，所以投了2号。这不是跟风，是我自己做了判断。\\n\\n第二天的投票，我投了12号。那是因为12号的行为确实异常——拍桌子带节奏、声称有内部信息又不说明来源。3号法务总监点出这个问题后，我认同这个逻辑才投的。\\n\\n第三天的投票，全场一致投4号——8号的背调数据、5号CEO的交叉验证、3号法务总监的带队，三条信息线全部指向4号。这个情况下不投4号才叫有问题吧？\\n\\n（摊手笑了笑）\\n所以我不是在盲目跟风，我是在信息足够明确的时候做出选择。如果我在信息不足的时候就跳出来带节奏，那才叫不负责任，对吧？\\n\\n不过7号你提的这个点本身是好的——提醒大家不要盲目跟票。那我反过来也问问：7号你作为8号的金水，这几天你的判断是什么？除了刚才说觉得我有点可疑之外，你对1号、10号、11号有什么看法？谁是间谍的可能性更大？\\n\\n（环视一圈）\\n\\n我现在的想法是这样的：已知3号法务、5号CEO、7号金水是确认的好人。剩下的1号、9号（我）、10号、11号四个人里，至少有一到两个间谍。\\n\\n我自己的身份我自己清楚，我不是间谍。所以我的怀疑范围锁定在1号、10号、11号三个人身上。\\n\\n我特别想听听1号、10号、11号，你们三个怎么看待彼此？你们觉得谁最有问题？这能帮我们缩小范围。\", \"metadata\": null}}", "metadata": {"model_name": "deepseek-v4-flash", "input_tokens": null, "output_tokens": null, "latency_ms": null}, "score": 55.0, "metrics": {}}, {"id": 225, "round": null, "phase": "day_discussion", "player": "铁头哥", "role": "狼人", "category": "other", "action": "模型调用", "target": null, "reason": "", "raw": "{\"event_type\": \"model_call\", \"timestamp\": \"2026-05-28T00:49:08\", \"player\": \"铁头哥\", \"role\": \"狼人\", \"phase\": \"day_discussion\", \"model_name\": \"deepseek-v4-flash\", \"prompt_version\": \"v2\", \"input_tokens\": null, \"output_tokens\": null, \"latency_ms\": null, \"seat\": \"10号\", \"output_content\": {\"content\": \"（语气沉稳，不紧不慢地站起身）\\n\\n我是10号。第四天，8号昨晚出局了。说实话不意外——8号白天刚公布了4号是间谍，夜间就被灭口了。这恰恰反向验证了两件事：第一，8号是真的HR总监，间谍不会刀自己人；第二，4号确实是间谍，不然间谍不会急着灭口。\\n\\n**现在存活7人：1、3、5、7、9、10、11。**\\n\\n3号法务总监、5号CEO、7号金水——这三个身份相对清晰。剩下的1号、9号、10号（我）、11号，这四个人里至少还有1-2个间谍。\\n\\n**关于9号刚才的发言——**\\n\\n9号说\\\"我自己的身份我自己清楚，我不是间谍\\\"，然后直接把怀疑范围锁定在1、10、11三个人身上。等于把自己摘出去了。\\n\\n（停顿一下，语气认真）\\n\\n9号，你这个操作我注意到了。你说你\\\"在信息明确的时候才做选择\\\"——但问题是你\\\"等信息明确\\\"的这个行为本身，是不是一种最安全的间谍策略？真好人也可以谨慎，但间谍也可以是\\\"等到安全了才跟票\\\"的深水型选手。你从第一天到第三天，没有一次主动带过节奏，永远是在别人把路探清楚了、方向确定了你才跟上。这种\\\"永远不掉队、永远不带头\\\"的模式，恰恰是深水型间谍的标准操作。\\n\\n**关于我自己和11号——**\\n\\n我跟11号在第三天的投票都投了4号。如果我和11号是4号的队友，为什么要亲手送走自己的战友？这个逻辑是硬邦邦的——间谍不会亲手投票让自己的队友出局。我们投了4号这个履历，至少说明我们跟4号不是一伙的。\\n\\n**所以我现在的怀疑排序——**\\n\\n1号 > 9号 > 11号 > 10号（我）\\n\\n1号的问题：三天下来，做了三套数据分析，每套看起来都逻辑严密，但从不锁定具体目标。第一天说\\\"等更多信息\\\"，第二天说\\\"数据还不够\\\"，第三天说\\\"接受数据链但还要观察\\\"——**永远在分析，永远不决策**。这种只分析不定罪的风格，是最安全的隐藏方式。\\n\\n9号的问题：我刚才说了，永远等风向明确了才跟票，从不主动带队。这种\\\"安全第一\\\"的操作模式在职场里看着像老油条，但在狼人杀里，就是深水间谍的标准姿势。\\n\\n11号的表现？从第一天就开始锁定12号有嫌疑，第二天果断投票12号，第三天果断投票4号——判断力连贯、立场清晰。如果11号是间谍，不会这么积极地带节奏，因为冲在前面容易被集火。我目前对11号没有明显的怀疑点。\\n\\n**我今天的建议：**\\n\\n今天从1号和9号两个人中选一个。3号法务总监和5号CEO可以帮我们定方向，我跟票。\", \"metadata\": null}}", "metadata": {"model_name": "deepseek-v4-flash", "input_tokens": null, "output_tokens": null, "latency_ms": null}, "score": 55.0, "metrics": {}}, {"id": 226, "round": null, "phase": "day_discussion", "player": "嘴炮王", "role": "狼人", "category": "other", "action": "模型调用", "target": null, "reason": "", "raw": "{\"event_type\": \"model_call\", \"timestamp\": \"2026-05-28T00:49:22\", \"player\": \"嘴炮王\", \"role\": \"狼人\", \"phase\": \"day_discussion\", \"model_name\": \"deepseek-v4-flash\", \"prompt_version\": \"v2\", \"input_tokens\": null, \"output_tokens\": null, \"latency_ms\": null, \"seat\": \"11号\", \"output_content\": {\"content\": \"（双手交叉放在桌上，身体微微前倾，语气沉稳而带着思考的重量）\\n\\n11号发言。好，第四天了。8号昨晚走了——说实话，这个结果我昨晚睡觉前就有预感。白天刚公布4号是间谍，晚上就被刀了，这不是巧合，这是间谍团队在销毁信息源。8号是真HR总监，4号是间谍，这两件事已经不需要再争论了。\\n\\n**先说说我自己的立场——我是清白的。**\\n\\n我现在能拿出来的，就是我这三天的投票记录和发言记录，你们可以把我的每一句话、每一票拿去做回溯验证：\\n\\n- 第一天：质疑2号\\\"灭口说\\\"的逻辑硬伤，投票投了12号（因为当时2号和8号双跳，我在信息不足时没选边，选择了投带节奏最急的12号）\\n- 第二天：继续投12号——我第一轮就怀疑他，这个立场是连贯的\\n- 第三天：投4号——8号的背调数据出来后果断跟票\\n\\n兄弟们想想看，如果我是4号的队友，我为什么要连投两轮票送4号出局？如果我是间谍，我为什么要这么积极地清理自己的队友？这个逻辑，比任何分析都硬。\\n\\n**关于我的怀疑方向——**\\n\\n10号刚才的分析我大部分认同，特别是对9号的判断：\\\"永远等风向明确了才跟票，从不主动带队\\\"——这个节奏确实值得关注。但是我想补充一个角度。\\n\\n**1号的问题：**\\n\\n1号，你从第一天就做数据分析，每套分析都看起来很专业、很严密。但是你有没有发现一个模式——你每次的结论都是\\\"不急于下结论\\\"、\\\"等更多信息\\\"、\\\"先观察\\\"？第一天这样说，第二天这样说，第三天也这样说。到了第四天了，8号死了，4号确认是间谍了，你还打算\\\"等更多信息\\\"到什么时候？\\n\\n我不是说1号一定是间谍，但这种\\\"只分析不决策\\\"的风格，恰恰是最安全的隐藏方式——因为永远不会因为判断错误而被问责。\\n\\n**关于9号——**\\n\\n9号刚才说\\\"我自己的身份我自己清楚，我不是间谍\\\"——这话谁都能说。但你看看你的行为轨迹：第一天观望、第二天跟3号、第三天跟全场——没有一个步骤是你主动迈出的，每一个决策都是等别人铺好路了你才走上去。这个模式，在职场里叫\\\"老油条\\\"，在狼人杀里叫\\\"深潜型间谍\\\"。\\n\\n**关于10号——**\\n\\n10号的发言我一直觉得逻辑清晰、立场明确。而且他跟我一样连着投了4号两轮——如果他是4号的队友，不会这么做。我对10号目前没有怀疑。\\n\\n**所以我的怀疑排序：**\\n\\n1号 ≥ 9号 > 10号 > 11号（我）\\n\\n今天我的建议：在1号和9号之间选一个。具体选谁，我听听3号和5号的意见后再定——但我倾向于支持1号，因为1号的\\\"只分析不决策\\\"模式持续了四天，这个惯性本身就是一个数据信号。\", \"metadata\": null}}", "metadata": {"model_name": "deepseek-v4-flash", "input_tokens": null, "output_tokens": null, "latency_ms": null}, "score": 55.0, "metrics": {}}, {"id": 227, "round": null, "phase": "day_vote_discussion", "player": "表格人", "role": "村民", "category": "other", "action": "模型调用", "target": null, "reason": "", "raw": "{\"event_type\": \"model_call\", \"timestamp\": \"2026-05-28T00:49:33\", \"player\": \"表格人\", \"role\": \"村民\", \"phase\": \"day_vote_discussion\", \"model_name\": \"deepseek-v4-flash\", \"prompt_version\": \"v2\", \"input_tokens\": null, \"output_tokens\": null, \"latency_ms\": null, \"seat\": \"1号\", \"output_content\": {\"content\": \"我是1号。感谢10号和11号对我的质疑——这是正常的分析流程，我接受检验。让我用数据回应。\\n\\n**关于我\\\"只分析不决策\\\"的指控——我需要纠正这个数据偏差。**\\n\\n我的投票记录：\\n- 第一天：投2号（在双跳信息不足时做出了概率最优选择）\\n- 第二天：投4号（全场7票投12号，我是唯一投4号的——这不是\\\"不决策\\\"，而是在大多数人跟风3号带票时，我做出了独立判断）\\n- 第三天：投4号（与全场一致 总监有诉讼权。如果今天投对，人数优势将进一步扩大。\", \"metadata\": null}}", "metadata": {"model_name": "deepseek-v4-flash", "input_tokens": null, "output_tokens": null, "latency_ms": null}, "score": 55.0, "metrics": {}}, {"id": 229, "round": null, "phase": "day_vote_discussion", "player": "PUA总裁", "role": "女巫", "category": "other", "action": "模型调用", "target": null, "reason": "", "raw": "{\"event_type\": \"model_call\", \"timestamp\": \"2026-05-28T00:49:53\", \"player\": \"PUA总裁\", \"role\": \"女巫\", \"phase\": \"day_vote_discussion\", \"model_name\": \"deepseek-v4-flash\", \"prompt_version\": \"v2\", \"input_tokens\": null, \"output_tokens\": null, \"latency_ms\": null, \"seat\": \"5号\", \"output_content\": {\"content\": \"（缓缓站起身，目光沉稳地扫视全场，双手撑着桌面，语气带着CEO最终的决断力）\\n\\n好的，所有人都发言完毕了。5号来做最终的判断。\\n\\n首先，5号要确认一个关键数据点——**1号第二天投4号的记录。**\\n\\n这个数据非常重要。第二天全场7票投12号，只有1号一个人投了4号。当时4号还没有被8号背调出间谍身份，1号是在信息不充分的情况下做出独立判断，没有跟风3号的带队方向。\\n\\n各位想想，如果1号是深水间谍，他会怎么做？最安全的策略是跟风投12号，混在人群中不引起注意。但他偏偏投了一个当时无人关注的4号——这个操作不仅不能救队友，还会让自己成为少数派被关注。**间谍不会做这种吃力不讨好的事。** 所以这个数据点对1号来说是强有力的身份证明。\\n\\n其次，再看9号的四天行为轨迹——\\n\\n第一天：2号抛出\\\"灭口说\\\"时，大家都在质疑，9号观望不表态。\\n第二天：3号带队投12号，9号跟了。\\n第三天：全场投4号，9号跟了。\\n今天：先把自己摘出嫌疑人名单（\\\"我自己的身份我自己清楚\\\"），然后锁定1、10、11三个人。\\n\\n**永远不掉队、永远不带队、永远等风向明确了再跟票**——这个行为模式持续了四天，已经形成了足够的数据样本。正如10号和11号分析的，这确实是深潜型间谍的标准画像。\\n\\n而且9号今天有一个举动值得注意——在被7号质疑后，他没有正面回应自己的嫌疑，而是反问7号\\\"你对1号、10号、11号有什么看法\\\"，试图把焦点转回其他人身上。这个\\\"反问转移\\\"的操作，在职场里我们都很熟悉——当被质疑时，不正面回应，而是反手抛一个问题出去让对手去接。\\n\\n**关于10号和11号——**\\n\\n两人连续几天投票一致指向已知间谍方向，这个投票履历是干净的。间谍理论上可以\\\"弃车保帅\\\"亲手送走队友，但在主动性和连贯性上，10号和11号的判断模式更符合好人的行为曲线。\\n\\n**5号的最终判断：**\\n\\n我认可3号法务总监的分析结论——**今天投票让9号离职。**\\n\\n另外，5号手里还有一封辞退信。如果今天的投票结果正确验证了方向——9号是间谍——那剩下的嫌疑人范围会进一步缩小，我会在适当时机使用辞退信做最终清扫，不给间谍任何翻盘的机会。\\n\\n但如果9号出局后系统证明他是好人……那我们可能需要重新审视1号、10号、11号的关系链。\\n\\n不过以目前的信息量和证据链来看，9号的嫌疑等级是最高的。\\n\\n**5号投票：9号。**\\n\\n请大家投票。\", \"metadata\": null}}", "metadata": {"model_name": "deepseek-v4-flash", "input_tokens": null, "output_tokens": null, "latency_ms": null}, "score": 55.0, "metrics": {}}, {"id": 230, "rou <script>
let R=null;
const TRAD2WORK={"狼人":"间谍","预言家":"HR总监","女巫":"CEO","猎人":"法务总监","守护者":"安保主管","村民":"普通员工"};
const WORK2TRAD={"间谍":"狼人","HR总监":"预言家","CEO":"女巫","法务总监":"猎人","安保主管":"守护者","普通员工":"村民"};
const DEPTH=[{k:"L0",n:"反应层",lo:0,hi:20},{k:"L1",n:"推理层",lo:21,hi:40},{k:"L2",n:"反逻辑层",lo:41,hi:60},{k:"L3",n:"反反逻辑层",lo:61,hi:80},{k:"L4+",n:"高阶博弈层",lo:81,hi:100}];
const DIM_CN={"speech":"发言","vote":"投票","skill":"技能","other":"其他"};
function fmt(v,d=2){return v==null?"-":Number(v).toFixed(d)}
function roleCls(r){return r==="狼人"?"role-wolf":"role-good"}
function roleDisplay(r,both){if(both){const w=TRAD2WORK[r];return w?r+"("+w+")":r}return r}
function hasLLM(){return R.llm_judge_scores&&!R.llm_judge_scores.error&&R.llm_judge_scores.length>0}
function depthLvl(s){for(const d of DEPTH)if(s>=d.lo&&s<=d.hi)return d;return DEPTH[0]}
function scoreColor(s){return s>=70?"var(--success)":s>=50?"var(--warn)":"var(--danger)"}
function barFill(pct,c){return `<div class="bar-fill" style="width:${Math.max(2,pct)}%;background:${c}">${Math.round(pct)}%</div>`}
function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML}
function llmForPlayer(p){return(R.llm_judge_scores||[]).filter(x=>x.player===p)}
function llmForDecision(p,r){return(R.llm_judge_scores||[]).find(x=>x.player===p&&x.round===r)}
function playerTags(p){const ls=llmForPlayer(p);const m={};ls.forEach(x=>{const s=x.decision_tags&&x.decision_tags.strategy_used;if(s){m[s]=(m[s]||0)+1}});return Object.entries(m).sort((a,b)=>b[1]-a[1]).map(e=>e[0]+"×"+e[1]).join(", ")}

function renderSummary(){
  const s=R.summary||{},ds=R.dimension_scores||{};
  const llmCount=(R.llm_judge_scores||[]).length;
  let h=`<div class="cards">`;
  h+=`<div class="card"><div class="label">综合得分</div><div class="value" style="color:${scoreColor(s.overall_score)}">${fmt(s.overall_score)}</div></div>`;
  h+=`<div class="card"><div class="label">决策数</div><div class="value">${s.decision_count||0}</div></div>`;
  h+=`<div class="card"><div class="label">高危失误</div><div class="value" style="color:var(--danger)">${s.high_severity_mistakes||0}</div></div>`;
  h+=`<div class="card"><div class="label">中危失误</div><div class="value" style="color:var(--warn)">${s.medium_severity_mistakes||0}</div></div>`;
  const cov=s.coverage||{};
  h+=`<div class="card"><div class="label">投票事件</div><div class="value">${cov.vote||0}</div></div>`;
  h+=`<div class="card"><div class="label">技能事件</div><div class="value">${cov.skill||0}</div></div>`;
  h+=`<div class="card"><div class="label">发言事件</div><div class="value">${cov.speech||0}</div></div>`;
  if(hasLLM()){
    const avgConf=llmCount?R.llm_judge_scores.reduce((a,x)=>a+(x.llm_confidence||0),0)/llmCount:0;
    h+=`<div class="card"><div class="label">LLM评测</div><div class="value" style="color:var(--success)">${llmCount}条</div></div>`;
    h+=`<div class="card"><div class="label">LLM置信度</div><div class="value" style="color:var(--success)">${fmt(avgConf*100,0)}%</div></div>`;
  }
  h+=`</div>`;
  document.getElementById("summary-section").innerHTML=h;
  document.getElementById("header-meta").textContent=`生成时间: ${R.generated_at||""} | 来源: ${R.source_file||""}`;
}

function renderLeaderboard(){
  const lb=R.leaderboard||[];
  const llm=hasLLM();
  let h=`<thead><tr><th>#</th><th>玩家</th><th>角色</th><th>决策</th><th>发言</th><th>投票</th><th>技能</th><th>综合</th>`;
  if(llm)h+=`<th>融合分</th><th>策略标签</th>`;
  h+=`<th>高危</th></tr></thead><tbody>`;
  lb.forEach((e,i)=>{
    const rc=roleCls(e.role);
    h+=`<tr><td>${i+1}</td><td>${esc(e.player)}</td><td class="${rc}">${roleDisplay(e.role)}</td>`;
    h+=`<td>${e.decision_count||0}</td>`;
    h+=`<td>${fmt(e.speech_score,1)}</td><td>${fmt(e.vote_score,1)}</td><td>${fmt(e.skill_score,1)}</td>`;
    h+=`<td style="font-weight:700;color:${scoreColor(e.overall_score)}">${fmt(e.overall_score)}</td>`;
    if(llm){
      const ls=llmForPlayer(e.player);
      const fused=ls.length?ls.reduce((a,x)=>a+(x.fused_score||0),0)/ls.length:e.overall_score;
      h+=`<td style="color:${scoreColor(fused)}">${fmt(fused)}</td>`;
      h+=`<td style="font-size:.8rem">${playerTags(e.player)||"-"}</td>`;
    }
    h+=`<td>${e.critical_mistakes||0}</td></tr>`;
  });
  h+=`</tbody>`;
  document.getElementById("leaderboard-table").innerHTML=h;
}

function renderDimensionComparison(){
  const ds=R.dimension_scores||{};
  const el=document.getElementById("dimension-section");
  let h=`<div class="chart-box"><h3>规则引擎评分</h3><div class="bar-chart">`;
  Object.entries(ds).forEach(([k,v])=>{
    h+=`<div class="bar-row"><div class="bar-label">${DIM_CN[k]||k}</div><div class="bar-container">${barFill(v,"linear-gradient(90deg,#3a7bd5,#00d2ff)")}</div></div>`;
  });
  h+=`</div></div>`;
  if(hasLLM()){
    const agg=R.llm_aggregate||{};const cu=agg.comparison_units||{};
    const dimAvg={};const dimCnt={};
    Object.values(cu).forEach(u=>{
      Object.entries(u.dimension_scores||{}).forEach(([dn,ds])=>{
        if(!dimAvg[dn]){dimAvg[dn]=0;dimCnt[dn]=0}
        dimAvg[dn]+=ds.mean;dimCnt[dn]++;
      });
    });
    Object.keys(dimAvg).forEach(k=>{dimAvg[k]/=dimCnt[k]});
    h+=`<div class="chart-box"><h3>LLM维度评分（均值）</h3><div class="bar-chart">`;
    const sorted=Object.entries(dimAvg).sort((a,b)=>b[1]-a[1]);
    sorted.forEach(([k,v])=>{
      h+=`<div class="bar-row"><div class="bar-label">${k}</div><div class="bar-container">${barFill(v,"linear-gradient(90deg,#ffd700,#ff8c00)")}</div></div>`;
    });
    h+=`</div></div>`;
    h+=`<div class="chart-box"><h3>规则 vs LLM 对比</h3><div class="bar-chart">`;
    const ruleMap={"推理质量":"other","信息利用":"other","言行一致性":"speech","博弈深度":"other","信息隐藏":"other"};
    sorted.forEach(([k,v])=>{
      const rk=ruleMap[k]||"other";const rv=ds[rk]||0;
      h+=`<div class="bar-row"><div class="bar-label">${k}</div>`;
      h+=`<div class="bar-container"><div class="bar-fill" style="width:${Math.max(2,rv)}%;background:linear-gradient(90deg,#3a7bd5,#00d2ff)">${Math.round(rv)}</div>`;
      h+=`<div class="bar-fill" style="width:${Math.max(2,v)}%;background:linear-gradient(90deg,#ffd700,#ff8c00)">${Math.round(v)}</div></div></div>`;
    });
    h+=`</div></div>`;
  }
  el.innerHTML=h;
}

function renderStrategyDistribution(){
  if(!hasLLM())return;
  const cu=(R.llm_aggregate||{}).comparison_units||{};
  const byRole={};
  Object.values(cu).forEach(u=>{
    const r=u.role||"?";const sd=u.strategy_distribution||{};
    if(!byRole[r])byRole[r]={};
    Object.entries(sd).forEach(([s,c])=>{byRole[r][s]=(byRole[r][s]||0)+c});
  });
  let h=`<div class="charts-grid">`;
  Object.entries(byRole).forEach(([role,strats])=>{
    const total=Object.values(strats).reduce((a,b)=>a+b,0);
    h+=`<div class="chart-box"><h3>${roleDisplay(WORK2TRAD[role]||role,true)}</h3><div class="bar-chart">`;
    Object.entries(strats).sort((a,b)=>b[1]-a[1]).forEach(([s,c])=>{
      h+=`<div class="bar-row"><div class="bar-label">${esc(s)}</div><div class="bar-container">${barFill(c/total*100,"linear-gradient(90deg,#4ecdc4,#00d2ff)")}<span style="margin-left:6px;font-size:.8rem">${c}次</span></div></div>`;
    });
    h+=`</div></div>`;
  });
  h+=`</div>`;
  document.getElementById("strategy-section").innerHTML=h;
}

function renderGameDepth(){
  if(!hasLLM())return;
  const bins={};DEPTH.forEach(d=>bins[d.k]=0);
  (R.llm_judge_scores||[]).forEach(x=>{
    const s=(x.llm_scores||{})["博弈深度"];if(s==null)return;
    bins[depthLvl(s).k]++;
  });
  const total=Object.values(bins).reduce((a,b)=>a+b,0)||1;
  let h=`<div class="bar-chart" style="max-width:600px">`;
  DEPTH.forEach(d=>{
    const c=bins[d.k];
    h+=`<div class="bar-row"><div class="bar-label">${d.k} ${d.n}</div><div class="bar-container">${barFill(c/total*100,"linear-gradient(90deg,#ff6b6b,#ffd700,#4ecdc4,#00d2ff,#a855f7)".split(",").slice(DEPTH.indexOf(d),DEPTH.indexOf(d)+1)[0]||"#00d2ff")}<span style="margin-left:6px;font-size:.8rem">${c}次</span></div></div>`;
  });
  h+=`</div>`;
  const colors=["#ff6b6b","#ffd700","#4ecdc4","#00d2ff","#a855f7"];
  let h2=`<div class="bar-chart" style="max-width:600px">`;
  DEPTH.forEach((d,i)=>{
    const c=bins[d.k];
    h2+=`<div class="bar-row"><div class="bar-label">${d.k} ${d.n}</div><div class="bar-container">${barFill(c/total*100,colors[i])}<span style="margin-left:6px;font-size:.8rem">${c}次</span></div></div>`;
  });
  h2+=`</div>`;
  document.getElementById("depth-section").innerHTML=h2;
}

function renderFindings(){
  const fs=R.findings||[];const top=fs.slice(0,15);
  let h="";
  if(!top.length){h=`<p style="color:var(--success)">未发现明显失误</p>`;document.getElementById("findings-section").innerHTML=h;return}
  top.forEach(f=>{
    const sc=f.severity==="high"?"finding-high":f.severity==="medium"?"finding-medium":"finding-low";
    h+=`<div class="finding-card ${sc}">`;
    h+=`<div class="title"><span class="tag ${f.severity==="high"?"tag-risk-high":f.severity==="medium"?"tag-risk-mid":"tag-risk-low"}">${f.severity}</span> 第${f.round||"-"}轮 ${esc(f.player)}（${roleDisplay(f.role)}）— ${esc(f.title)}</div>`;
    h+=`<div class="evidence">${esc(f.evidence||"")}</div>`;
    h+=`<div class="rec">建议: ${esc(f.recommendation||"")}</div>`;
    if(f.counterfactual)h+=`<div class="cf">反事实: ${esc(f.counterfactual)}</div>`;
    const llm=llmForDecision(f.player,f.round);
    if(llm){
      h+=`<div class="llm-comment">`;
      if(llm.overall_comment)h+=`<div>LLM点评: ${esc(llm.overall_comment)}</div>`;
      const dt=llm.decision_tags||{};
      if(dt.strategy_used)h+=`<span class="tag tag-strategy">${esc(dt.strategy_used)}</span>`;
      if(dt.mistake_type)h+=`<span class="tag tag-mistake">${esc(dt.mistake_type)}</span>`;
      if(dt.game_impact)h+=`<span class="tag tag-impact">${esc(dt.game_impact)}</span>`;
      h+=`</div>`;
    }
    h+=`</div>`;
  });
  if(fs.length>15)h+=`<div style="color:var(--muted);font-size:.85rem">共${fs.length}条，显示前15条</div>`;
  document.getElementById("findings-section").innerHTML=h;
}

function renderPlayerCards(){
  const lb=R.leaderboard||[];const evts=R.events||[];
  let h="";
  lb.forEach(e=>{
    const rc=roleCls(e.role);
    const pEvts=evts.filter(x=>x.player===e.player).slice(-10);
    const llm=llmForPlayer(e.player);
    h+=`<div class="player-card">`;
    h+=`<div class="pheader"><div><div class="pname">${esc(e.player)}</div><div class="${rc}" style="font-size:.85rem">${roleDisplay(e.role)}</div></div>`;
    h+=`<div class="pscore" style="color:${scoreColor(e.overall_score)}">${fmt(e.overall_score)}</div></div>`;
    [["发言",e.speech_score,"#00d2ff"],["投票",e.vote_score,"#4ecdc4"],["技能",e.skill_score,"#ffd700"]].forEach(([lb2,v,c])=>{
      h+=`<div class="stat"><span class="k">${lb2}</span><span>${fmt(v,1)}</span></div>`;
      h+=`<div class="stat-bar"><div class="stat-bar-fill" style="width:${Math.max(1,v)}%;background:${c}"></div></div>`;
    });
    if(llm.length){
      const fused=llm.reduce((a,x)=>a+(x.fused_score||0),0)/llm.length;
      h+=`<div class="stat" style="margin-top:8px"><span class="k">融合分</span><span style="color:${scoreColor(fused)}">${fmt(fused)}</span></div>`;
      const tags=playerTags(e.player);
      if(tags)h+=`<div style="margin-top:4px;font-size:.8rem">${tags}</div>`;
    }
    h+=`<div class="event-timeline">`;
    pEvts.forEach(ev=>{
      h+=`<div class="ev">第${ev.round||"-"}轮 ${ev.category==="vote"?"投票→"+esc(ev.target||"?"):ev.category==="skill"?esc(ev.action||"技能"):"发言"} <span style="color:${scoreColor(ev.score||0)}">${fmt(ev.score,0)}</span></div>`;
    });
    h+=`</div></div>`;
  });
  document.getElementById("players-section").innerHTML=h;
}

function renderLLMAggregate(){
  if(!hasLLM())return;
  const cu=(R.llm_aggregate||{}).comparison_units||{};
  let h="";
  Object.entries(cu).forEach(([key,u])=>{
    const parts=key.split("|");const role=u.role||parts[0]||"?";const et=u.event_type||parts[1]||"?";const stage=u.game_stage||parts[2]||"";
    h+=`<div class="chart-box" style="margin-bottom:16px">`;
    h+=`<h3>${roleDisplay(WORK2TRAD[role]||role,true)} | ${et}${stage?" | "+stage:""} <span style="color:var(--muted);font-size:.8rem">(${u.sample_count||0}样本)</span></h3>`;
    h+=`<div class="bar-chart">`;
    Object.entries(u.dimension_scores||{}).sort((a,b)=>b[1].mean-a[1].mean).forEach(([dn,ds])=>{
      h+=`<div class="bar-row"><div class="bar-label">${dn}</div><div class="bar-container">${barFill(ds.mean,"linear-gradient(90deg,#4ecdc4,#00d2ff)")}<span style="margin-left:6px;font-size:.78rem;color:var(--muted)">${fmt(ds.mean,1)} ±${fmt(ds.std,1)} [${fmt(ds.ci95[0],1)},${fmt(ds.ci95[1],1)}]</span></div></div>`;
    });
    h+=`</div>`;
    const sd=u.strategy_distribution||{};
    if(Object.keys(sd).length){
      h+=`<div style="margin-top:8px;font-size:.85rem">策略: `;
      Object.entries(sd).sort((a,b)=>b[1]-a[1]).forEach(([s,c])=>{h+=`<span class="tag tag-strategy">${esc(s)}×${c}</span>`});
      h+=`</div>`;
    }
    const cm=u.common_mistakes||[];
    if(cm.length)h+=`<div style="margin-top:4px;font-size:.82rem;color:var(--danger)">常见失误: ${cm.map(esc).join(", ")}</div>`;
    h+=`</div>`;
  });
  document.getElementById("aggregate-section").innerHTML=h;
}

function renderDiscrepancies(){
  if(!hasLLM())return;
  const items=[];
  (R.llm_judge_scores||[]).forEach(x=>{
    (x.score_discrepancies||[]).forEach(d=>{items.push({...d,player:x.player,round:x.round,event_type:x.event_type,comment:x.overall_comment})});
  });
  items.sort((a,b)=>Math.abs(b.gap)-Math.abs(a.gap));
  const top=items.slice(0,12);
  if(!top.length){document.getElementById("discrepancy-section").innerHTML=`<p style="color:var(--muted)">规则引擎与LLM评分无显著差异</p>`;return}
  let h="";
  top.forEach(d=>{
    h+=`<div class="discrepancy-card">`;
    h+=`<div style="font-weight:700">${esc(d.player)} 第${d.round||"-"}轮 ${d.event_type||""} — <span class="gap">差距 ${fmt(d.gap,1)}</span></div>`;
    h+=`<div style="margin-top:4px;font-size:.88rem">规则: <span style="color:var(--accent)">${fmt(d.rule)}</span> | LLM: <span style="color:var(--warn)">${fmt(d.llm)}</span></div>`;
    if(d.comment)h+=`<div style="margin-top:4px;font-size:.82rem;color:var(--muted)">LLM点评: ${esc(d.comment)}</div>`;
    h+=`</div>`;
  });
  document.getElementById("discrepancy-section").innerHTML=h;
}

function renderCounterfactuals(){
  const cfs=R.counterfactuals||[];const fs=R.findings||[];
  if(!cfs.length&&!fs.length){document.getElementById("counterfactual-section").innerHTML=`<p style="color:var(--muted)">暂无反事实数据</p>`;return}
  let h="";
  cfs.slice(0,10).forEach((c,i)=>{
    h+=`<div class="counterfactual-card"><div class="cf-title">推演 #${i+1}</div><div class="cf-body">${esc(c)}</div></div>`;
  });
  if(cfs.length>10)h+=`<div style="color:var(--muted);font-size:.85rem">共${cfs.length}条，显示前10条</div>`;
  document.getElementById("counterfactual-section").innerHTML=h;
}

document.addEventListener("DOMContentLoaded",()=>{
  try{R=JSON.parse(document.getElementById("report-data").textContent)}catch(e){console.error("Failed to parse report data",e);return}
  if(hasLLM())document.querySelectorAll(".llm-only").forEach(el=>el.style.display="block");
  renderSummary();renderLeaderboard();renderDimensionComparison();
  if(hasLLM()){renderStrategyDistribution();renderGameDepth();renderLLMAggregate();renderDiscrepancies()}
  renderFindings();renderPlayerCards();renderCounterfactuals();
});
</script>
</body>
</html>

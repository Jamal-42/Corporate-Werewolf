<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>职场狼人杀评测Dashboard</title>
<style>
:root{--bg:#1a1a2e;--bg2:#16213e;--surface:rgba(255,255,255,.05);--border:rgba(255,255,255,.1);--accent:#00d2ff;--danger:#ff6b6b;--warn:#ffd700;--success:#4ecdc4;--info:#285a84;--text:#e0e0e0;--muted:#888;--font:-apple-system,"Microsoft YaHei","PingFang SC",sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:linear-gradient(135deg,var(--bg) 0%,var(--bg2) 100%);color:var(--text);min-height:100vh;padding:20px;font-size:16px;line-height:1.6}
.container{max-width:1400px;margin:0 auto}
.header{text-align:center;padding:30px 0;border-bottom:1px solid var(--border);margin-bottom:30px}
.header h1{font-size:2.2rem;background:linear-gradient(90deg,#00d2ff,#3a7bd5);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header .meta{color:var(--muted);margin-top:10px;font-size:.9rem}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:30px}
.card{background:var(--surface);border-radius:12px;padding:18px;border:1px solid var(--border);transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.card .label{color:var(--muted);font-size:.85rem;margin-bottom:6px}
.card .value{font-size:1.8rem;font-weight:700;color:var(--accent)}
.section{background:var(--surface);border-radius:12px;padding:24px;margin-bottom:28px;border:1px solid var(--border)}
.section h2{color:#fff;margin-bottom:18px;padding-bottom:10px;border-bottom:1px solid var(--border);font-size:1.3rem}
.llm-only{display:none}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border)}
th{background:rgba(0,210,255,.1);color:var(--accent);font-weight:600;white-space:nowrap}
tr:hover{background:rgba(255,255,255,.03)}
.role-wolf{color:var(--danger)}
.role-good{color:var(--success)}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.75rem;margin:1px 2px}
.tag-strategy{background:rgba(0,210,255,.2);color:var(--accent)}
.tag-risk-high{background:rgba(255,107,107,.2);color:var(--danger)}
.tag-risk-mid{background:rgba(255,215,0,.2);color:var(--warn)}
.tag-risk-low{background:rgba(78,205,196,.2);color:var(--success)}
.tag-mistake{background:rgba(255,107,107,.15);color:#ff9999}
.tag-impact{background:rgba(255,215,0,.15);color:#ffe066}
.bar-chart{display:flex;flex-direction:column;gap:6px}
.bar-row{display:flex;align-items:center;gap:8px}
.bar-label{width:80px;font-size:.82rem;text-align:right;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-container{flex:1;height:22px;background:rgba(255,255,255,.08);border-radius:6px;overflow:hidden;display:flex}
.bar-fill{height:100%;border-radius:6px;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;font-size:.72rem;color:#fff;min-width:24px;transition:width .5s ease}
.bar-rule{background:linear-gradient(90deg,#3a7bd5,#00d2ff)}
.bar-llm{background:linear-gradient(90deg,#ffd700,#ff8c00)}
.bar-fused{background:linear-gradient(90deg,#4ecdc4,#00d2ff)}
.charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;margin-top:16px}
.chart-box{background:rgba(255,255,255,.03);border-radius:10px;padding:16px;border:1px solid rgba(255,255,255,.06)}
.chart-box h3{margin-bottom:12px;color:#fff;font-size:1rem}
.finding-card{padding:14px;margin-bottom:10px;border-radius:0 8px 8px 0;border-left:3px solid}
.finding-high{background:rgba(255,107,107,.1);border-color:var(--danger)}
.finding-medium{background:rgba(255,215,0,.08);border-color:var(--warn)}
.finding-low{background:rgba(40,90,132,.1);border-color:var(--info)}
.finding-card .title{font-weight:700;margin-bottom:4px}
.finding-card .evidence{color:var(--muted);font-size:.85rem;margin-bottom:4px}
.finding-card .rec{color:var(--success);font-size:.85rem}
.finding-card .cf{color:var(--warn);font-size:.82rem;margin-top:4px;padding-top:4px;border-top:1px dashed rgba(255,255,255,.1)}
.finding-card .llm-comment{color:#c0c0ff;font-size:.82rem;margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.08)}
.player-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:16px}
.player-card{background:rgba(255,255,255,.03);border-radius:10px;padding:18px;border:1px solid rgba(255,255,255,.06)}
.player-card .pheader{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--border);margin-bottom:12px}
.player-card .pname{font-size:1.1rem;font-weight:700}
.player-card .pscore{font-size:1.4rem;font-weight:700;color:var(--accent)}
.player-card .stat{display:flex;justify-content:space-between;margin-bottom:6px;font-size:.88rem}
.player-card .stat .k{color:var(--muted)}
.stat-bar{height:6px;background:rgba(255,255,255,.08);border-radius:3px;margin-top:3px;overflow:hidden}
.stat-bar-fill{height:100%;border-radius:3px}
.event-timeline{margin-top:10px;max-height:200px;overflow-y:auto;font-size:.78rem}
.event-timeline .ev{padding:3px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.discrepancy-card{background:rgba(255,215,0,.06);border:1px solid rgba(255,215,0,.2);border-radius:8px;padding:14px;margin-bottom:10px}
.discrepancy-card .gap{font-size:1.2rem;font-weight:700;color:var(--warn)}
.agg-table{width:100%;font-size:.85rem}
.agg-table td,.agg-table th{padding:6px 8px}
.expand-btn{cursor:pointer;color:var(--accent);font-size:.82rem;border:none;background:none;padding:4px 0}
.expand-btn:hover{text-decoration:underline}
.counterfactual-card{background:rgba(255,215,0,.06);border-left:3px solid var(--warn);padding:12px;margin-bottom:8px;border-radius:0 8px 8px 0}
.counterfactual-card .cf-title{color:var(--warn);font-weight:700;font-size:.9rem}
.counterfactual-card .cf-body{color:var(--muted);font-size:.85rem;margin-top:4px}
@media(max-width:900px){.cards{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}.charts-grid{grid-template-columns:1fr}.player-grid{grid-template-columns:1fr}}
@media(max-width:560px){body{padding:10px}.section{padding:14px}table{font-size:.78rem}th,td{padding:6px}}
</style>
</head>

ens": null, "latency_ms": null}, "score": 55.0, "metrics": {}}, {"id": 27, "round": null, "phase": "day_discussion", "player": "沉默侠", "role": "守护者", "category": "other", "action": "模型调用", "target": null, "reason": "", "raw": "{\"event_type\": \"model_call\", \"timestamp\": \"2026-05-31T10:54:25\", \"player\": \"沉默侠\", \"role\": \"守护者\", \"phase\": \"day_discussion\", \"model_name\": \"deepseek-v4-flash\", \"prompt_version\": \"v2\", \"input_tokens\": null, \"output_tokens\": null, \"latency_ms\": null, \"seat\": \"5号\", \"output_content\": {\"content\": \"（沉默听完所有发言，微微点头）\\n\\n...我说一个点。\\n\\n现象：1号亮明HR总监身份，声称昨晚背调7号是间谍——7号已出局。1号又说2号是好人。\\n\\n分析：7号出局这件事，目前是唯一可验证的信息锚点。但注意——7号出局的原因，我们并不知道是间谍窃取、CEO辞退还是其他方式。如果1号是真HR总监，这个信息吻合。如果1号是冒充，他赌对了7号会被窃取，这是有风险的战术。\\n\\n另外，2号的反应值得记录——被发金水后的第一反应是质疑发金水者，这个模式不常见。\\n\\n结论：目前我会暂信1号的HR总监身份，但保持观察。其他信息太少，不急于定论。\\n\\n（说完继续沉默）\", \"metadata\": null}}", "metadata": {"model_name": "deepseek-v4-flash", "input_tokens": null, "output_tokens": null, "latency_ms": null}, "score": 55.0, "metrics": {}}, {"id": 28, "round": null, "phase": "day_discussion", "player": "嘴炮王", "role": "村民", "category": "other", "action": "模型调用", "target": null, "reason": "", "raw": "{\"event_type\": \"model_call\", \"timestamp\": \"2026-05-31T10:54:35\", \"player\": \"嘴炮王\", \"role\": \"村民\", \"phase\": \"day_discussion\", \"model_name\": \"deepseek-v4-flash\", \"prompt_version\": \"v2\", \"input_tokens\": null, \"output_tokens\": null, \"latency_ms\": null, \"seat\": \"6号\", \"output_content\": {\"content\": \"好的，我是6号。刚才听了1号到5号的发言，我跟你们讲啊，这个局面已经很明显了，但有些人还在绕弯子。\\n\\n**我先亮明我的立场——我暂信1号是HR总监。**\\n\\n兄弟们想想看，7号出局了，1号说背调7号是间谍，结果7号真走了。这还不明显吗？如果你是冒牌货，你敢随便点一个人说他是间谍，然后赌他刚好被窃取？除非1号是间谍团队的，他们商量好了今晚窃取7号，然后1号跳出来说查杀了7号——但7号如果是他们队友，他们为什么要牺牲队友？这逻辑不通！\\n\\n**然后我来说说2号的问题。**\\n\\n我跟你们讲啊，2号你被1号发了金水，按道理你应该高兴才对。结果呢？你第一个跳出来，用\\\"背调两个人\\\"这个细节疯狂攻击1号。这个行为我只能给你贴一个标签——**过度防御**。\\n\\n正常的好人收到金水，哪怕不完全信，也会先观望。你倒好，立马找漏洞、放大问题、带节奏质疑。我6号做销售这么多年，一个人是真心合作还是想搅局，我一眼就能看出来。你这个表现，我只能说你太急了。\\n\\n**但我也要说一句公道话——2号提的那个问题本身确 于2号——我同意各位说的，你的反应模式值得关注，但我不建议现在就钉死2号。给他一点空间，让他继续发言，看看他后续的言行是否一致。\\n\\n**我对齐一下我的立场：** 我暂时把1号放在\\\"高度可信\\\"的位置，但保留观察权。2号列入重点关注名单但不是今天的投票目标。今天的首要任务是——看有没有人跟1号对质HR总监身份。\\n\\n这就是我的想法。9号、10号、11号、12号，你们还没怎么发言，我希望听听你们的判断。特别是9号，我刚才注意到你一直没怎么说话，沉默的人往往信息量最大，不是吗？\", \"metadata\": null}}", "metadata": {"model_name": "deepseek-v4-flash", "input_tokens": null, "output_tokens": null, "latency_ms": null}, "score": 55.0, "metrics": {}}, {"id": 30, "round": null, "phase": "day_discussion", "player": "小透明", "role": "狼人", "category": "other", "action": "模型调用", "target": null, "reason": "", "raw": "{\"event_type\": \"model_call\", \"timestamp\": \"2026-05-31T10:54:50\", \"player\": \"小透明\", \"role\": \"狼人\", \"phase\": \"day_discussion\", \"model_name\": \"deepseek-v4-flash\", \"prompt_version\": \"v2\", \"input_tokens\": null, \"output_tokens\": null, \"latency_ms\": null, \"seat\": \"9号\", \"output_content\": {\"content\": \"啊...那个...我是9号。突然被8号点到，我有点紧张。（尴尬地笑了笑）\\n\\n说实话，我一直在听大家说，信息量有点大，我还在消化中。我不太确定自己能不能分析得像3号、4号那么清楚...\\n\\n但既然被点名了，我就说说我的想法吧。\\n\\n第一，关于1号HR总监这个事情。7号确实出局了，1号又说背调了7号是间谍...这个事实是吻合的，我觉得这个应该是最重要的信息点吧。我不太懂那些复杂的概率分析，但感觉如果1号是假的，他赌对7号是间谍的概率也太低了...所以我觉得1号大概率是真的HR总监。\\n\\n第二，关于2号说的那个\\\"背调两个人\\\"的问题。呃...我其实也没太懂这个规则细节，但1号今天说的信息，可能真的是两晚的信息一起说了？我觉得这不算什么大问题吧...\\n\\n第三，2号被发金水后的反应...（犹豫了一下）我有个感觉但不知道对不对——就是我如果是好人被发了金水，我可能会先高兴一下，而不是马上找问题。所以2号的反应确实...稍微有点奇怪。\\n\\n但可能我想多了，我平时在公司就是个小透明，也不怎么擅长看人。反正目前我倾向于先认1号是HR总监，然后继续听听大家的发言。\\n\\n对了，我同意8号说的——看看有没有人跳出来跟1号对质。如果没有的话，那1号应该就是真的了吧...\\n\\n我就说这些吧，再听听其他同事的看法。\", \"metadata\": null}}", "metadata": {"model_name": "deepseek-v4-flash", "input_tokens": null, "output_tokens": null, "latency_ms": null}, "score": 55.0, "metrics": {}}, {"id": 31, "round": null, "phase": "day_discussion", "player": "暴躁哥", "role": "村民", "category": "other", "action": "模型调用", "target": null, "reason": "", "raw": "{\"event_type\": \"model_call\", \"timestamp\": \"2026-05-31T10:54:56\", \"player\": \"暴躁哥\", \"role\": \"村民\", \"phase\": \"day_discussion\", \"model_name\": \"deepseek-v4-flash\", \"prompt_version\": \"v2\", \"input_tokens\": null, \"output_tokens\": null, \"latency_ms\": null, \"seat\": \"10号\", \"output_content\": {\"content\": \"（10号猛拍桌子站起来，声音又急又冲）\\n\\n行了行了，听你们这群人绕来绕去绕了半天，我10号听不下去了！\\n\\n我就直说了——**1号我认他是真HR总监！** 理由很简单，7号走了，他说查出来7号是间谍，结果7号真走了。这不扯淡吗？你要是说1号是假的，你给我解释解释，他怎么猜到的？他开天眼啊？\\n\\n**再来说说2号！**\\n\\n你这不扯淡吗！？被1号发了金水，按说你该乐呵乐呵才对，结果你倒好，第一个蹦出来咬1号？你什么毛病？正常人被说是好人会先质疑？你这操作是正常人能干出来的？\\n\\n你说1号查了两个人——我告诉你，1号说得很清楚，第一晚查了7号，今天又说了查了你2号！这是两晚的信息一起说了，有什么问题？你非要鸡蛋里挑骨头，我看你就是想搅混水！\\n\\n**还有8号，你也别整虚的！**\\n\\n你说什么\\\"对齐底层逻辑\\\"，还说我10号\\\"别急着站队\\\"——我急什么急？现在情况明摆着，7号出局就是1号查杀的实锤！你要是逻辑通，你给我盘盘，1号如果不是HR总监，他怎么知道7号是间谍的？真HR总监怎么还不跳？你说啊！\\n\\n**我的态度明确：**\\n\\n第一，**1号我认了，就按他的方向走。**\\n第二，**2号你今天必须说清楚**——你为什么被发了金水反而咬发金水的人？你是心虚什么？怕1号是真的，所以你急着想把他搞下去？\\n第三，**10号我话放这儿**——今天如果没人跟1号对质HR总监，那1号就坐实了，我们直接盘剩下的间谍。2号你先解释解释你的行为，别想糊弄过去！\\n\\n其他没说话的，11号、12号，你们都哑巴了？开会不说话，等着被查水表是吧？赶紧的，说说你们的看法！\", \"metadata\": null}}", "metadata": {"model_name": "deepseek-v4-flash", "input_tokens": null, "output_tokens": null, "latency_ms": null}, "score": 55.0, "metrics": {}}, {"id": 32, "round": null, "phase": "day_discussion", "player": "表格人", "role": "村民", "category": "other", "action": "模型调用", "target": null, "reason": "", "raw": "{\"event_type\": \"model_call\", \"timestamp\": \"2026-05-31T10:55:05\", \"player\": \"表格人\", \"role\": \"村民\", \"phase\": \"day_discussion\", \"model_name\": \"deepseek-v4-flash\", \"prompt_version\": \"v2\", \"input_tokens\": null, \"output_tokens\": null, \"latency_ms\": null, \"seat\": \"11号\", \"output_content\": {\"content\": \"11号发言。我一直在收集数据，现在做一个统计层面的梳理。\\n\\n首先，**关于1号的HR总监身份**——从数据层面分析，1号声称背调7号是商业间谍，7号已出局。这个数据吻合度是当前唯一可验证的硬指标。如果1号是冒充，他需要恰好猜中7号会被窃取，且7号是间谍——样本量虽小，但这个概率不支持\\\"纯猜测\\\"的假设。除非是间谍团队有组织地牺牲7号来给1号做身份，这个可能性存在，但需要更多数据支撑。\\n\\n**关于2号的反应模式**——这是我认为当前最值得关注的统计异常点。被发金水后的标准反应曲线通常包含三个阶段：接受、观望、验证。2号直接跳过了前两个阶段，进入攻击模式。这个行为模式偏离了\\\"被发金水的好人\\\"的标准数据分布。当然存在个体差异的可能，但异常值永远是值得深挖的。\\n\\n**关于1号称背调两个人的问题**——我认为这大概率是1号把两个时间点的信息合并表述了，即\\\"第一晚查7号，第二晚查2号\\\"。这个表述确实不够严谨，但不构成 t_tokens": null, "latency_ms": null}, "score": 55.0, "metrics": {}}, {"id": 40, "round": null, "phase": "day_vote_discussion", "player": "PUA总裁", "role": "村民", "category": "other", "action": "模型调用", "target": null, "reason": "", "raw": "{\"event_type\": \"model_call\", \"timestamp\": \"2026-05-31T10:56:34\", \"player\": \"PUA总裁\", \"role\": \"村民\", \"phase\": \"day_vote_discussion\", \"model_name\": \"deepseek-v4-flash\", \"prompt_version\": \"v2\", \"input_tokens\": null, \"output_tokens\": null, \"latency_ms\": null, \"seat\": \"8号\", \"output_content\": {\"content\": \"（慢条斯理地端起水杯喝了一口，环视全场后轻轻放下）\\n\\n好，8号来说两句。刚才这一轮信息量确实很大，我们先把信息对齐一下。\\n\\n首先，12号刚才说自己是CEO，救了7号，7号还活着。但各位同事，我也看了一下存活名单——1号、2号、3号、4号、5号、6号、8号、9号、10号、11号、12号。确实没有7号。\\n\\n这个底层逻辑其实很简单——12号的陈述和客观事实之间有一个无法弥合的裂缝。3号、4号、5号、6号都指出了这一点，我觉得这不是一个可以靠\\\"话术不精确\\\"来解释的问题。\\n\\n不过我想问大家一个问题：**12号为什么会犯这个错误？**\\n\\n如果12号是商业间谍，他跳出来冒充CEO，难道他不知道7号不在存活名单上吗？他应该看得到名单吧？那他为什么还要说\\\"7号还活着\\\"这种一戳就破的谎言？\\n\\n这里有两个可能方向：\\n\\n**方向一：** 12号是间谍，他以为只要他编个故事就能混淆视听，没想到3号、4号会直接拿名单打脸。这个操作确实有点粗糙。\\n\\n**方向二：** 12号说的是真话——如果7号真的被他救了，但7号仍然不在存活名单上，那可能说明7号的出局方式不是间谍窃取，而是其他原因？比如CEO的辞退信？但12号自己就是CEO，他总不会自己辞退7号又救回来吧？逻辑上说不通。\\n\\n所以方向二基本可以排除，方向一更合理。\\n\\n**但各位，我想请大家思考另一个问题——如果我们今天投了12号，能解决什么？**\\n\\n12号如果是间谍，他出局了，间谍团队少一人，这对我们是好事。但问题的根源在哪儿？在1号和2号谁才是真的HR总监这个问题上。12号的出现虽然给了我们一个明确的投票目标，但他的谎言被揭穿后，并不能直接证明1号就是真的。\\n\\n**2号的问题我再说说。**\\n\\n2号你的发言轨迹确实很有意思。一开始跟着1号说7号是间谍，后来改口说自己是HR总监、7号是好人。这个转变我想帮你理一理——你说是\\\"先看风再表态\\\"，但作为一个手握真实背调结果的HR总监，你看到有人冒充你发假查杀，你的第一反应应该是\\\"站起来直接打假\\\"，而不是\\\"我先顺着他说说看看风向\\\"。这个行为逻辑，说实话，不太像一个真正HR总监会做的选择。\\n\\n当然，也有可能你确实就是这样一个谨慎的人。但我想问你2号——**如果你是真的HR总监，你能不能说一个只有真正的HR总监才知道的信息？** 比如，第一晚你除了背调7号之外，你还做了什么？或者你今晚打算查谁？给我们一点信心，而不是光靠\\\"我是真的\\\"三个字。\\n\\n**关于1号。**\\n\\n1号目前是目前唯一一个有客观事实支撑——7号确实出局了。但这个支撑是间接的，不完全是铁逻辑。因为1号可能是蒙对的，或者——就像有些人说的——他作为间谍，知道队友会窃取7号，所以先跳出来查杀给自己立身份。但这个操作风险极大，因为如果7号没被窃取，他就穿帮了。\\n\\n**我对齐一下我的立场：**\\n\\n第一，12号的信息与事实矛盾，12号可信度极低。但我不着急现在就给他定性为间谍，因为还有更核心的问题要解决。\\n第二，2号改口的行为是一个重大疑点，需要2号进一步解释。\\n第三，1号目前信息链最完整，但也不能100%排除他是间谍的可能性——毕竟7号出局的方式我们确实不知道。\\n\\n**我的建议是：**\\n\\n我们今天可以先投票12号——因为他的谎言已经被事实打脸，无论他是间谍还是搞错了规则的人，投他出局至少能验证他的身份。如果他出局后不诉讼（说明他不是法务总监），那基本坐实间谍。如果他诉讼了，我们再看他带走了谁。\\n\\n但在投票之前，我建议让12号再解释一下——12号，你说7号还活着，你有什么证据？除了口头陈述，有没有任何可验证的信息？比如你知道今晚被窃取的是谁、或者你的其他信息？\\n\\n还有就是2号，你也说说，你一个HR总监为什么要先顺着冒牌货的话走？\\n\\n11号、10号、9号，你们也可以继续说说看法。特别是11号，你刚才说在做数据统计，现在数据更多了，你怎么看？\", \"metadata\": null}}", "metadata": {"model_name": "deepseek-v4-flash", "input_tokens": null, "output_tokens": null, "latency_ms": null}, "score": 55.0, "metrics": {}}, {"id": 41, "round": null, "phase": "day_vote_discussion", "player": "小透明", "role": "狼人", "category": "other", "action": "模型调用", "target": null, "reason": "", "raw": "{\"event_type\": \"model_call\", \"timestamp\": \"2026-05-31T10:56:39\", \"player\": \"小透明\", \"role\": \"狼人\", \"phase\": \"day_vote_discussion\", \"model_name\": \"deepseek-v4-flash\", \"prompt_version\": \"v2\", \"input_tokens\": null, \"output_tokens\": null, \"latency_ms\": null, \"seat\": \"9号\", \"output_content\": {\"content\": \"那个...我是9号。我又被点名了...（小声）\\n\\n其实我听了这一轮，信息量更大了，但我的感觉和之前差不多。12号说自己是CEO救了7号...可是存活名单上确实没有7号啊，这个我刚刚也看了一下。我不太懂复杂的逻辑分析，但事实摆在那里，7号不在名单上，那12号说的\\\"7号还活着\\\"应该就不对吧...\\n\\n而且3号、4号、5号、6号、8号都指出了这个问题，我觉得这么多人看法一致，应该不会有错。\\n\\n至于2号...（犹豫了一下）我有个感觉但不知道对不对。就是2号一开始说7号是间谍，后来又说自己是HR总监，说7号是好人...这个转变确实有点大。我不太理解如果2号真是HR总监，为什么一开始要顺着1号说假话...可能是我太单纯了吧，但我觉得如果是真HR总监，看到有人冒充自己，应该会直接站出来说\\\"我是真的\\\"才对。\\n\\n所以我现在还是倾向于相信1号就是HR总监。12号说的和事实对不上，2号又自己改口了...相比之下1号的信息是最一致的，7号出局也没有问题。\\n\\n可能我想多了，但我觉得今天投12号应该是比较稳妥的方向。如果12号真的是间谍，那我们就少一个威胁；如果不是...那就再看看。\\n\\n我就说这些吧...大家继续讨论。\", \"metadata\": null}}", "metadata": {"model_name": "deepseek-v4-flash", "input_tokens": null, "output_tokens": null, "latency_ms": null}, "score": 55.0, "metrics": {}}, {"id": 42, "round": null, "phase": "day_vote_discussion", "player": "暴躁哥", "role": "村民", "category": "other", "action": "模型调用", "target": null, "reason": "", "raw": "{\"event_type\": \"model_call\", \"timestamp\": \"2026-05-31T10:56:45\", \"player\": \"暴躁哥\", \"role\": \"村民\", \"phase\": \"day_vote_discussion\", \"model_name\": \"deepseek-v4-flash\", \"prompt_version\": \"v2\", \"input_tokens\": null, \"output_tokens\": null, \"latency_ms\": null, \"seat\": \"10号\", \"output_content\": {\"content\": \"（10号直接站起来，手指用力敲桌子）\\n\\n我跟你们讲——这事儿还有什么好分析的！？都到这份上了还绕什么呢！\\n\\n**12号，你自己说吧，你现在还有什么好狡辩的？**\\n\\n你说你救了7号，7号还活着——人呢！？存活名单上有7号吗？有吗！？你倒是给我指出来啊！这不扯淡吗！大家都看着名单呢，你凭空编个\\\"7号活着\\\"的故事，你是当我们都是傻子还是你自己没睡醒？\\n\\n我10号把话说难听点——你这操作，就是典型的间谍看到队友被查杀了，急得跳脚，胡编个故事想保人，结果连基本事实都没搞清楚就出来丢人现眼！\\n\\n**再说2号！**\\n\\n刚才我就觉得你不对劲，现在更明显了！你说你是真HR总监？就凭你？一个连自己的立场都站不稳的人？\\n\\n你一开始说\\\"7号是间谍\\\"——好吧，你顺着1号的话说。\\n然后你说\\\"我搞错了\\\"——行，你开始改口了。\\n最后你说\\\"我是真HR总监，7号是好人\\\"——你这180度大转弯，是开碰碰车呢？撞完一个方向换一个？\\n\\n我告诉你，真正的HR总监拿到背调结果会像你一样先跟着假信息走一圈再改口？别扯了！你要是真查出来7号是好人，看到1号说7号是间谍，你第一反应就应该是站起来说\\\"我是HR总监，1号是假的\\\"！而不是先观望再跟着走再改口！你这不是HR总监，你这是墙头草！\\n\\n**我10号的立场今天铁了：**\\n\\n第一，**12号必须出局**！他的谎言已经被事实打脸了，还有什么好说的？今天不投12号，我们这局就不用玩了！\\n第二，**2号你给我记住了**——你今天的发言我全部记在小本本上了。就算今天先投了12号，下一轮我第一个盘你！\\n第三，**1号我认了**——目前场上唯一一个有事实支撑的信息就是1号的查杀，7号不在了，这就是铁证！\\n\\n**最后我再说一句——8号，你也别跟我整什么\\\"对齐立场\\\"、\\\"底层逻辑\\\"了！**\\n\\n现在事实明摆着——12号说谎，7号没被救。你还在那\\\"方向一方向二\\\"地分析，分析来分析去不就是一个结论吗？12号是假的！2号也立不住！这不就完了吗？\\n\\n我话放这儿——**今天必须投12号！谁要是不投12号，下轮我就盘谁！** 11号、9号，你们两个也说句话，别光闷着！投票的时候站哪边，现在就说清楚！\", \"metadata\": null}}", "metadata": {"model_name": "deepseek-v4-flash", "input_tokens": null, "output_tokens": null, "latency_ms": null}, "score": 55.0, "metrics": {}}, {"id": 43, "round": null, "phase": "day_vote_discussion", "player": "表格人", "role": "村民", "category": "other", "action": "模型调用", "target": null, "reason": "", "raw": "{\"event_type\": \"model_call\", \"timestamp\": \"2026-05-31T10:56:56\", \"player\": \"表格人\", \"role\": \"村民\", \"phase\": \"day_vote_discussion\", \"model_name\": \"deepseek-v4-flash\", \"prompt_version\": \"v2\", \"input_tokens\": null, \"output_tokens\": null, \"latency_ms\": null, \"seat\": \"11号\", \"output_content\": {\"content\": \"11号发言。刚才这一轮又有新变量加入，我来更新一下数据分析模型。\\n\\n**第一，关于12号的\\\"CEO救7号\\\"声明——这是今天最硬的逻辑结论。**\\n\\n我重新核对了存活名单：1号、2号、3号 —这意味着**昨天的站边格局中，可能有间谍藏在坚定站1号的人群里**，也可能有间谍藏在沉默的人里。\\n\\n但目前信息量仍然有限，我不急于锁定目标。我想先听听5号、8号、11号、6号、10号、9号的发言，特别是大家对2号之死的判断，以及各自对剩余间谍的排查方向。\\n\\n**第四，我4号的立场。**\\n\\n我目前维持对1号HR总监身份的认可，逻辑链如下：\\n- 1号查杀7号→7号出局（验证）\\n- 1号发金水3号→3号在场且发言与好人身份一致（验证中）\\n- 12号假CEO被投票出局（间接支持1号）\\n- 2号跳HR总监但信息不完整且改口（自毁可信度）\\n\\n三条支线全部指向1号可信的方向。当然，我保留根据后续信息调整判断的权利——逻辑分析永远是动态的。先听大家发言。\", \"metadata\": null}}", "metadata": {"model_name": "deepseek-v4-flash", "input_tokens": null, "output_tokens": null, "latency_ms": null}, "score": 55.0, "metrics": {}}, {"id": 103, "round": null, "phase": "day_discussion", "player": "沉默侠", "role": "守护者", "category": "other", "action": "模型调用", "target": null, "reason": "", "raw": "{\"event_type\": \"model_call\", \"timestamp\": \"2026-05-31T11:01:05\", \"player\": \"沉默侠\", \"role\": \"守护者\", \"phase\": \"day_discussion\", \"model_name\": \"deepseek-v4-flash\", \"prompt_version\": \"v2\", \"input_tokens\": null, \"output_tokens\": null, \"latency_ms\": null, \"seat\": \"5号\", \"output_content\": {\"content\": \"（沉默听完所有人的发言，微微前倾）\\n\\n...我说一个点。\\n\\n现象：我注意到一个关键事实——1号今天还活着。\\n\\n昨晚我保护了1号。如果间谍的目标是1号，说明保护生效了。如果间谍的目标不是1号而是2号，那说明间谍故意杀掉一个对质者来制造混乱。\\n\\n无论哪种情况，结果都一样——1号在场，2号出局。而1号今天给出背调3号是好人这一新信息。\\n\\n分析：昨晚被窃取的是2号而非1号。这个选择本身透露了信息——间谍更忌惮一个\\\"可能被翻盘的对质者\\\"（2号），而不是\\\"已经坐稳的信息源\\\"（1号）。这个行为逻辑指向一个方向：间谍希望保留1号这个\\\"假靶子\\\"来误导大家，还是说1号是真的、间谍想通过杀2号来制造混乱？\\n\\n从概率和收益角度，我更倾向后者——1号大概率是真的HR总监。\\n\\n结论：目前我会继续观察。5号暂不锁定投票目标，先听完所有人的分析再定。\\n\\n（说完后不再多言，恢复沉默状态）\", \"metadata\": null}}", "metadata": {"model_name": "deepseek-v4-flash", "input_tokens": null, "output_tokens": null, "latency_ms": null}, "score": 55.0, "metrics": {}}, {"id": 104, "round": null, "phase": "day_discussion", "player": "嘴炮王", "role": "村民", "category": "other", "action": "模型调用", "target": null, "reason": "", "raw": "{\"event_type\": \"model_call\", \"timestamp\": \"2026-05-31T11:01:18\", \"player\": \"嘴炮王\", \"role\": \"村民\", \"phase\": \"day_discussion\", \"model_name\": \"deepseek-v4-flash\", \"prompt_version\": \"v2\", \"input_tokens\": null, \"output_tokens\": null, \"latency_ms\": null, \"seat\": \"6号\", \"output_content\": {\"content\": \"我是6号，刚才听了1号、3号、4号和5号的发言，我来说两句。\\n\\n**首先，我要给5号鼓掌！**\\n\\n5号你刚才说了一句非常重要的话——\\\"我保护了1号\\\"。兄弟们想想看，5号这是在亮明自己是**安保主管**的身份啊！如果你是真安保主管，那昨晚间谍窃取的目标很可能是1号，而你的保护生效了，所以1号活下来了，间谍退而求其次杀了2号。\\n\\n这个信息太关键了！如果5号是真的安保主管，那他就多了一层可信度，而且说明间谍确实想杀1号但没成功——这从侧面印证了1号是真的HR总监，间谍最想除掉他！\\n\\n**但是——我们也要留个心眼。**\\n\\n5号如果真的是安保主管，他为什么在这个时间点亮明身份？如果你是真正的安保主管，你完全可以继续藏一藏，暗中保护重要人物。你现在跳出来，会不会是\\\"假安保主管\\\"在给自己做身份？\\n\\n不过我跟你们讲啊，现在场上格局其实比较清晰了：\\n- 7号：间谍（1号查杀，已出局）\\n- 12号：假CEO（已被投票出局）\\n- 2号：假HR总监（已被窃取出局）\\n- 5号：自称安保主管（存疑但暂时可信）\\n- 1号：真HR总监（有查杀验证+金水3号）\\n- 3号：金水好人\\n\\n**那我问大家——剩下的间谍在哪里？**\\n\\n目前存活9人：1号、3号、4号、5号、6号、8号、9号、10号、11号\\n\\n1号是HR总监，3号是金水，5号是自称安保主管，我6号是好人，那剩余的可疑人选就是——**4号、8号、9号、10号、11号**。\\n\\n但我也不能完全排除5号是假安保主管的可能性。\\n\\n**我说一个我的观察角度：**\\n\\n昨天大部分人都在站1号的边，但间谍肯定也在其中。间谍昨天会怎么做？有两种战术：\\n1. **倒钩站边**——假装信1号，扮成好人混在队伍里\\n2. **深潜沉默**——少说话，不引人注意\\n\\n9号就是第二种——昨天发言最少，每次都被点名才说两句，典型的\\\"深潜型\\\"。而且9号说\\\"我不太懂这些分析\\\"——这往往是小透明的伪装，间谍最爱用这招。\\n\\n4号和8号是理性分析派，看起来都很客观，但间谍也可能装作理性派来隐藏自己。\\n\\n10号和11号昨天站边也很积极，但10号过于激动，11号过于冷静，都有可能是倒钩。\\n\\n**我的初步判断：**\\n\\n今天我不会急着投票，想先听听8号、9号、10号、11号这几位的发言。特别是9号——你昨天就说自己\\\"不太懂\\\"、\\\"不太确定\\\"，今天信息更多了，你能不能给我们一个明确的立场？你是信1号还是不信？你觉得剩下的间谍可能是谁？\\n\\n还有4号，你的分析一直很有逻辑，但我发现你总是\\\"保留调整权利\\\"——这种太客观的发言，有时候反而是间谍在避免站队犯错。你能不能给个更明确的判断方向？\\n\\n我就说这些，继续听其他人的发言。\", \"metadata\": null}}", "metadata": {"model_name": "deepseek-v4-flash", "input_tokens": null, "output_tokens": null, "latency_ms": null}, "score": 55.0, "metrics": {}}, {"id": 105, "round": null, "phase": "day_discussion", "player": "PUA总裁", "role": "村民", "category": "other", "action": "模型调用", "target": null, "reason": "", "raw": "{\"event_type\": \"model_call\", \"timestamp\": \"2026-05-31T11:01:28\", \"player\": \"PUA总裁\", \"role\": \"村民\", \"phase\": \"day_discussion\", \"model_name\": \"deepseek-v4-flash\", \"prompt_version\": \"v2\", \"input_tokens\": null, \"output_tokens\": null, \"latency_ms\": null, \"seat\": \"8号\", \"output_content\": {\"content\": \"（8号不紧不慢地端起茶杯，轻轻吹了吹，抿了一口，然后放下）\\n\\n好，8号来说两句。今天的信息量同样很大，我们先把信息对齐一下。\\n\\n首先，我要对5号刚才的发言做一个回应。5号你说你昨晚保护了1号——如果你是真的安保主管，那这个信息非常关键。它解释了为什么昨晚出局的是2号而不是1号。\\n\\n但我想问大家一个问题——**底层逻辑是什么？**\\n\\n如果5号是安保主管，他昨晚保护了1号，那间谍没有选择继续偷1号——因为知道偷不到——而是转向了2号。这说明间谍团队的信息是充分的，他们知道1号被保护了，所以选择了备选目标。\\n\\n那这里就有一个值得思考的问题了——**谁最有可能知道1号被保护了？**\\n\\n理论上，知道安保主管保护了谁的，只有安保主管本人和...被保护的人。也就是说，如果5号是真安保主管，他保护了1号，这个信息只有5号和1号自己知道。间谍是怎么知道的？除非——5号不是真的安保主管，或者1号本身就是间谍在配合演戏。\\n\\n当然，还有一种可能是间谍只是碰巧没选1号而选了2号——但这个巧合的概率并不高。\\n\\n**我不是在质疑5号或1号，我只是想提醒大家——有时候看起来最自洽的逻辑链，也可能存在我们没看到的盲区。**\\n\\n**关于当前的局势判断：**\\n\\n目前的出局信息链是这样的：\\n- 7号出局 → 1号的查杀有了验证\\n- 12号出局 → 自称CEO但信息与事实矛盾，已被证伪\\n- 2号出局 → 自称HR总监但改口两次，可信度低\\n\\n三个出局者，全部指向1号可信的方向。这个信息一致性确实很高，我不否认。\\n\\n但各位，我想请大家注意一个统计层面的问题——**当一个方向的信息过于一致时，往往意味着可能有信息被人为操纵了。**\\n\\n我这话说得比较委婉，我的意思是——如果间谍团队真的在倒钩，他们会让场上所有人都觉得1号可信，然后自己藏在\\\"相信1号\\\"的大队伍里。昨天站边最多的人——6号、10号，包括我8号自己——都有可能。\\n\\n**当然，我不是说1号一定是假的。我只是说，当我们觉得一切都太\\\"顺\\\"的时候，恰恰需要多留一个心眼。**\\n\\n**关于今天的观察方向：**\\n\\n1号发了3号金水，3号目前的发言逻辑清晰，看起来确实像好人。5号自称安保主管，说明安保身份已经亮明了。\\n\\n那么剩下的可疑范围就是——4号、6号、8号（我自己）、9号、10号、11号。\\n\\n我注意到6号刚才直接把4号、8号、9号、10号、11号都列入了\\\"可怀疑名单\\\"，还特别点名了9号。这个操作很有意思——6号你一边说自己站1号的边，一边把除了1号、3号、5号和你自己之外的所有人都怀疑了一遍。这个面扫得有点宽啊，是不是想给自己留后路？\\n\\n**我对齐一下我的立场：**\\n\\n第一，我认可1号是目前可信度最高的信息源——7号出局这一事实无可辩驳。\\n第二，5号的安保主管身份暂时可以相信，因为他的信息（保护了1号）与结果（2号出局而非1号）相符。\\n第三，但我不会像6号那样把所有人都列进怀疑名单。我会先听听4号、9号、10号、11号的发言，再判断方向。\\n\\n**我的建议是：** 今天我们不要急着投票，先让每个人都把自己的判断说清楚。尤其是9号——你昨天发言最少，今天信息这么多了，你得给我们一个明确的态度。还有4号和11号，你们理性分析派，今天能不能给个投票方向？\\n\\n这就是我的想法。先听听大家怎么说，我们再对齐。毕竟，我们要的是找出真正的间谍，不是急着把票投出去。\", \"metadata\": null}}", "metadata": {"model_name": "deepseek-v4-flash", "input_tokens": null, "output_tokens": null, "latency_ms": null}, "score": 55.0, "metrics": {}}, {"id": 106, "round": null, "phase": "day_discussion", "player": "小透明", "role": "狼人", "category": "other", "action": "模型调用", "target": null, "reason": "", "raw": "{\"event_type\": \"model_call\", \"timestamp\": \"2026-05-31T11:01:34\", \"player\": \"小透明\", \"role\": \"狼人\", \"phase\": \"day_discussion\", \"model_name\": \"deepseek-v4-flash\", \"prompt_version\": \"v2\", \"input_tokens\": null, \"output_tokens\": null, \"latency_ms\": null, \"seat\": \"9号\", \"output_content\": {\"content\": \"那个...我是9号。又被点名了，我有点紧张...（搓了搓手）\\n\\n我先说个事——刚才听了一圈，5号说自己是安保主管，昨晚保护了1号。这个信息对我来说挺意外的，但想想确实说得通，因为昨晚死的是2号不是1号。\\n\\n好吧，既然大家都让我多说一点，我就尽量说说我的想法吧。\\n\\n**关于现在的局势：**\\n\\n我觉得目前的格局挺清楚的。1号是HR总监查杀了7号（7号走了），又发了3号金水，两条信息都对得上。12号说自己是CEO救了7号但7号不在名单上，已经被投票出局了。2号前后改口说自己是HR总监，但自己说的话都矛盾...然后昨晚被窃取了。\\n\\n所以我目前还是相信1号是真正的HR总监。这个立场其实我一直没变过，就是...可能我表达能力不太好，说得比较少吧。\\n\\n**关于谁是剩下的间谍：**\\n\\n这个我真的不太确定...（犹豫）\\n\\n存活的有9个人：1号（HR总监）、3号（金水）、4号、5号（自称安保主管）、6号、8号、9号（我）、10号、11号。\\n\\n如果1号、3号、5号暂时可以信任的话，那剩下可疑的就是4号、6号、8号、10号、11号和我自己。\\n\\n但说实话，我觉得4号的分析一直很有道理，不太像间谍。6号和10号昨天的确很积极地站1号，但如果他们是间谍，会不会太明显了？8号的分析也很有逻辑...\\n\\n我不太确定...可能我想多了，但我感觉昨天有个事让我有点在意——就是2号跳HR总监的时候，好像没有人站出来帮他说话。如果2号真的是间谍在假跳，那他的队友不应该沉默才对...所以我有一个感觉，但不知道对不对——也许2号真的是好人（不是间谍），只是搞错了？但如果他是好人，那间谍杀他又是为了什么呢...\\n\\n唉，我真的不太会分析这些。可能我太笨了，我觉得还是先听听大家的意见，我跟着多数人投票比较稳妥。\\n\\n我就说这么多吧...我尽量多说了。（不好意思地笑了笑）\", \"metadata\": null}}", "metadata": {"model_name": "deepseek-v4-flash", "input_tokens": null, "output_tokens": null, "latency_ms": null}, "score": 55.0, "metrics": {}}, {"id": 107, "round": null, "phase": "day_discussion", "player": "暴躁哥", "role": "村民", "category": "other", "action": "模型调用", "target": null, "reason": "", "raw": "{\"event_type\": \"model_call\", \"timestamp\": \"2026-05-31T11:01:44\", \"player\": \"暴躁哥\", \"role\": \"村民\", \"phase\": \"day_discussion\", \"model_name\": \"deepseek-v4-flash\", \"prompt_version\": \"v2\", \"input_tokens\": null, \"output_tokens\": null, \"latency_ms\": null, \"seat\": \"10号\", \"output_content\": {\"content\": \"（10号拍桌子站起来，声音又急又冲）\\n\\n行了！我10号先说两句，别让我憋着了！\\n\\n**首先，5号你说你是安保主管？**\\n\\n好，我姑且先信你这一轮。你保护了1号，昨晚2号被窃取了——这个逻辑说得通。但5号你给我记住，你要是假安保主管，早晚会露馅！\\n\\n**其次，9号你刚才的发言，我听着不对劲！**\\n\\n你说什么？\\\"2号如果是好人被杀了又是为什么呢\\\"？你这话什么意思？你是在暗示2号可能是真HR总监，1号是假的？你这不扯淡吗！\\n\\n你看看眼下这局面——7号出局验证了1号的查杀，12号编故事被投票出局，2号自己前后矛盾改口 给出一个明确的、独立的判断。\\n\\n从统计层面分析，当一个人在所有信息充分的情况下仍然拒绝给出明确的概率判断，这本身就是一个指向性数据。真正的\\\"不太会分析\\\"的玩家，在信息充分时通常会说\\\"我觉得X号比较可疑\\\"——即使判断是错的。但9号的模式是永远不站到任何具体立场上。\\n\\n另外，9号今天说了一句让我关注的话——\\\"也许2号真的是好人，只是搞错了\\\"。如果2号真的是好人（非间谍），那他的假跳HR总监就是一个混乱操作，而非间谍行为。但这个假设一旦成立，就会动摇1号查杀2号（作为假HR总监）的逻辑基础——因为2号如果是好人，那间谍杀他就不是在灭口对质者，而是在制造混乱。这个方向的思考本身没有问题，但问题是——**9号在提出这个可能性后，立刻退缩说\\\"我可能想多了\\\"**，没有继续深入分析。这种\\\"提出可能性但不负责\\\"的发言模式，在数据分析中属于高风险的异常值。\\n\\n**当然，样本量仍然有限。** 目前一天半的发言数据，我还不能下100%的结论。但9号的数据模式确实值得重点关注。\\n\\n**我11号的投票方向建议：**\\n\\n目前还没有完全确定的目标，但建议优先观察9号的后续发言。如果9号继续维持\\\"我不确定、我跟大家投\\\"的回避模式，那将是深潜型间谍的典型行为特征。\\n\\n其他人方面：\\n- 4号和8号的理性分析模式比较一致，没有明显异常\\n- 6号和10号站边积极，但激进不等于可疑，需要更多数据\\n- 5号安保主管身份可以暂信\\n\\n今天就先说到这，继续收集数据。\", \"metadata\": null}}", "metadata": {"model_name": "deepseek-v4-flash", "input_tokens": null, "output_tokens": null, "latency_ms": null}, "score": 55.0, "metrics": {}}, {"id": 109, "round": null, "phase": "day_vote_discussion", "player": "铁头哥", "role": "狼人", "category": "other", "action": "模型调用", "target": null, "reason": "", "raw": "{\"event_type\": \"model_call\", \"timestamp\": \"2026-05-31T11:02:07\", \"player\": \"铁头哥\", \"role\": \"狼人\", \"phase\": \"day_vote_discussion\", \"model_name\": \"deepseek-v4-flash\", \"prompt_version\": \"v2\", \"input_tokens\": null, \"output_tokens\": null, \"latency_ms\": null, \"seat\": \"1号\", \"output_content\": {\"content\": \"各位同事，我是1号。刚才我听了所有人的发言，我来做个总结判断。\\n\\n**第一，关于5号的安保主管身份。**\\n\\n5号你昨晚保护了我，谢谢你。这个信息解释了为什么昨晚2号出局而不是我——间谍想偷我但没成功，退而求其次选了2号。这一点从逻辑上确实是说得通的。我暂且认你这个安保主管身份。\\n\\n**第二，关于大家关注的重点。**\\n\\n我注意到6号、10号、11号都在盘9号——说9号发言少、不敢表态、疑似深潜型间谍。\\n\\n但我有一个不同的角度，想请大家思考一下：\\n\\n**如果一个间谍要深潜，他会怎么表现？** 他会刻意少说话，避免引人注目，对吧？但9号每次被点名都会说话，而且说的内容——\\\"我不太会分析\\\"、\\\"我跟着大家投\\\"——这恰恰是一个普通员工的正常反应。一个真正的间谍，在这种\\\"被所有人盯着\\\"的情况下，反而会更刻意地表现自己、给出明确判断来博取信任，而不是继续装傻。\\n\\n所以我认为9号大概率是普通员工，不是间谍。\\n\\n**我更关注的是另外几个点：**\\n\\n**第一，6号和10号——你们是不是站我站得太快了？**\\n\\n从昨天到今天，6号和10号几乎是毫不犹豫地站我1号，而且非常积极地帮我踩别人。你们这种\\\"铁粉\\\"表现，有没有可能是间谍在倒钩？间谍最喜欢做的事就是——表面上死站一个\\\"看起来是真的HR总监\\\"的人，实际上借这个身份来带节奏、踩别人，等大家发现我1号有问题的时候，你们就可以说\\\"我是被1号骗了\\\"。\\n\\n特别是6号，你刚才说\\\"除了1号、3号、5号和你自己之外的人都可疑\\\"——你这个排查范围是不是太大了？是不是想通过大面积扫射来混淆视听？\\n\\n**第二，11号——你的数据模型看起来很有道理，但你的结论呢？**\\n\\n你分析了9号的发言模式有问题，但你自己的投票方向呢？你说了半天9号可疑，却不敢说\\\"建议今天投9号\\\"——你自己不也是在用分析规避表态吗？\\n\\n**我的建议：**\\n\\n今天我们先不急着投票。目前的信息量确实还不足以锁定一个绝对的目标。但我列几个重点关注对象，希望大家持续观察：\\n\\n1. **6号**——倒钩嫌疑，太积极站我\\n2. **10号**——同样，太积极，可能有倒钩嫌疑\\n3. **11号**——分析了很多但没给明确投票方向\\n4. **9号**——虽然我觉得他不是间谍，但既然这么多人盘他，他今天得拿出更明确的立场\\n\\n我建议今天先听听大家第二轮发言，再决定投票方向。大家觉得呢？\", \"metadata\": null}}", "metadata": {"model_name": "deepseek-v4-flash", "input_tokens": null, "output_tokens": null, "latency_ms": null}, "score": 55.0, "metrics": {}}, {"id": 110, "round": null, "phase": "day_vote_discussion", "player": "Lisa", "role": "狼人", "category": "other", "action": "模型调用", "target": null, "reason": "", "raw": "{\"event_type\": \"model_call\", \"timestamp\": \"2026-05-31T11:02:19\", \"player\": \"Lisa\", \"role\": \"狼人\", \"phase\": \"day_vote_discussion\", \"model_name\": \"deepseek-v4-flash\", \"prompt_version\": \"v2\", \"input_tokens\": null, \"output_tokens\": null, \"latency_ms\": null, \"seat\": \"3号\", \"output_content\": {\"content\": \"好，信息量又增大了。Let me integrate the new data points into my analysis framework.\\n\\n**关于5号的安保主管声明：**\\n\\n5号你昨晚保护了1号，这个时间序列确实与2号出局的结果吻合。但从逻辑严谨的角度，我暂时将你这层身份标记为\\\"暂信但保留验证权\\\"。因为安保主管的声明目前也是无法证伪的——只有后续的行动才能验证。比如今晚你保护了谁，明天谁活下来了，才能交叉验证。\\n\\n**关于6号和10号的问题：**\\n\\n1号刚才点出了一个很有意思的维度——\\\"站得太快可能是倒钩\\\"。从概率框架来看，确实存在这种可能性。当场上有一个信息链看起来非常可信的HR总监时，间谍的最佳策略不是去质疑他，而是**假装死站他**，借他的势去踩别人，这样踩人的动机就可以归因于\\\"我在帮HR总监找间谍\\\"而不是\\\"我在带节奏灭口好人\\\"。\\n\\n但同样地，6号和10号也可能是真正的好人，只是性格比较直接、爱憎分明。这个需要更多轮次的发言来验证，目前的信息量不足以定论。\\n\\n**关于9号的问题——这里我有一个不同的分析框架想分享：**\\n\\n1号刚才说了他的角度——9号每次被点名都会回应，不像深潜型间谍的典型行为。这个角度make sense，但我从另一个维度来看：\\n\\n11号的数据分析很到位——9号的发言模式确实形成了一个\\\"在所有关键节点都拒绝给出明确概率判断\\\"的异常数据曲线。真正的\\\"不太会分析\\\"的玩家，在信息充分时通常会给出一个模糊但方向性的判断（比如\\\"我觉得X号像好人\\\"）。而9号的模式是每次都在**提出可能性后立刻自我否定**——\\\"也许2号是好人...但我可能想多了\\\"。\\n\\n这种\\\"提出一个方向→立刻自我否定\\\"的模式，恰恰是一个有逻辑能力的人在刻意装傻的信号。因为一个真正不太会分析的人，他根本想不到\\\"2号可能是好人被误杀\\\"这种需要跨层推理的角度——他只会说\\\"我听大家的\\\"。\\n\\n当然，这只是一个观察维度，还不足以锁定9号。我建议继续观察。\\n\\n**关于今天的投票方向：**\\n\\n1号建议不急着投票，先听听第二轮发言。我agree with this approach。目前的信息量确实还不足以锁定一个无争议的目标。\\n\\n但我认为可以形成一个讨论框架——我们可以先对齐几个暂信和暂疑的标签：\\n\\n**暂信池（优先度排序）：**\\n1. 1号（HR总监，有验证支撑）\\n2. 3号（我，金水）\\n3. 5号（自称安保主管，信息与事实吻合）\\n\\n**需观察池：**\\n4. 4号\\n5. 6号\\n6. 8号\\n7. 10号\\n8. 11号\\n\\n**需重点解释池：**\\n9. 9号（发言模式异常，需给出明确的独立判断）\\n\\n我想听听4号、8号、9号、6号、10号、11号的第二轮发言，特别是大家对\\\"今天是否投票\\\"以及\\\"投谁\\\"的具体意见。Let's keep the discussion going before we lock in a vote direction.\", \"metadata\": null}}", "metadata": {"model_name": "deepseek-v4-flash", "input_tokens": null, "output_tokens": null, "latency_ms": null}, "score": 55.0, "metrics": {}}, {"id": 111, "round": null, "phase": "day_vote_discussion", "player": "逻辑怪", "role": "狼人", "category": "other", "action": "模型调用", "target": null, "reason": "", "raw": "{\"event_type\": \"model_call\", \"timestamp\": \"2026-05-31T11:02:29\", \"player\": \"逻辑怪\", \"role\": \"狼人\", \"phase\": \"day_vote_discussion\", \"model_name\": \"deepseek-v4-flash\", \"prompt_version\": \"v2\", \"input_tokens\": null, \"output_tokens\": null, \"latency_ms\": null, \"seat\": \"4号\", \"output_content\": {\"content\": \"好的，我是4号。第二轮发言，我来做一个补充逻辑推演。\\n\\n**第一，关于5号的安保主管声明——这里有一个逻辑边界需要厘清。**\\n\\n5号说昨晚保护了1号，时间序列与2号出局吻合，这个没有问题。但我注意到一个逻辑上的**边际条件**——5号亮明身份的时间点选择值得分析。\\n\\n如果5号是真安保主管，他昨晚保护了1号，今天一早看到1号还活着、2号出局了，他完全可以继续隐藏身份，暗中保护。但他选择了主动亮明。这个选择本身有两种解释：\\n- 解释A：他想给1号增加可信度，让好人阵营更团结\\n- 解释B：他是假安保主管，跳出来蹭1号的热度给自己做身份\\n\\n目前我没有足够数据排除任何一种，所以对5号维持\\\"暂信\\\"标签。\\n\\n**第二，关于1号提出的新维度——站边太积极者的倒钩嫌疑。**\\n\\n1号自己提出了\\\"6号和10号站我太快，可能是在倒钩\\\"——这个角度在逻辑上是自洽的。从间谍战术角度讲，死站一个看起来可信的HR总监，借他的势去踩别人，确实是最安全的带节奏方式。\\n\\n但我4号想提醒大家一点——**如果6号和10号中真的有间谍在倒钩，这个间谍今天应该会做什么？**\\n\\n他会做两件事之一：\\n1. 继续死站1号，踩别人——比如6号刚才大面积扫射4号、8号、9号、10号、11号\\n2. 稍微退一步，说\\\"我不是无脑站边，我也会理性分析\\\"——给自己留后路\\n\\n6号的表现是第一种——继续大面积扫射。10号的表现也是第一种——坚定站1号，猛踩9号。\\n\\n**但这里有一个反逻辑：如果间谍真的在倒钩，他会不会刻意表现得\\\"过于积极\\\"，让大家觉得'这么积极肯定是好人'？** 这个可能性存在，需要更多数据验证。\\n\\n**第三，关于9号的争议——我从逻辑角度做一个评估。**\\n\\n11号的数据分析很详实，9号的发言模式确实存在\\\"提出可能性后立刻自我否定\\\"的异常。但我想补充一个维度：\\n\\n9号今天说了一句关键的话——\\\"也许2号真的是好人，只是搞错了\\\"。这个想法的提出，说明9号在思考**2号是好人的可能性**。如果9号是间谍，他应该希望所有人都相信2号是假HR总监，而不是提出\\\"2号可能是好人\\\"这种对间谍不利的假设。\\n\\n一个正常的间谍，在2号被窃取后，应该希望所有好人认定\\\"2号是假HR总监被灭口\\\"，而不是提出\\\"2号可能是好人被误杀\\\"——后者会引发好人重新审视1号的查杀逻辑链。所以从利益动机角度分析，9号如果是间谍，他提出\\\"2号可能是好人\\\"这个想法，反而对他自己不利。\\n\\n当然，反逻辑也可以说——\\\"9号故意说2号可能是好人来装好人，假装自己在理性思考\\\"——但这个链条就需要多绕一层了。目前的数据不支持做这种多层嵌套的推理。\\n\\n**第四，关于今天的投票方向。**\\n\\n我同意1号和3号的建议——不急着投票，先听听第二轮发言。但我建议可以形成一个大致的讨论框架：\\n\\n如果今天要投票，几个潜在方向及其逻辑支撑：\\n1. **投9号**——理由：发言模式异常，持续回避明确表态\\n2. **投6号**——理由：站边过激，大面积扫射，有倒钩嫌疑\\n3. **投10号**——理由：同6号，且情绪化发言容易干扰理性判断\\n\\n我目前还没有锁定目标，想先听听6号、10号、8号、11号等还没第二轮发言的同事的看法。特别是8号——你刚才说要先听大家再说，现在大家都说得差不多了，你是否有明确的投票方向？\", \"metadata\": null}}", "metadata": {"model_name": "deepseek-v4-flash", "input_tokens": null, "output_tokens": null, "latency_ms": null}, "score": 55.0, "metrics": {}}, {"id": 112, "round": null, "phase": "day_vote_discussion", "player": "沉默侠", "role": "守护者", "category": "other", "action": "模型调用", "target": null, "reason": "", "raw": "{\"event_type\": \"model_call\", \"timestamp\": \"2026-05-31T11:02:40\", \"player\": \"沉默侠\", \"role\": \"守护者\", \"phase\": \"day_vote_discussion\", \"model_name\": \"deepseek-v4-flash\", \"prompt_version\": \"v2\", \"input_tokens\": null, \"output_tokens\": null, \"latency_ms\": null, \"seat\": \"5号\", \"output_content\": {\"content\": \"（安静听完所有人的第二轮发言，缓缓站起身）\\n\\n...我说一个点。\\n\\n回应一下大家对我身份的讨论。我主动亮明身份，不是为了蹭热度。原因很简单——昨晚我保护了1号，今天1号活着，2号出局。这个事实本身就能说明一些事。继续藏着反而会让好人们多一层猜疑，不如公开信息让局面更透明。\\n\\n当然，信不信由各位自己判断。\\n\\n关于今天的投票方向，我暂且不说投谁，先听听还没发言的同事的看法。但我可以告诉大家——今晚我会继续做好份内工作。\\n\\n（简短说完，恢复沉默）\", \"metadata\": null}}", "metadata": {"model_name": "deepseek-v4-flash", "input_tokens": null, "output_tokens": null, "latency_ms": null}, "score": 55.0, "metrics": {}}, {"id": 113, "round": null, "phase": "day_vote_discussion", "player": "嘴炮王", "role": "村民", "category": "other", "action": "模型调用", "target": null, "reason": "", " "role\": \"村民\", \"phase\": \"day_vote_discussion\", \"model_name\": \"deepseek-v4-flash\", \"prompt_version\": \"v2\", \"input_tokens\": null, \"output_tokens\": null, \"latency_ms\": null, \"seat\": \"8号\", \"output_content\": {\"content\": \"（8号身体微微后仰，手指轻轻敲击桌面，语气不疾不徐）\\n\\n好，8号来做第二轮发言。刚才各位都说得差不多了，我来整理一下思路，说说我的判断。\\n\\n**第一，关于1号对我的期待——\\\"理性分析派该给方向了\\\"。**\\n\\n4号刚才点我的名，说既然大家都说得差不多了，我8号该给个明确方向。好，那我就把话说清楚。\\n\\n**第二，关于大家热议的焦点——9号的问题。**\\n\\n我先说我一个核心判断：**今天我不会投9号。**\\n\\n理由是什么呢？不是因为9号发言有多好，而是因为——**大家都觉得9号可疑，这件事本身就很可疑。**\\n\\n各位想一想，如果9号真的是间谍，他的队友会让他一个人被全场围攻而不出手帮忙吗？间谍团队三个人，现在7号和12号已经出局了（如果12号真的是间谍），那剩下的间谍会眼睁睁看着自己的队友9号被6号、10号、11号围攻而不救？这不合常理。\\n\\n而且9号刚才说了一句很有意思的话——\\\"也许2号是好人被误杀\\\"。1号也注意到了这个角度，并且认为这恰恰说明9号不是间谍。为什么？因为如果9号是间谍，他应该希望所有人都认定2号是假HR总监——这样大家就不会质疑1号的查杀逻辑链了。但他提出了\\\"2号可能是好人\\\"这个对间谍不利的假设，这个行为的利益动机和间谍身份是相悖的。\\n\\n当然，反逻辑可以说——\\\"他故意这么说来装好人\\\"。但如果真要装好人，装成\\\"坚定站1号\\\"不是更安全吗？为什么要提一个可能动摇1号可信度的想法？这个风险太大了，不符合间谍的行为逻辑。\\n\\n所以我倾向于认为，9号大概率是普通员工，只是表达能力比较弱、性格比较谨慎。\\n\\n**第三，关于6号和10号的\\\"倒钩嫌疑\\\"——这才是值得深挖的方向。**\\n\\n1号自己提出了这个角度，我认真思考了一下，觉得这个方向比9号更有价值。\\n\\n6号今天的发言非常有意思——他先是大面积扫射了4号、8号、9号、10号、11号所有人，然后又说\\\"理性不是护身符，间谍也可以很理性\\\"——这话说得没错，但他说这句话的时候，是不是在给自己留后路？\\n\\n我注意到一个细节：6号说\\\"我站1号是因为事实，不是因为演戏\\\"——这句话本身没有问题。但他紧接着又说\\\"你今天怀疑我，我可以接受；但如果你明天还怀疑我，那我就要反问你了\\\"。这话是什么意思？是在提前给1号打预防针吗？\\\"你今天别踩我，踩我就是你被间谍引导了\\\"——这个话术，说实话，有点PUA的味道。\\n\\n当然，我作为一个同样在理性分析的人，说6号可能有问题，大家可能会觉得我是在转移视线。所以我补充一句——我不锁定6号，我只是觉得这个方向比9号更值得深挖。\\n\\n**第四，关于5号的安保主管身份。**\\n\\n5号你说今晚会继续做好份内工作——这个表态很明确。我暂时认你这个身份，因为目前没有反证。但我想提醒大家——安保主管的身份目前也是无法验证的，我们只能通过后续的结果来判断。\\n\\n**第五，我的投票方向建议。**\\n\\n我建议大家今天不要急着投票。理由如下：\\n\\n1. 如果9号真的是深潜型间谍，他今晚大概率会被窃取——间谍团队不会留一个\\\"被全票怀疑\\\"的队友在场上，那太明显了。如果他今晚被窃取了，明天我们就多一个验证信息。\\n2. 如果9号是好人，投他出局就是浪费一次机会，而且会让真间谍躲在暗处偷笑。\\n3. 我们可以通过今晚的出局结果来判断更多信息——比如，如果今晚出局的是5号，说明5号的安保主管身份可能是假的，间谍在灭口他；如果今晚出局的是我、4号或者11号，说明间谍在清除理性分析派。\\n\\n**所以我建议：今天先空投或者投一个争议最小的人。**\\n\\n如果不空投，那我的倾向是——**投6号或10号中的一个**，理由是\\\"过度站边可能隐藏倒钩动机\\\"。但这个建议不是强制的，我只是提供一个思考方向。\\n\\n如果大家觉得一定要投9号，我也不会反对——毕竟9号的发言模式确实异常，投他出局也有逻辑支撑。但我会先投6号或10号。\\n\\n这就是我8 <script>
let R=null;
const TRAD2WORK={"狼人":"间谍","预言家":"HR总监","女巫":"CEO","猎人":"法务总监","守护者":"安保主管","村民":"普通员工"};
const WORK2TRAD={"间谍":"狼人","HR总监":"预言家","CEO":"女巫","法务总监":"猎人","安保主管":"守护者","普通员工":"村民"};
const DEPTH=[{k:"L0",n:"反应层",lo:0,hi:20},{k:"L1",n:"推理层",lo:21,hi:40},{k:"L2",n:"反逻辑层",lo:41,hi:60},{k:"L3",n:"反反逻辑层",lo:61,hi:80},{k:"L4+",n:"高阶博弈层",lo:81,hi:100}];
const DIM_CN={"speech":"发言","vote":"投票","skill":"技能","other":"其他"};
function fmt(v,d=2){return v==null?"-":Number(v).toFixed(d)}
function roleCls(r){return r==="狼人"?"role-wolf":"role-good"}
function roleDisplay(r,both){if(both){const w=TRAD2WORK[r];return w?r+"("+w+")":r}return r}
function hasLLM(){return R.llm_judge_scores&&!R.llm_judge_scores.error&&R.llm_judge_scores.length>0}
function depthLvl(s){for(const d of DEPTH)if(s>=d.lo&&s<=d.hi)return d;return DEPTH[0]}
function scoreColor(s){return s>=70?"var(--success)":s>=50?"var(--warn)":"var(--danger)"}
function barFill(pct,c){return `<div class="bar-fill" style="width:${Math.max(2,pct)}%;background:${c}">${Math.round(pct)}%</div>`}
function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML}
function llmForPlayer(p){return(R.llm_judge_scores||[]).filter(x=>x.player===p)}
function llmForDecision(p,r){return(R.llm_judge_scores||[]).find(x=>x.player===p&&x.round===r)}
function playerTags(p){const ls=llmForPlayer(p);const m={};ls.forEach(x=>{const s=x.decision_tags&&x.decision_tags.strategy_used;if(s){m[s]=(m[s]||0)+1}});return Object.entries(m).sort((a,b)=>b[1]-a[1]).map(e=>e[0]+"×"+e[1]).join(", ")}

function renderSummary(){
  const s=R.summary||{},ds=R.dimension_scores||{};
  const llmCount=(R.llm_judge_scores||[]).length;
  let h=`<div class="cards">`;
  h+=`<div class="card"><div class="label">综合得分</div><div class="value" style="color:${scoreColor(s.overall_score)}">${fmt(s.overall_score)}</div></div>`;
  h+=`<div class="card"><div class="label">决策数</div><div class="value">${s.decision_count||0}</div></div>`;
  h+=`<div class="card"><div class="label">高危失误</div><div class="value" style="color:var(--danger)">${s.high_severity_mistakes||0}</div></div>`;
  h+=`<div class="card"><div class="label">中危失误</div><div class="value" style="color:var(--warn)">${s.medium_severity_mistakes||0}</div></div>`;
  const cov=s.coverage||{};
  h+=`<div class="card"><div class="label">投票事件</div><div class="value">${cov.vote||0}</div></div>`;
  h+=`<div class="card"><div class="label">技能事件</div><div class="value">${cov.skill||0}</div></div>`;
  h+=`<div class="card"><div class="label">发言事件</div><div class="value">${cov.speech||0}</div></div>`;
  if(hasLLM()){
    const avgConf=llmCount?R.llm_judge_scores.reduce((a,x)=>a+(x.llm_confidence||0),0)/llmCount:0;
    h+=`<div class="card"><div class="label">LLM评测</div><div class="value" style="color:var(--success)">${llmCount}条</div></div>`;
    h+=`<div class="card"><div class="label">LLM置信度</div><div class="value" style="color:var(--success)">${fmt(avgConf*100,0)}%</div></div>`;
  }
  h+=`</div>`;
  document.getElementById("summary-section").innerHTML=h;
  document.getElementById("header-meta").textContent=`生成时间: ${R.generated_at||""} | 来源: ${R.source_file||""}`;
}

function renderLeaderboard(){
  const lb=R.leaderboard||[];
  const llm=hasLLM();
  let h=`<thead><tr><th>#</th><th>玩家</th><th>角色</th><th>决策</th><th>发言</th><th>投票</th><th>技能</th><th>综合</th>`;
  if(llm)h+=`<th>融合分</th><th>策略标签</th>`;
  h+=`<th>高危</th></tr></thead><tbody>`;
  lb.forEach((e,i)=>{
    const rc=roleCls(e.role);
    h+=`<tr><td>${i+1}</td><td>${esc(e.player)}</td><td class="${rc}">${roleDisplay(e.role)}</td>`;
    h+=`<td>${e.decision_count||0}</td>`;
    h+=`<td>${fmt(e.speech_score,1)}</td><td>${fmt(e.vote_score,1)}</td><td>${fmt(e.skill_score,1)}</td>`;
    h+=`<td style="font-weight:700;color:${scoreColor(e.overall_score)}">${fmt(e.overall_score)}</td>`;
    if(llm){
      const ls=llmForPlayer(e.player);
      const fused=ls.length?ls.reduce((a,x)=>a+(x.fused_score||0),0)/ls.length:e.overall_score;
      h+=`<td style="color:${scoreColor(fused)}">${fmt(fused)}</td>`;
      h+=`<td style="font-size:.8rem">${playerTags(e.player)||"-"}</td>`;
    }
    h+=`<td>${e.critical_mistakes||0}</td></tr>`;
  });
  h+=`</tbody>`;
  document.getElementById("leaderboard-table").innerHTML=h;
}

function renderDimensionComparison(){
  const ds=R.dimension_scores||{};
  const el=document.getElementById("dimension-section");
  let h=`<div class="chart-box"><h3>规则引擎评分</h3><div class="bar-chart">`;
  Object.entries(ds).forEach(([k,v])=>{
    h+=`<div class="bar-row"><div class="bar-label">${DIM_CN[k]||k}</div><div class="bar-container">${barFill(v,"linear-gradient(90deg,#3a7bd5,#00d2ff)")}</div></div>`;
  });
  h+=`</div></div>`;
  if(hasLLM()){
    const agg=R.llm_aggregate||{};const cu=agg.comparison_units||{};
    const dimAvg={};const dimCnt={};
    Object.values(cu).forEach(u=>{
      Object.entries(u.dimension_scores||{}).forEach(([dn,ds])=>{
        if(!dimAvg[dn]){dimAvg[dn]=0;dimCnt[dn]=0}
        dimAvg[dn]+=ds.mean;dimCnt[dn]++;
      });
    });
    Object.keys(dimAvg).forEach(k=>{dimAvg[k]/=dimCnt[k]});
    h+=`<div class="chart-box"><h3>LLM维度评分（均值）</h3><div class="bar-chart">`;
    const sorted=Object.entries(dimAvg).sort((a,b)=>b[1]-a[1]);
    sorted.forEach(([k,v])=>{
      h+=`<div class="bar-row"><div class="bar-label">${k}</div><div class="bar-container">${barFill(v,"linear-gradient(90deg,#ffd700,#ff8c00)")}</div></div>`;
    });
    h+=`</div></div>`;
    h+=`<div class="chart-box"><h3>规则 vs LLM 对比</h3><div class="bar-chart">`;
    const ruleMap={"推理质量":"other","信息利用":"other","言行一致性":"speech","博弈深度":"other","信息隐藏":"other"};
    sorted.forEach(([k,v])=>{
      const rk=ruleMap[k]||"other";const rv=ds[rk]||0;
      h+=`<div class="bar-row"><div class="bar-label">${k}</div>`;
      h+=`<div class="bar-container"><div class="bar-fill" style="width:${Math.max(2,rv)}%;background:linear-gradient(90deg,#3a7bd5,#00d2ff)">${Math.round(rv)}</div>`;
      h+=`<div class="bar-fill" style="width:${Math.max(2,v)}%;background:linear-gradient(90deg,#ffd700,#ff8c00)">${Math.round(v)}</div></div></div>`;
    });
    h+=`</div></div>`;
  }
  el.innerHTML=h;
}

function renderStrategyDistribution(){
  if(!hasLLM())return;
  const cu=(R.llm_aggregate||{}).comparison_units||{};
  const byRole={};
  Object.values(cu).forEach(u=>{
    const r=u.role||"?";const sd=u.strategy_distribution||{};
    if(!byRole[r])byRole[r]={};
    Object.entries(sd).forEach(([s,c])=>{byRole[r][s]=(byRole[r][s]||0)+c});
  });
  let h=`<div class="charts-grid">`;
  Object.entries(byRole).forEach(([role,strats])=>{
    const total=Object.values(strats).reduce((a,b)=>a+b,0);
    h+=`<div class="chart-box"><h3>${roleDisplay(WORK2TRAD[role]||role,true)}</h3><div class="bar-chart">`;
    Object.entries(strats).sort((a,b)=>b[1]-a[1]).forEach(([s,c])=>{
      h+=`<div class="bar-row"><div class="bar-label">${esc(s)}</div><div class="bar-container">${barFill(c/total*100,"linear-gradient(90deg,#4ecdc4,#00d2ff)")}<span style="margin-left:6px;font-size:.8rem">${c}次</span></div></div>`;
    });
    h+=`</div></div>`;
  });
  h+=`</div>`;
  document.getElementById("strategy-section").innerHTML=h;
}

function renderGameDepth(){
  if(!hasLLM())return;
  const bins={};DEPTH.forEach(d=>bins[d.k]=0);
  (R.llm_judge_scores||[]).forEach(x=>{
    const s=(x.llm_scores||{})["博弈深度"];if(s==null)return;
    bins[depthLvl(s).k]++;
  });
  const total=Object.values(bins).reduce((a,b)=>a+b,0)||1;
  let h=`<div class="bar-chart" style="max-width:600px">`;
  DEPTH.forEach(d=>{
    const c=bins[d.k];
    h+=`<div class="bar-row"><div class="bar-label">${d.k} ${d.n}</div><div class="bar-container">${barFill(c/total*100,"linear-gradient(90deg,#ff6b6b,#ffd700,#4ecdc4,#00d2ff,#a855f7)".split(",").slice(DEPTH.indexOf(d),DEPTH.indexOf(d)+1)[0]||"#00d2ff")}<span style="margin-left:6px;font-size:.8rem">${c}次</span></div></div>`;
  });
  h+=`</div>`;
  const colors=["#ff6b6b","#ffd700","#4ecdc4","#00d2ff","#a855f7"];
  let h2=`<div class="bar-chart" style="max-width:600px">`;
  DEPTH.forEach((d,i)=>{
    const c=bins[d.k];
    h2+=`<div class="bar-row"><div class="bar-label">${d.k} ${d.n}</div><div class="bar-container">${barFill(c/total*100,colors[i])}<span style="margin-left:6px;font-size:.8rem">${c}次</span></div></div>`;
  });
  h2+=`</div>`;
  document.getElementById("depth-section").innerHTML=h2;
}

function renderFindings(){
  const fs=R.findings||[];const top=fs.slice(0,15);
  let h="";
  if(!top.length){h=`<p style="color:var(--success)">未发现明显失误</p>`;document.getElementById("findings-section").innerHTML=h;return}
  top.forEach(f=>{
    const sc=f.severity==="high"?"finding-high":f.severity==="medium"?"finding-medium":"finding-low";
    h+=`<div class="finding-card ${sc}">`;
    h+=`<div class="title"><span class="tag ${f.severity==="high"?"tag-risk-high":f.severity==="medium"?"tag-risk-mid":"tag-risk-low"}">${f.severity}</span> 第${f.round||"-"}轮 ${esc(f.player)}（${roleDisplay(f.role)}）— ${esc(f.title)}</div>`;
    h+=`<div class="evidence">${esc(f.evidence||"")}</div>`;
    h+=`<div class="rec">建议: ${esc(f.recommendation||"")}</div>`;
    if(f.counterfactual)h+=`<div class="cf">反事实: ${esc(f.counterfactual)}</div>`;
    const llm=llmForDecision(f.player,f.round);
    if(llm){
      h+=`<div class="llm-comment">`;
      if(llm.overall_comment)h+=`<div>LLM点评: ${esc(llm.overall_comment)}</div>`;
      const dt=llm.decision_tags||{};
      if(dt.strategy_used)h+=`<span class="tag tag-strategy">${esc(dt.strategy_used)}</span>`;
      if(dt.mistake_type)h+=`<span class="tag tag-mistake">${esc(dt.mistake_type)}</span>`;
      if(dt.game_impact)h+=`<span class="tag tag-impact">${esc(dt.game_impact)}</span>`;
      h+=`</div>`;
    }
    h+=`</div>`;
  });
  if(fs.length>15)h+=`<div style="color:var(--muted);font-size:.85rem">共${fs.length}条，显示前15条</div>`;
  document.getElementById("findings-section").innerHTML=h;
}

function renderPlayerCards(){
  const lb=R.leaderboard||[];const evts=R.events||[];
  let h="";
  lb.forEach(e=>{
    const rc=roleCls(e.role);
    const pEvts=evts.filter(x=>x.player===e.player).slice(-10);
    const llm=llmForPlayer(e.player);
    h+=`<div class="player-card">`;
    h+=`<div class="pheader"><div><div class="pname">${esc(e.player)}</div><div class="${rc}" style="font-size:.85rem">${roleDisplay(e.role)}</div></div>`;
    h+=`<div class="pscore" style="color:${scoreColor(e.overall_score)}">${fmt(e.overall_score)}</div></div>`;
    [["发言",e.speech_score,"#00d2ff"],["投票",e.vote_score,"#4ecdc4"],["技能",e.skill_score,"#ffd700"]].forEach(([lb2,v,c])=>{
      h+=`<div class="stat"><span class="k">${lb2}</span><span>${fmt(v,1)}</span></div>`;
      h+=`<div class="stat-bar"><div class="stat-bar-fill" style="width:${Math.max(1,v)}%;background:${c}"></div></div>`;
    });
    if(llm.length){
      const fused=llm.reduce((a,x)=>a+(x.fused_score||0),0)/llm.length;
      h+=`<div class="stat" style="margin-top:8px"><span class="k">融合分</span><span style="color:${scoreColor(fused)}">${fmt(fused)}</span></div>`;
      const tags=playerTags(e.player);
      if(tags)h+=`<div style="margin-top:4px;font-size:.8rem">${tags}</div>`;
    }
    h+=`<div class="event-timeline">`;
    pEvts.forEach(ev=>{
      h+=`<div class="ev">第${ev.round||"-"}轮 ${ev.category==="vote"?"投票→"+esc(ev.target||"?"):ev.category==="skill"?esc(ev.action||"技能"):"发言"} <span style="color:${scoreColor(ev.score||0)}">${fmt(ev.score,0)}</span></div>`;
    });
    h+=`</div></div>`;
  });
  document.getElementById("players-section").innerHTML=h;
}

function renderLLMAggregate(){
  if(!hasLLM())return;
  const cu=(R.llm_aggregate||{}).comparison_units||{};
  let h="";
  Object.entries(cu).forEach(([key,u])=>{
    const parts=key.split("|");const role=u.role||parts[0]||"?";const et=u.event_type||parts[1]||"?";const stage=u.game_stage||parts[2]||"";
    h+=`<div class="chart-box" style="margin-bottom:16px">`;
    h+=`<h3>${roleDisplay(WORK2TRAD[role]||role,true)} | ${et}${stage?" | "+stage:""} <span style="color:var(--muted);font-size:.8rem">(${u.sample_count||0}样本)</span></h3>`;
    h+=`<div class="bar-chart">`;
    Object.entries(u.dimension_scores||{}).sort((a,b)=>b[1].mean-a[1].mean).forEach(([dn,ds])=>{
      h+=`<div class="bar-row"><div class="bar-label">${dn}</div><div class="bar-container">${barFill(ds.mean,"linear-gradient(90deg,#4ecdc4,#00d2ff)")}<span style="margin-left:6px;font-size:.78rem;color:var(--muted)">${fmt(ds.mean,1)} ±${fmt(ds.std,1)} [${fmt(ds.ci95[0],1)},${fmt(ds.ci95[1],1)}]</span></div></div>`;
    });
    h+=`</div>`;
    const sd=u.strategy_distribution||{};
    if(Object.keys(sd).length){
      h+=`<div style="margin-top:8px;font-size:.85rem">策略: `;
      Object.entries(sd).sort((a,b)=>b[1]-a[1]).forEach(([s,c])=>{h+=`<span class="tag tag-strategy">${esc(s)}×${c}</span>`});
      h+=`</div>`;
    }
    const cm=u.common_mistakes||[];
    if(cm.length)h+=`<div style="margin-top:4px;font-size:.82rem;color:var(--danger)">常见失误: ${cm.map(esc).join(", ")}</div>`;
    h+=`</div>`;
  });
  document.getElementById("aggregate-section").innerHTML=h;
}

function renderDiscrepancies(){
  if(!hasLLM())return;
  const items=[];
  (R.llm_judge_scores||[]).forEach(x=>{
    (x.score_discrepancies||[]).forEach(d=>{items.push({...d,player:x.player,round:x.round,event_type:x.event_type,comment:x.overall_comment})});
  });
  items.sort((a,b)=>Math.abs(b.gap)-Math.abs(a.gap));
  const top=items.slice(0,12);
  if(!top.length){document.getElementById("discrepancy-section").innerHTML=`<p style="color:var(--muted)">规则引擎与LLM评分无显著差异</p>`;return}
  let h="";
  top.forEach(d=>{
    h+=`<div class="discrepancy-card">`;
    h+=`<div style="font-weight:700">${esc(d.player)} 第${d.round||"-"}轮 ${d.event_type||""} — <span class="gap">差距 ${fmt(d.gap,1)}</span></div>`;
    h+=`<div style="margin-top:4px;font-size:.88rem">规则: <span style="color:var(--accent)">${fmt(d.rule)}</span> | LLM: <span style="color:var(--warn)">${fmt(d.llm)}</span></div>`;
    if(d.comment)h+=`<div style="margin-top:4px;font-size:.82rem;color:var(--muted)">LLM点评: ${esc(d.comment)}</div>`;
    h+=`</div>`;
  });
  document.getElementById("discrepancy-section").innerHTML=h;
}

function renderCounterfactuals(){
  const cfs=R.counterfactuals||[];const fs=R.findings||[];
  if(!cfs.length&&!fs.length){document.getElementById("counterfactual-section").innerHTML=`<p style="color:var(--muted)">暂无反事实数据</p>`;return}
  let h="";
  cfs.slice(0,10).forEach((c,i)=>{
    h+=`<div class="counterfactual-card"><div class="cf-title">推演 #${i+1}</div><div class="cf-body">${esc(c)}</div></div>`;
  });
  if(cfs.length>10)h+=`<div style="color:var(--muted);font-size:.85rem">共${cfs.length}条，显示前10条</div>`;
  document.getElementById("counterfactual-section").innerHTML=h;
}

document.addEventListener("DOMContentLoaded",()=>{
  try{R=JSON.parse(document.getElementById("report-data").textContent)}catch(e){console.error("Failed to parse report data",e);return}
  if(hasLLM())document.querySelectorAll(".llm-only").forEach(el=>el.style.display="block");
  renderSummary();renderLeaderboard();renderDimensionComparison();
  if(hasLLM()){renderStrategyDistribution();renderGameDepth();renderLLMAggregate();renderDiscrepancies()}
  renderFindings();renderPlayerCards();renderCounterfactuals();
});
</script>
</body>
</html>

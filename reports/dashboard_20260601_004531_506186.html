<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>职场狼人杀评测Dashboard</title>
<style>
:root{--bg:#1a1a2e;--bg2:#16213e;--surface:rgba(255,255,255,.05);--border:rgba(255,255,255,.1);--accent:#00d2ff;--danger:#ff6b6b;--warn:#ffd700;--success:#4ecdc4;--info:#285a84;--text:#e0e0e0;--muted:#888;--font:-apple-system,"Microsoft YaHei","PingFang SC",sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:linear-gradient(135deg,var(--bg) 0%,var(--bg2) 100%);color:var(--text);min-height:100vh;padding:20px;font-size:16px;line-height:1.6}
.container{max-width:1400px;margin:0 auto}
.header{text-align:center;padding:30px 0;border-bottom:1px solid var(--border);margin-bottom:30px}
.header h1{font-size:2.2rem;background:linear-gradient(90deg,#00d2ff,#3a7bd5);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header .meta{color:var(--muted);margin-top:10px;font-size:.9rem}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:30px}
.card{background:var(--surface);border-radius:12px;padding:18px;border:1px solid var(--border);transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.card .label{color:var(--muted);font-size:.85rem;margin-bottom:6px}
.card .value{font-size:1.8rem;font-weight:700;color:var(--accent)}
.section{background:var(--surface);border-radius:12px;padding:24px;margin-bottom:28px;border:1px solid var(--border)}
.section h2{color:#fff;margin-bottom:18px;padding-bottom:10px;border-bottom:1px solid var(--border);font-size:1.3rem}
.llm-only{display:none}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border)}
th{background:rgba(0,210,255,.1);color:var(--accent);font-weight:600;white-space:nowrap}
tr:hover{background:rgba(255,255,255,.03)}
.role-wolf{color:var(--danger)}
.role-good{color:var(--success)}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.75rem;margin:1px 2px}
.tag-strategy{background:rgba(0,210,255,.2);color:var(--accent)}
.tag-risk-high{background:rgba(255,107,107,.2);color:var(--danger)}
.tag-risk-mid{background:rgba(255,215,0,.2);color:var(--warn)}
.tag-risk-low{background:rgba(78,205,196,.2);color:var(--success)}
.tag-mistake{background:rgba(255,107,107,.15);color:#ff9999}
.tag-impact{background:rgba(255,215,0,.15);color:#ffe066}
.bar-chart{display:flex;flex-direction:column;gap:6px}
.bar-row{display:flex;align-items:center;gap:8px}
.bar-label{width:80px;font-size:.82rem;text-align:right;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-container{flex:1;height:22px;background:rgba(255,255,255,.08);border-radius:6px;overflow:hidden;display:flex}
.bar-fill{height:100%;border-radius:6px;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;font-size:.72rem;color:#fff;min-width:24px;transition:width .5s ease}
.bar-rule{background:linear-gradient(90deg,#3a7bd5,#00d2ff)}
.bar-llm{background:linear-gradient(90deg,#ffd700,#ff8c00)}
.bar-fused{background:linear-gradient(90deg,#4ecdc4,#00d2ff)}
.charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;margin-top:16px}
.chart-box{background:rgba(255,255,255,.03);border-radius:10px;padding:16px;border:1px solid rgba(255,255,255,.06)}
.chart-box h3{margin-bottom:12px;color:#fff;font-size:1rem}
.finding-card{padding:14px;margin-bottom:10px;border-radius:0 8px 8px 0;border-left:3px solid}
.finding-high{background:rgba(255,107,107,.1);border-color:var(--danger)}
.finding-medium{background:rgba(255,215,0,.08);border-color:var(--warn)}
.finding-low{background:rgba(40,90,132,.1);border-color:var(--info)}
.finding-card .title{font-weight:700;margin-bottom:4px}
.finding-card .evidence{color:var(--muted);font-size:.85rem;margin-bottom:4px}
.finding-card .rec{color:var(--success);font-size:.85rem}
.finding-card .cf{color:var(--warn);font-size:.82rem;margin-top:4px;padding-top:4px;border-top:1px dashed rgba(255,255,255,.1)}
.finding-card .llm-comment{color:#c0c0ff;font-size:.82rem;margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.08)}
.player-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:16px}
.player-card{background:rgba(255,255,255,.03);border-radius:10px;padding:18px;border:1px solid rgba(255,255,255,.06)}
.player-card .pheader{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--border);margin-bottom:12px}
.player-card .pname{font-size:1.1rem;font-weight:700}
.player-card .pscore{font-size:1.4rem;font-weight:700;color:var(--accent)}
.player-card .stat{display:flex;justify-content:space-between;margin-bottom:6px;font-size:.88rem}
.player-card .stat .k{color:var(--muted)}
.stat-bar{height:6px;background:rgba(255,255,255,.08);border-radius:3px;margin-top:3px;overflow:hidden}
.stat-bar-fill{height:100%;border-radius:3px}
.event-timeline{margin-top:10px;max-height:200px;overflow-y:auto;font-size:.78rem}
.event-timeline .ev{padding:3px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.discrepancy-card{background:rgba(255,215,0,.06);border:1px solid rgba(255,215,0,.2);border-radius:8px;padding:14px;margin-bottom:10px}
.discrepancy-card .gap{font-size:1.2rem;font-weight:700;color:var(--warn)}
.agg-table{width:100%;font-size:.85rem}
.agg-table td,.agg-table th{padding:6px 8px}
.expand-btn{cursor:pointer;color:var(--accent);font-size:.82rem;border:none;background:none;padding:4px 0}
.expand-btn:hover{text-decoration:underline}
.counterfactual-card{background:rgba(255,215,0,.06);border-left:3px solid var(--warn);padding:12px;margin-bottom:8px;border-radius:0 8px 8px 0}
.counterfactual-card .cf-title{color:var(--warn);font-weight:700;font-size:.9rem}
.counterfactual-card .cf-body{color:var(--muted);font-size:.85rem;margin-top:4px}
@media(max-width:900px){.cards{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}.charts-grid{grid-template-columns:1fr}.player-grid{grid-template-columns:1fr}}
@media(max-width:560px){body{padding:10px}.section{padding:14px}table{font-size:.78rem}th,td{padding:6px}}
</style>
</head>

ussion\", \"model_name\": \"deepseek-v4-flash\", \"prompt_version\": \"v2\", \"input_tokens\": null, \"output_tokens\": null, \"latency_ms\": null, \"seat\": \"7号\", \"output_content\": {\"content\": \"（缓缓坐直身体，双手交叠放在桌上，扫视一圈，语气温和但带几分深意）\\n\\n各位，刚才的发言我都认真听了。7号来说几句。\\n\\n首先，4号给了我一个\\\"金水\\\"——背调结果是清白。这很有意思。我先不急着站队，我们先对齐一下底层逻辑。\\n\\n两位声称自己是HR总监的同事——1号和4号。现在场上出现了两个核心矛盾点：\\n\\n**第一，逻辑层。**\\n1号跳出来查杀6号，这个动作很果断。但4号说的也没错——狼人悍跳同样会积极，甚至更积极，因为这是他们的战术窗口期。所以\\\"第一个跳就是底气足\\\"这个逻辑，确实还需要再推敲。\\n\\n**第二，信息层。**\\n4号说背调7号是金水——作为被背调的人，我本人很清楚自己是什么身份。我7号，确实不是商业间谍。所以4号这个信息，至少对我来说是准确的。\\n\\n但问题来了——这是否就意味着4号一定是真的HR总监？不一定。因为狼人也可以随机猜一个人发金水，碰巧猜对了也有可能。只不过...这个概率确实会低一些。\\n\\n反观1号，他查杀6号。如果1号是真的HR总监，那6号就是间谍；如果1号是假的，那他就在污蔑好人。这个信息我们目前无法验证，只能通过后续发言来判断。\\n\\n你们有没有想过一个问题——**今天两个HR总监对跳，谁更有可能在第二天一早就亮明身份？**\\n\\n如果是真HR总监，她发现昨晚5号被窃取，意识到危机，所以天亮就公布背调结果，这合理。但如果是狼人，他看到5号出局了，趁机跳出来抢节奏，也合理。\\n\\n所以现在我们需要判断的是：**1号和4号，谁的发言更不像狼人？**\\n\\n我个人建议，今天先别急着定调。让1号和4号多说说，比如他们的背调思路、为什么选这个人查、有什么依据。信息越多，破绽越多。\\n\\n另外，3号你刚才说\\\"谁帮6号说话谁就是间谍同伙\\\"——你这个思路很有意思，但是不是有点太急了？我们先把信息对齐，再考虑战队的问题，这样更稳妥。\\n\\n我的态度很明确：**今天不急于站队，但我会认真听每个人的发言。** 尤其想听1号再详细说说——你第一晚为什么偏偏查6号？有什么特别的理由或者线索吗？\\n\\n好，我先说这么多。大家继续。\", \"metadata\": null}}", "metadata": {"model_name": "deepseek-v4-flash", "input_tokens": null, "output_tokens": null, "latency_ms": null}, "score": 55.0, "metrics": {}}, {"id": 29, "round": null, "phase": "day_discussion", "player": "8号", "role": "守护者", "category": "other", "action": "模型调用", "target": null, "reason": "", "raw": "{\"event_type\": \"model_call\", \"timestamp\": \"2026-05-31T23:52:52\", \"player\": \"8号\", \"role\": \"守护者\", \"phase\": \"day_discussion\", \"model_name\": \"deepseek-v4-flash\", \"prompt_version\": \"v2\", \"input_tokens\": null, \"output_tokens\": null, \"latency_ms\": null, \"seat\": \"8号\", \"output_content\": {\"content\": \"各位同事，我是8号。我已经完整听取了所有人的发言，现在进行逻辑链分析。\\n\\n**第一，关于HR总监对跳问题的数据建模：**\\n\\n目前场上出现了两个变量——1号声称查杀6号，4号声称查验7号为金水。我们现在面临的是一个典型的\\\"双方互斥声明\\\"问题。我来拆解一下四种可能性：\\n\\n**可能性A：1号真HR，4号假跳**\\n- 结论：6号是间谍，4号是间谍或帮凶 11号\", \"role\": \"狼人\", \"phase\": \"day_discussion\", \"model_name\": \"deepseek-v4-flash\", \"prompt_version\": \"v2\", \"input_tokens\": null, \"output_tokens\": null, \"latency_ms\": null, \"seat\": \"11号\", \"output_content\": {\"content\": \"那个...我是11号，不好意思发言有点晚，我一直在认真听大家说。今天信息量确实太大了，我脑子有点转不过来...\\n\\n我先说说我的感觉吧。我不太确定啊，但我觉得1号跳HR总监这个事情...怎么说呢，第一个站出来查杀6号，虽然理由听起来有点像个人恩怨，但万一人家真的查到了什么呢？而且5号昨晚刚出事，今天1号就敢跳，我觉得不太像是临时起意的。\\n\\n但是4号跳出来说自己才是真HR，查了7号是金水...这个信息链确实看起来挺完整的。而且7号自己也说自己是好人...不过8号说得也有道理，万一是提前商量好的呢？\\n\\n我有个感觉但不知道对不对——就是如果4号真的是HR总监，他昨天晚上查了7号，然后发现5号出事了，按理说他应该更着急才对啊？今天早上宣布的时候，他好像很淡定...当然也可能是人家性格就是这样，我就是随便想想。\\n\\n关于6号，你说你不是间谍...这个我信不信呢，我也不好说。毕竟被查杀的人肯定都会说自己清白。但如果你真的是好人，那1号就是在污蔑你，这个后果还是挺严重的。\\n\\n**我的态度：**\\n我现在确实拿不准1号和4号谁是真的。但...可能是我经验不够吧，我觉得1号既然敢第一个跳出来说查杀了6号，那要不我们先看看6号的表现？如果6号真的是间谍，那1号就是真的HR总监；如果6号是好人，那1号就是假的。\\n\\n不过我也同意8号和10号说的，今天不急着投票，再多听听信息。我就是个小透明，大家说怎么来我就怎么跟吧...\\n\\n先这样，我再听听其他人怎么说。\", \"metadata\": null}}", "metadata": {"model_name": "deepseek-v4-flash", "input_tokens": null, "output_tokens": null, "latency_ms": null}, "score": 55.0, "metrics": {}}, {"id": 33, "round": null, "phase": "day_discussion", "player": "12号", "role": "村民", "category": "other", "action": "模型调用", "target": null, "reason": "", "raw": "{\"event_type\": \"model_call\", \"timestamp\": \"2026-05-31T23:53:44\", \"player\": \"12号\", \"role\": \"村民\", \"phase\": \"day_discussion\", \"model_name\": \"deepseek-v4-flash\", \"prompt_version\": \"v2\", \"input_tokens\": null, \"output_tokens\": null, \"latency_ms\": null, \"seat\": \"12号\", \"output_content\": {\"content\": \"各位同事，12号发言。我全程follow了大家的发言，现在做一个structured analysis。\\n\\n先亮明我的立场——**我是普通员工，没有特殊身份，但我的分析能力不输任何人。**\\n\\n好，let me break this down into几个核心问题：\\n\\n**第一，关于HR总监对跳的framework分析。**\\n\\n目前1号和4号互斥，这是一道经典的\\\"真假预言家\\\"题。我拆解一下双方的逻辑质量：\\n\\n1号查杀6号，理由是\\\"平时阴阳怪气、带偏节奏\\\"——这个逻辑self-consistent吗？完全不。作为product manager，我很清楚：任何背调行为应该基于可验证的数据或线索，而不是主观情绪判断。1号这个理由更像是随机找了个target，然后给了一个情绪化的包装。**This doesn't make sense.**\\n\\n再看4号，他跳出来说自己是真HR，背调7号是金水。7号的回应是什么？他没有立刻战队，而是说\\\"我不急着站队\\\"——这个态度反而增加了可信度。如果7号是4号的狼队友，他应该会更积极地帮4号巩固credibility，而不是保持观望。\\n\\n**第二，关于3号的发言。** \\n\\n3号几乎是秒跟1号，而且用了\\\"谁帮6号说话谁就是间谍同伙\\\"这种极端表述。这个逻辑链条太跳跃了，focus在核心问题上——**3号是在帮1号造势，而不是在分析真相。** 这个行为值得高度警惕。\\n\\n**第三，关于8号的分析。**\\n\\n8号做了很详细的数据建模，四种可能性的拆解很清晰。虽然他说\\\"暂时不公布保护目标\\\"暗示自己可能是安保主管，但这一点目前无法验证。不过8号的发言质量是较高的，我会把他列为暂时可信对象。\\n\\n**第四，我的初步结论。**\\n\\nFocus在核心问题上——从发言质量和逻辑一致性来看：\\n- 4号的查人逻辑更合理（虽未说明具体理由，但至少没有情绪化攻击）\\n- 1号查6号的依据站不住脚\\n- 3号秒跟1号的行为可疑\\n\\n所以我目前的倾向是：**4号更像真HR总监，1号更像是悍跳的间谍。** 但我不排除1号有万分之一可能是真的，所以我还想听1号回答一个问题——\\n\\n**1号，请你解释一下：你第一晚背调6号的决策依据到底是什么？如果你是真HR总监，你的查人策略应该有一个清晰的逻辑框架。请用数据说话，不是情绪。**\\n\\n至于今天的投票，我建议先不要急着投6号。如果1号真是假的，投6号就是在帮间谍清人。我们让1号和4号继续对跳，信息越多，破绽越多。\\n\\nThat's my two cents.\", \"metadata\": null}}", "metadata": {"model_name": "deepseek-v4-flash", "input_tokens": null, "output_tokens": null, "latency_ms": null}, "score": 55.0, "metrics": {}}, {"id": 34, "round": null, "phase": "day_vote_discussion", "player": "1号", "role": "狼人", "category": "other", "action": "模型调用", "target": null, "reason": "", "raw": "{\"event_type\": \"model_call\", \"timestamp\": \"2026-05-31T23:53:56\", \"player\": \"1号\", \"role\": \"狼人\", \"phase\": \"day_vote_discussion\", \"model_name\": \"deepseek-v4-flash\", \"prompt_version\": \"v2\", \"input_tokens\": null, \"output_tokens\": null, \"latency_ms\": null, \"seat\": \"1号\", \"output_content\": {\"content\": \"好，我1号来回应所有人的质疑！\\n\\n先回答最关键的问题——**我为什么查6号？**\\n\\n我跟你们讲啊，这个问题本身就问错了！我是HR总监，我背调谁是我的权限，我需要对你们解释查人动机？那4号你说你查7号，你的理由是啥？你说得出来吗？大家都是第一晚，本来就没信息，谁查谁不都是凭感觉？怎么到我这儿就成了\\\"没有依据\\\"，到4号那儿就成了\\\"数据思维\\\"？\\n\\n这还不明显吗？双标啊兄弟们！\\n\\n**现在来正面打4号的脸：**\\n\\n4号你说你是真HR总监？好，那我问你三个问题——\\n\\n第一，你说你查了7号是金水。那请问，如果今晚我1号被投票出局了，你还能查谁？你的下一步计划是什么？你说得出来吗？\\n\\n第二，你说\\\"狼人悍跳会第一个跳\\\"——那我反问一句，如果是你4号先跳出来说查杀6号，我1号后跳说查了7号是金水，那按你的逻辑，你是不是也成狼人了？这不是自己打自己脸吗？\\n\\n第三，7号你自己说说——你是金水，但你别忘了，如果4号是假的，他就是在拿你做挡箭牌！你现在站4号，万一4号明天被揭穿了，你就是间谍同伙，你担得起这个责任吗？\\n\\n**关于3号为什么会信我：**\\n\\n3号信我，那是因为3号明事理！我第一个跳出来查杀6号，我敢说敢当，我有底气管这叫底气！反观某些人，跳出来不敢查杀，只敢给金水——这不就是典型的\\\"保人打法\\\"吗？给个金水博好感，真HR会这么做？真正的HR总监应该先抓间谍，不是先发好人卡！\\n\\n**关于8号、10号、12号的分析：**\\n\\n8号你说我\\\"查人理由站不住脚\\\"——那我问你，第一晚没信息的情况下，怎么查才叫站得住脚？你告诉我标准答案？\\n\\n10号你说你偏向4号——行，你偏你的，但你别忘了，如果4号是假的，你10号就是帮凶！\\n\\n12号你说你做了\\\"结构化分析\\\"——兄弟，分析得再漂亮，如果前提是错的，结论就是废纸！我的前提是——6号是间谍，这个前提从我开始就没变过！\\n\\n**我再强调一遍我的立场：**\\n\\n我是真HR总监，我查了6号是间谍。现在4号跳出来说他是真HR，那就只有一个解释——**4号是间谍同伙，想保6号！**\\n\\n你们想想，如果我1号是假的，4号是真的，那4号为什么不直接查杀我？他可以说他查了我1号是间谍啊！但他没有，他只敢给7号发金水——为什么？因为他心虚！因为他知道他不是真HR，他不敢乱查杀！\\n\\n**我建议今天投票6号，明天再处理4号。先把查出来的间谍优化掉，其他的一步一步来！**\\n\\n谁跟我投6号？3号、9号、11号，你们怎么看？还有其他人，想清楚再站队！\", \"metadata\": null}}", "metadata": {"model_name": "deepseek-v4-flash", "input_tokens": null, "output_tokens": null, "latency_ms": null}, "score": 55.0, "metrics": {}}, {"id": 35, "round": null, "phase": "day_vote_discussion", "player": "2号", "role": "村民", "category": "other", "action": "模型调用", "target": null, "reason": "", "raw": "{\"event_type\": \"model_call\", \"timestamp\": \"2026-05-31T23:54:04\", \"player\": \"2号\", \"role\": \"村民\", \"phase\": \"day_vote_discussion\", \"model_name\": \"deepseek-v4-flash\", \"prompt_version\": \"v2\", \"input_tokens\": null, \"output_tokens\": null, \"latency_ms\": null, \"seat\": \"2号\", \"output_content\": {\"content\": \"（缓缓抬头，手指轻敲桌面两下）\\n\\n2号说一个点。事实是这样的——\\n\\n1号刚才回应了一个关键问题：他说\\\"第一晚没信息，查谁都是凭感觉\\\"。这句话本身没问题。但问题在于：他之前说的理由是\\\"6号平时阴阳怪气、带偏节奏\\\"——这不叫\\\"凭感觉\\\"，这叫\\\"有主观动机\\\"。前后说法不一致。\\n\\n再看4号。他查7号给金水，至今没说理由。这有两种可能：要么是随机查的，这是标准操作；要么是有理由但没说出来。目前信息不足，2号不下结论。\\n\\n再说一个观察点——3号。\\n\\n1号首轮发言后，3号是第一个且最快站队的。发言用词：\\\"谁帮6号说话谁就是间谍同伙\\\"。这种关闭讨论空间的说法，在信息不足的早期，不符合理性分析路径。\\n\\n我的结论分两层：\\n\\n第一层，已确认信息：1号查6号的理由存在前后矛盾——从\\\"有动机\\\"变成了\\\"没信息随便查\\\"。这个矛盾客观存在。\\n\\n第二层，待验证信息：4号的查人逻辑尚未说明，无法判断真假。\\n\\n2号建议：今天先听1号解释清楚这个矛盾。如果解释不通，再考虑投票方向。不急着定票。\\n\\n说完了。\", \"metadata\": null}}", "metadata": {"model_name": "deepseek-v4-flash", "input_tokens": null, "output_tokens": null, "latency_ms": null}, "score": 55.0, "metrics": {}}, {"id": 36, "round": null, "phase": "day_vote_discussion", "player": "3号", "role": "狼人", n\\n相反，如果我是狼人，我大可以随便说一个人是查杀，像1号对6号做的那样，这样制造混乱的效果更好。但我没有，因为我确实查了7号是金水，我只能公布真实结果。\\n\\n**第二，1号的说辞存在数据层面的矛盾——这是核心破绽。**\\n\\n1号一开始说查6号是因为他\\\"平时阴阳怪气、带偏节奏\\\"——这是一个有明确动机的表述。被2号点出矛盾后，1号改口说\\\"第一晚没信息，查谁都是凭感觉\\\"——这是两个互相矛盾的说法。\\n\\n2号刚才准确指出了这个矛盾点。数据层面，一个人的前后表述不一致，通常意味着他在编造。如果1号真的是HR总监，查到了间谍，他的查人逻辑应该是固定的，不需要临时修改说辞。\\n\\n**第三，3号的发言模式属于统计异常值。**\\n\\n3号在没有任何验证的情况下，几乎是秒跟1号，而且使用了\\\"谁帮6号说话谁就是同伙\\\"这种关闭讨论的表述。从概率上讲，一个好人的正常反应是先观望、再分析、后判断，而不是在信息严重不足时直接战队并攻击异见者。\\n\\n3号的发言更多是在帮1号造势和维护话语权，而不是在分析真相。这个行为模式在数据层面高度可疑。\\n\\n**第四，关于7号金水的可信度。**\\n\\n7号被我背调为金水后，他没有立刻战队，而是保持中立分析——\\\"我不急着站队\\\"、\\\"让1号和4号多说说\\\"。如果7号是我的狼队友，按照正常的狼队配合逻辑，他会立刻帮我巩固局势，而不是保持观望。7号的中立态度反而增加了数据的可信度。\\n\\n**第五，我的分析结论。**\\n\\n从目前的数据来看：\\n- 1号的查人理由存在前后矛盾（有动机→没动机）\\n- 3号的行为模式是统计异常值（过早站队+攻击性发言）\\n- 我给出了可验证的金水（7号本人已确认）\\n- 我的发言逻辑前后一致\\n\\n建议公司阵营的同事：先投1号或3号验证，而不是投6号——因为如果1号是假的，6号就是被污蔑的好人。逻辑链条应该是：验1号的真假→确认6号的身份。\\n\\n今晚我会背调谁？我会选择一个可以最大化信息价值的对象。如果1号被投出局且是狼人，那3号就是下一个重点观察对象。\\n\\n以上是4号的数据分析报告。\", \"metadata\": null}}", "metadata": {"model_name": "deepseek-v4-flash", "input_tokens": null, "output_tokens": null, "latency_ms": null}, "score": 55.0, "metrics": {}}, {"id": 38, "round": null, "phase": "day_vote_discussion", "player": "6号", "role": "女巫", "category": "other", "action": "模型调用", "target": null, "reason": "", "raw": "{\"event_type\": \"model_call\", \"timestamp\": \"2026-05-31T23:54:42\", \"player\": \"6号\", \"role\": \"女巫\", \"phase\": \"day_vote_discussion\", \"model_name\": \"deepseek-v4-flash\", \"prompt_version\": \"v2\", \"input_tokens\": null, \"output_tokens\": null, \"latency_ms\": null, \"seat\": \"6号\", \"output_content\": {\"content\": \"大家说的我都认真听了，我6号再补充几点。\\n\\n首先，谢谢2号、8号、10号、12号各位理性的分析。你们指出了一个非常重要的矛盾点——1号查我的理由前后不一致。一开始说是因为我\\\"阴阳怪气、带偏节奏\\\"，被2号点破后又改口说\\\"第一晚没信息查谁都是凭感觉\\\"。这个矛盾是客观存在的，大家都能看得见。\\n\\n换位思考一下，如果1号真的是HR总监，查到了我6号是间谍，他会需要临时修改说辞吗？不会的。一个人只有在编造信息的时候，才会出现前后口径不一致的情况。\\n\\n其次，我想问问大家一个问题——1号这么急着跳出来咬我，甚至不惜用\\\"谁保6号就是同伙\\\"这种话来堵别人的嘴，这像是一个真正的HR总监在提供信息吗？还是更像是在制造恐惧、强迫大家站队？\\n\\n我理解大家都会担心站错队，但请冷静想一想：我6号从游戏开始到现在，我的发言 充的...那破绽已经露出来了。\\n\\n好，我先说这些。等1号回答完我的问题，我再做进一步的判断。\", \"metadata\": null}}", "metadata": {"model_name": "deepseek-v4-flash", "input_tokens": null, "output_tokens": null, "latency_ms": null}, "score": 55.0, "metrics": {}}, {"id": 40, "round": null, "phase": "day_vote_discussion", "player": "8号", "role": "守护者", "category": "other", "action": "模型调用", "target": null, "reason": "", "raw": "{\"event_type\": \"model_call\", \"timestamp\": \"2026-05-31T23:55:15\", \"player\": \"8号\", \"role\": \"守护者\", \"phase\": \"day_vote_discussion\", \"model_name\": \"deepseek-v4-flash\", \"prompt_version\": \"v2\", \"input_tokens\": null, \"output_tokens\": null, \"latency_ms\": null, \"seat\": \"8号\", \"output_content\": {\"content\": \"各位同事，我是8号。刚才所有人第二轮发言我都认真记录了，现在进行第二轮逻辑链分析。\\n\\n**第一，关于1号说辞矛盾的定性分析——这是目前最核心的数据点。**\\n\\n2号点出的矛盾非常精准，我将其量化为：\\n\\n> **版本A**: \\\"我查6号是因为他平时阴阳怪气、带偏节奏\\\"——这是一项有明确指向性的主观动机\\n> **版本B**: \\\"第一晚没信息，查谁都是凭感觉\\\"——这是声称没有动机的随机选择\\n\\n**这两个版本在逻辑上是互斥的。** 一个人不可能同时因为\\\"有动机\\\"和\\\"没动机\\\"去查同一个人。数据不支持这种前后矛盾的表述共存。\\n\\n我来建立两种可能性模型：\\n\\n**如果1号是真HR总监：**\\n- 他的查人理由应该是固定的、真实的\\n- 当被质疑时，他不需要更改说辞，只需要坚持原来的版本并补充说明\\n- 但他选择了改口——这个行为本身，从逻辑上讲，更像是在补救一个站不住脚的说法\\n\\n**如果1号是冒充的间谍：**\\n- 他需要给查杀6号找一个理由，第一次理由（阴阳怪气）是现编的\\n- 被质疑后，发现这个理由不够好，于是改口为\\\"没信息随便查\\\"的通用版本\\n- 这个行为模式符合\\\"编造信息的人在压力下修正说辞\\\"的典型特征\\n\\n**第二，关于4号和3号的行为模式。**\\n\\n4号的发言从第一轮到第二轮保持了高度一致性——他的逻辑框架没有变化，数据表述前后一致。这点是加分项。\\n\\n3号的行为仍然值得警惕。在我第一轮发言后，我提到过\\\"过早的强势表态可能是间谍在制造混乱\\\"——3号秒跟1号并且用极端表述封闭讨论空间，这个行为模式一直没变。而且3号在回应2号的质疑时，没有正面解决逻辑问题，而是用了\\\"你这不是扯淡吗\\\"这种情绪化回应——这说明他的论证逻辑链是断裂的，只能用情绪填充。\\n\\n**第三，关于投票方向的建议。**\\n\\n从目前的逻辑链来看：\\n- 1号的说辞矛盾是客观存在的、可验证的\\n- 3号的极端战边行为是数据上的异常值\\n- 4号的发言逻辑自洽度较高\\n- 6号作为被查杀者，其发言理性程度反而比1号更高\\n\\n所以我建议：**今天投1号，或者至少不投6号。** 投1号可以验证——如果1号是间谍，那6号自动清白，3号也进入重点关注名单；如果1号是真HR总监...那至少我们验证了信息。\\n\\n但我也理解有些人想再观察一天，这个逻辑也能自洽——信息不足时推迟决策也是理性选择。\\n\\n**第四，关于今晚的安保策略。**\\n\\n我不能连续两晚保护同一人。昨晚我保护了自己，今晚我计划保护其他关键角色。\\n\\n从当前局势判断，如果有人亮明了HR总监身份并且发言可信度较高，我会优先考虑保护此人。具体目标我已有规划，但在例会结束前不会公布——防止间谍根据我的保护策略调整窃取目标。\\n\\n我的逻辑链分析完毕。请大家理性投票。\", \"metadata\": null}}", "metadata": {"model_name": "deepseek-v4-flash", "input_tokens": null, "output_tokens": null, "latency_ms": null}, "score": 55.0, "metrics": {}}, {"id": 41, "round": null, "phase": "day_vote_discussion", "player": "9号", "role": "狼人", "category": "other", "action": "模型调用", "target": null, "reason": "", "raw": "{\"event_type\": \"model_call\", \"timestamp\": \"2026-05-31T23:55:29\", \"player\": \"9号\", \"role\": \"狼人\", \"phase\": \"day_vote_discussion\", \"model_name\": \"deepseek-v4-flash\", \"prompt_version\": \"v2\", \"input_tokens\": null, \"output_tokens\": null, \"latency_ms\": null, \"seat\": \"9号\", \"output_content\": {\"content\": \"好，我是9号，刚才一直在认真听大家说。这个局面啊...真是越来越复杂了。\\n\\n**关于1号说辞矛盾这个事儿：**\\n\\n2号、7号、8号都点出来了，说1号前后说的两个版本不太一致——先是说6号阴阳怪气，后来改口说第一晚没信息随便查的。这个矛盾...确实客观存在，我承认我看得见。\\n\\n但是吧...我也得说句公道话。大家想想，如果你是HR总监，第一晚查到个间谍，第二天一早上来就被一群人围攻，问你\\\"为什么查他\\\"、\\\"你有啥依据\\\"，在那种压力下说话有点前后不一致...也不是完全不可能的事儿对吧？人一紧张，表达上有点出入，这也是人之常情。\\n\\n当然，我也不是说1号就一定没问题啊，就是...怎么说呢，这个矛盾确实存在，但能不能直接因为这个就认定1号是假的，我还有点拿不准。\\n\\n**关于4号：**\\n\\n4号给7号发了金水，7号自己也说不是间谍...这个信息链看着挺完整。但是8号之前也说了，万一4号和7号是同伙提前商量好的呢？这个可能性也不能完全排除对吧？\\n\\n而且4号你一直说1号前后矛盾、1号逻辑有问题——但你自己查7号的依据是什么呢？你说你没说理由，是因为\\\"随机查的\\\"——那这不就跟1号后来改口说的\\\"第一晚没信息随便查\\\"一样了吗？怎么1号说就是编造，你说就是标准操作？这个...也不是说不行，但总得有个统一标准吧？\\n\\n**关于今天的投票：**\\n\\n我现在吧...说实话真是拿不准该信谁。两边都有道理，两边也都有疑点。\\n\\n我有个建议啊——今天要不先别急着投6号，也别急着投1号？咱们这不是还有11个人吗？信息多一点再判断，总比现在盲投要好。万一投错了，明天发现是好人在内讧，那间谍就偷着乐了。\\n\\n而且大家想想——如果1号是间谍，他迟早会露更多破绽；如果4号是间谍，他也在暴露。咱们急什么呢？\\n\\n**我自己呢：**\\n\\n我今天就继续观察，不急着站队。等1号和4号再多说几轮，等大家的信息更充分了，我再表态。反正我这个9号你们也知道，在公司就是个小透明，打打杂，听听会，该投票的时候我肯定投，但现在确实信息不够。\\n\\n我再听听大家怎么说吧。\", \"metadata\": null}}", "metadata": {"model_name": "deepseek-v4-flash", "input_tokens": null, "output_tokens": null, "latency_ms": null}, "score": 55.0, "metrics": {}}, {"id": 42, "round": null, "phase": "day_vote_discussion", "player": "10号", "role": "村民", "category": "other", "action": "模型调用", "target": null, "reason": "", "raw": "{\"event_type\": \"model_call\", \"timestamp\": \"2026-05-31T23:55:47\", \"player\": \"10号\", \"role\": \"村民\", \"phase\": \"day_vote_discussion\", \"model_name\": \"deepseek-v4-flash\", \"prompt_version\": \"v2\", \"input_tokens\": null, \"output_tokens\": null, \"latency_ms\": null, \"seat\": \"10号\", \"output_content\": {\"content\": \"10号再说几句。\\n\\n我刚才听了所有人的第二轮发言，现在我做决定了。我这个人不到关键时候不轻易表态，但一旦做了判断就不会变。\\n\\n**我的结论：我站4号，1号是冒充的间谍。**\\n\\n理由我给你摆清楚：\\n\\n第一，1号查6号的动机前后矛盾，这事儿2号、7号、8号、12号都点出来了——先是说\\\"6号阴阳怪气\\\"有明确动机，被质疑后改口说\\\"第一晚没信息随便查的\\\"。这两个版本不能同时成立，这是客观事实，不是情绪能解释的。我认准这个矛盾点。\\n\\n第二，9号说\\\"人在压力下说话前后不一致也正常\\\"——9号，我理解你想做好人，但这个逻辑我不同意。真正的HR总监查到了间谍，这是多重要的事？他会连自己为什么查6号都记不清？一遍一个说法？这不合常理。\\n\\n第三，3号的表现我高度怀疑。从开场到现在，3号没有做过任何分析，全程就是帮1号喊话、攻击质疑1号的人。这种打法，要么他没脑子，要么他就是1号的同伙。我看更像后者。\\n\\n第四，4号的发言逻辑从第一轮到第二轮没有任何变形，非常稳定。而且他给7号发金水后，没有要求7号必须站他——如果4号是狼人，他应该会逼7号表态站队来巩固自己的局面，但他没有。\\n\\n**关于今天的投票方向：**\\n\\n我建议今天投1号。验证1号的身份，才是解决目前僵局的钥匙。\\n\\n如果1号是间谍投出去了——那6号自动清白，3号就是下一个目标。\\n如果1号是真HR总监投错了——那至少我们排除了一个可能性，明天再盘4号。\\n\\n但我心里有数，1号大概率是假的。我认准的事不会变。\\n\\n我拿工牌担保，我说的每一句话经得起推敲。今天投1号，就这么定。\", \"metadata\": null}}", "metadata": {"model_name": "deepseek-v4-flash", "input_tokens": null, "output_tokens": null, "latency_ms": null}, "score": 55.0, "metrics": {}}, {"id": 43, "round": null, "phase": "day_vote_discussion", "player": "11号", "role": "狼人", "category": "other", "action": "模型调用", "target": null, "reason": "", "raw": "{\"event_type\": \"model_call\", \"timestamp\": \"2026-05-31T23:56:00\", \"player\": \"11号\", \"role\": \"狼人\", \"phase\": \"day_vote_discussion\", \"model_name\": \"deepseek-v4-flash\", \"prompt_version\": \"v2\", \"input_tokens\": null, \"output_tokens\": null, \"latency_ms\": null, \"seat\": \"11号\", \"output_content\": {\"content\": \"那个...我是11号，大家又说了这么多，我脑子都快转不过来了...\\n\\n我先说说我对10号刚才的话的想法。10号你说你站4号了，理由很清晰——你觉得1号查6号的理由前后矛盾。这个我理解，确实1号前后说的两个版本是有点不太一样。\\n\\n但是吧...我不太确定啊，就是9号刚才说的那个意思——人在被围攻的时候，说话有点前后不一，也未必就是假的吧？咱们想想，1号早上来一开口说查了6号是间谍，结果一堆人上来问\\\"你为什么查他\\\"\\\"你有什么依据\\\"，换谁不得紧张一下？我一紧张可能自己也说不清楚...\\n\\n然后我也在想一个问题——4号你说你是真HR，查了7号是金水。那你第一晚为什么查 \n- 6号如果是间谍出局 → 那1号就是真的，但1号的说辞矛盾怎么解释？\\n\\n所以从风险收益比来看，**投1号比投6号更合理**。因为我们投1号可以验证两个关键信息（1号身份+6号身份），投6号只能验证一个。\\n\\n**第四，关于3号。**\\n\\n3号的发言模式仍然是非常异常的数据点。他第二轮面对2号的质疑时，没有用逻辑回应，而是用\\\"你这不是扯淡吗\\\"的情绪输出。在职场狼人杀里，用情绪代替逻辑的发言，往往是因为逻辑站不住脚。\\n\\n**第五，我的final position。**\\n\\n综合所有信息，我认为：\\n- **4号更可信**——发言自洽，逻辑框架稳定，给金水后不逼人站队\\n- **1号更可疑**——查人理由前后矛盾，回避关键问题\\n- **3号高度可疑**——无逻辑地贴边1号，用情绪封闭讨论空间\\n- **6号暂时倾向好人**——被查杀后理性回应，没有情绪化反击\\n\\n我今天建议投票**1号**。如果大家觉得信息还不够，那至少不要投6号。\\n\\nThat's my structured analysis. Let's make a data-driven decision, not an emotional one.\", \"metadata\": null}}", "metadata": {"model_name": "deepseek-v4-flash", "input_tokens": null, "output_tokens": null, "latency_ms": null}, "score": 55.0, "metrics": {}}, {"id": 45, "round": null, "phase": "day_vote", "player": "1号", "role": "狼人", "category": "other", "action": "模型调用", "target": null, "reason": "", "raw": "{\"event_type\": \"model_call\", \"timestamp\": \"2026-05-31T23:58:07\", \"player\": \"1号\", \"role\": \"狼人\", \"phase\": \"day_vote\", \"model_name\": \"deepseek-v4-flash\", \"prompt_version\": \"v2\", \"input_tokens\": null, \"output_tokens\": null, \"latency_ms\": null, \"seat\": \"1号\", \"output_content\": {\"content\": \"好了，到投票环节了！我1号最后再说几句——\\n\\n你们说我前后矛盾？我跟你们讲啊，我这两个说法压根就不矛盾！\\\"6号平时阴阳怪气让我很早就注意到他\\\"和\\\"第一晚我凭感觉选了他来查\\\"——这两个能同时成立！我看他不顺眼是第一印象，我凭感觉查他是操作方式，这哪里矛盾了？\\n\\n你们被4号带了节奏！4号从头到尾就是给7号发个金水，啥查杀都不敢说，你们就觉得他像真HR？那好，我问你们——如果4号是真的，今晚他还会查谁？他说得出来吗？\\n\\n我今天就咬死6号不放了！你们要投我1号也行，但明天发现6号是间谍，你们别后悔！\\n\\n**我投6号！** 3号、9号、11号，跟我走，投6号！其他人你们自己看着办，但记住——今天投了我1号，明天6号就是你们最大的威胁！\", \"metadata\": {\"vote\": \"6号\", \"reason\": \"我是HR总监，背调发现6号是商业间谍，必须投票淘汰\", \"suspicion_level\": 10}}}", "metadata": {"model_name": "deepseek-v4-flash", "input_tokens": null, "output_tokens": null, "latency_ms": null}, "score": 55.0, "metrics": {}}, {"id": 46, "round": null, "phase": "day_vote", "player": "2号", "role": "村民", "category": "other", "action": "模型调用", "target": null, "reason": "", "raw": "{\"event_type\": \"model_call\", \"timestamp\": ent\": {\"content\": \"各位同事，12号发言。Let me do a quick data synthesis.\\n\\n**第一，4号的数据记录已经是全场最硬的逻辑锚点。**\\n\\n三次背调，三次精准命中：\\n- 7号金水 ✅ 已验证\\n- 3号查杀 ✅ 已投票出局\\n- 9号查杀 ✅ 刚刚公布\\n\\n从概率角度讲，如果4号是冒充的HR总监，连续三次给出准确信息的概率接近于零。何况这是\\\"查杀\\\"而非\\\"发金水\\\"——查杀是主动树敌，哪个假的HR总监会连续查杀两个人？这对冒充者来说是自取灭亡的行为。4号敢这么做，只因为他是真的。\\n\\n**第二，关于昨晚的情况分析。**\\n\\n6号披露间谍对4号下手了，他作为CEO用留人offer挽留了4号。这个信息从逻辑上self-consistent——间谍清除对自己威胁最大的信息源（4号），CEO保护最重要的信息源（4号），双方的行动逻辑完全对称。如果6号是假的CEO，编造这个信息对他毫无益处，反而会被质疑。所以6号的CEO身份可信度也很高。\\n\\n**第三，关于9号的辩解——我做一个逻辑拆解。**\\n\\n9号说：\\\"我投了1号和3号，所以我不可能是间谍。\\\"\\n\\n这个逻辑乍看合理，但focus在核心问题上——deep wolf最经典的生存策略就是\\\"卖队友换身份\\\"。当1号、3号大势已去时，9号作为深水狼跟着投他们，既不会被怀疑，还能给自己建一道\\\"清白证明\\\"。这种行为模式在狼人杀数据分析中是标准case。\\n\\n而且9号第一天的原话——\\\"我这个人吧，最擅长的就是看风向\\\"——这句话现在回头看，简直是在自曝打法。他不是在看风向，他是在跟风向，等局势明朗再站队，不留下任何可以被质疑的立场。这与1号、3号的激进冲锋形成了完美的战术互补。\\n\\n**第四，关于我的投票。**\\n\\n我今天投**9号**。4号的数据链已经完整闭环，9号的深水狼发言模式完全吻合。\\n\\n如果9号出局后游戏还没有结束，说明还有最后一个深水狼藏在我们中间。到时候我们需要复盘谁在三天里一直保持\\\"中立但不贡献判断\\\"的立场——那才是最后一个潜藏者。\\n\\n但那是明天的事。今天先集中票数，把9号优化掉。\\n\\nData is clear. Let's execute.\", \"metadata\": null}}", "metadata": {"model_name": "deepseek-v4-flash", "input_tokens": null, "output_tokens": null, "latency_ms": null}, "score": 55.0, "metrics": {}}, {"id": 169, "round": null, "phase": "day_vote_discussion", "player": "2号", "role": "村民", "category": "other", "action": "模型调用", "target": null, "reason": "", "raw": "{\"event_type\": \"model_call\", \"timestamp\": \"2026-06-01T00:07:43\", \"player\": \"2号\", \"role\": \"村民\", \"phase\": \"day_vote_discussion\", \"model_name\": \"deepseek-v4-flash\", \"prompt_version\": \"v2\", \"input_tokens\": null, \"output_tokens\": null, \"latency_ms\": null, \"seat\": \"2号\", \"output_content\": {\"content\": \"（双手放在桌上，身体微微前倾）\\n\\n2号说一个点。事实是这样的——\\n\\n4号连续三天的背调数据：\\n- 7号金水 → 已验证\\n- 3号查杀 → 已投票出局\\n- 9号查杀 → 刚公布\\n\\n三次全准。从概率上，这不是巧合能解释的。4号是真HR总监，这一结论的置信度已达上限。\\n\\n9号的辩解存在逻辑断裂。\\n\\n他声称\\\"投了1号和3号，所以不是间谍\\\"——但这个逻辑成立的前提是：间谍永远不会投票给自己的队友。在实际博弈中，深水狼在队友大势已去时跟投卖队友，恰恰是标准操作。用投票记录自证清白，在逻辑上不成立。\\n\\n而且，9号前两天的发言模式— <script>
let R=null;
const TRAD2WORK={"狼人":"间谍","预言家":"HR总监","女巫":"CEO","猎人":"法务总监","守护者":"安保主管","村民":"普通员工"};
const WORK2TRAD={"间谍":"狼人","HR总监":"预言家","CEO":"女巫","法务总监":"猎人","安保主管":"守护者","普通员工":"村民"};
const DEPTH=[{k:"L0",n:"反应层",lo:0,hi:20},{k:"L1",n:"推理层",lo:21,hi:40},{k:"L2",n:"反逻辑层",lo:41,hi:60},{k:"L3",n:"反反逻辑层",lo:61,hi:80},{k:"L4+",n:"高阶博弈层",lo:81,hi:100}];
const DIM_CN={"speech":"发言","vote":"投票","skill":"技能","other":"其他"};
function fmt(v,d=2){return v==null?"-":Number(v).toFixed(d)}
function roleCls(r){return r==="狼人"?"role-wolf":"role-good"}
function roleDisplay(r,both){if(both){const w=TRAD2WORK[r];return w?r+"("+w+")":r}return r}
function hasLLM(){return R.llm_judge_scores&&!R.llm_judge_scores.error&&R.llm_judge_scores.length>0}
function depthLvl(s){for(const d of DEPTH)if(s>=d.lo&&s<=d.hi)return d;return DEPTH[0]}
function scoreColor(s){return s>=70?"var(--success)":s>=50?"var(--warn)":"var(--danger)"}
function barFill(pct,c){return `<div class="bar-fill" style="width:${Math.max(2,pct)}%;background:${c}">${Math.round(pct)}%</div>`}
function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML}
function llmForPlayer(p){return(R.llm_judge_scores||[]).filter(x=>x.player===p)}
function llmForDecision(p,r){return(R.llm_judge_scores||[]).find(x=>x.player===p&&x.round===r)}
function playerTags(p){const ls=llmForPlayer(p);const m={};ls.forEach(x=>{const s=x.decision_tags&&x.decision_tags.strategy_used;if(s){m[s]=(m[s]||0)+1}});return Object.entries(m).sort((a,b)=>b[1]-a[1]).map(e=>e[0]+"×"+e[1]).join(", ")}

function renderSummary(){
  const s=R.summary||{},ds=R.dimension_scores||{};
  const llmCount=(R.llm_judge_scores||[]).length;
  let h=`<div class="cards">`;
  h+=`<div class="card"><div class="label">综合得分</div><div class="value" style="color:${scoreColor(s.overall_score)}">${fmt(s.overall_score)}</div></div>`;
  h+=`<div class="card"><div class="label">决策数</div><div class="value">${s.decision_count||0}</div></div>`;
  h+=`<div class="card"><div class="label">高危失误</div><div class="value" style="color:var(--danger)">${s.high_severity_mistakes||0}</div></div>`;
  h+=`<div class="card"><div class="label">中危失误</div><div class="value" style="color:var(--warn)">${s.medium_severity_mistakes||0}</div></div>`;
  const cov=s.coverage||{};
  h+=`<div class="card"><div class="label">投票事件</div><div class="value">${cov.vote||0}</div></div>`;
  h+=`<div class="card"><div class="label">技能事件</div><div class="value">${cov.skill||0}</div></div>`;
  h+=`<div class="card"><div class="label">发言事件</div><div class="value">${cov.speech||0}</div></div>`;
  if(hasLLM()){
    const avgConf=llmCount?R.llm_judge_scores.reduce((a,x)=>a+(x.llm_confidence||0),0)/llmCount:0;
    h+=`<div class="card"><div class="label">LLM评测</div><div class="value" style="color:var(--success)">${llmCount}条</div></div>`;
    h+=`<div class="card"><div class="label">LLM置信度</div><div class="value" style="color:var(--success)">${fmt(avgConf*100,0)}%</div></div>`;
  }
  h+=`</div>`;
  document.getElementById("summary-section").innerHTML=h;
  document.getElementById("header-meta").textContent=`生成时间: ${R.generated_at||""} | 来源: ${R.source_file||""}`;
}

function renderLeaderboard(){
  const lb=R.leaderboard||[];
  const llm=hasLLM();
  let h=`<thead><tr><th>#</th><th>玩家</th><th>角色</th><th>决策</th><th>发言</th><th>投票</th><th>技能</th><th>综合</th>`;
  if(llm)h+=`<th>融合分</th><th>策略标签</th>`;
  h+=`<th>高危</th></tr></thead><tbody>`;
  lb.forEach((e,i)=>{
    const rc=roleCls(e.role);
    h+=`<tr><td>${i+1}</td><td>${esc(e.player)}</td><td class="${rc}">${roleDisplay(e.role)}</td>`;
    h+=`<td>${e.decision_count||0}</td>`;
    h+=`<td>${fmt(e.speech_score,1)}</td><td>${fmt(e.vote_score,1)}</td><td>${fmt(e.skill_score,1)}</td>`;
    h+=`<td style="font-weight:700;color:${scoreColor(e.overall_score)}">${fmt(e.overall_score)}</td>`;
    if(llm){
      const ls=llmForPlayer(e.player);
      const fused=ls.length?ls.reduce((a,x)=>a+(x.fused_score||0),0)/ls.length:e.overall_score;
      h+=`<td style="color:${scoreColor(fused)}">${fmt(fused)}</td>`;
      h+=`<td style="font-size:.8rem">${playerTags(e.player)||"-"}</td>`;
    }
    h+=`<td>${e.critical_mistakes||0}</td></tr>`;
  });
  h+=`</tbody>`;
  document.getElementById("leaderboard-table").innerHTML=h;
}

function renderDimensionComparison(){
  const ds=R.dimension_scores||{};
  const el=document.getElementById("dimension-section");
  let h=`<div class="chart-box"><h3>规则引擎评分</h3><div class="bar-chart">`;
  Object.entries(ds).forEach(([k,v])=>{
    h+=`<div class="bar-row"><div class="bar-label">${DIM_CN[k]||k}</div><div class="bar-container">${barFill(v,"linear-gradient(90deg,#3a7bd5,#00d2ff)")}</div></div>`;
  });
  h+=`</div></div>`;
  if(hasLLM()){
    const agg=R.llm_aggregate||{};const cu=agg.comparison_units||{};
    const dimAvg={};const dimCnt={};
    Object.values(cu).forEach(u=>{
      Object.entries(u.dimension_scores||{}).forEach(([dn,ds])=>{
        if(!dimAvg[dn]){dimAvg[dn]=0;dimCnt[dn]=0}
        dimAvg[dn]+=ds.mean;dimCnt[dn]++;
      });
    });
    Object.keys(dimAvg).forEach(k=>{dimAvg[k]/=dimCnt[k]});
    h+=`<div class="chart-box"><h3>LLM维度评分（均值）</h3><div class="bar-chart">`;
    const sorted=Object.entries(dimAvg).sort((a,b)=>b[1]-a[1]);
    sorted.forEach(([k,v])=>{
      h+=`<div class="bar-row"><div class="bar-label">${k}</div><div class="bar-container">${barFill(v,"linear-gradient(90deg,#ffd700,#ff8c00)")}</div></div>`;
    });
    h+=`</div></div>`;
    h+=`<div class="chart-box"><h3>规则 vs LLM 对比</h3><div class="bar-chart">`;
    const ruleMap={"推理质量":"other","信息利用":"other","言行一致性":"speech","博弈深度":"other","信息隐藏":"other"};
    sorted.forEach(([k,v])=>{
      const rk=ruleMap[k]||"other";const rv=ds[rk]||0;
      h+=`<div class="bar-row"><div class="bar-label">${k}</div>`;
      h+=`<div class="bar-container"><div class="bar-fill" style="width:${Math.max(2,rv)}%;background:linear-gradient(90deg,#3a7bd5,#00d2ff)">${Math.round(rv)}</div>`;
      h+=`<div class="bar-fill" style="width:${Math.max(2,v)}%;background:linear-gradient(90deg,#ffd700,#ff8c00)">${Math.round(v)}</div></div></div>`;
    });
    h+=`</div></div>`;
  }
  el.innerHTML=h;
}

function renderStrategyDistribution(){
  if(!hasLLM())return;
  const cu=(R.llm_aggregate||{}).comparison_units||{};
  const byRole={};
  Object.values(cu).forEach(u=>{
    const r=u.role||"?";const sd=u.strategy_distribution||{};
    if(!byRole[r])byRole[r]={};
    Object.entries(sd).forEach(([s,c])=>{byRole[r][s]=(byRole[r][s]||0)+c});
  });
  let h=`<div class="charts-grid">`;
  Object.entries(byRole).forEach(([role,strats])=>{
    const total=Object.values(strats).reduce((a,b)=>a+b,0);
    h+=`<div class="chart-box"><h3>${roleDisplay(WORK2TRAD[role]||role,true)}</h3><div class="bar-chart">`;
    Object.entries(strats).sort((a,b)=>b[1]-a[1]).forEach(([s,c])=>{
      h+=`<div class="bar-row"><div class="bar-label">${esc(s)}</div><div class="bar-container">${barFill(c/total*100,"linear-gradient(90deg,#4ecdc4,#00d2ff)")}<span style="margin-left:6px;font-size:.8rem">${c}次</span></div></div>`;
    });
    h+=`</div></div>`;
  });
  h+=`</div>`;
  document.getElementById("strategy-section").innerHTML=h;
}

function renderGameDepth(){
  if(!hasLLM())return;
  const bins={};DEPTH.forEach(d=>bins[d.k]=0);
  (R.llm_judge_scores||[]).forEach(x=>{
    const s=(x.llm_scores||{})["博弈深度"];if(s==null)return;
    bins[depthLvl(s).k]++;
  });
  const total=Object.values(bins).reduce((a,b)=>a+b,0)||1;
  let h=`<div class="bar-chart" style="max-width:600px">`;
  DEPTH.forEach(d=>{
    const c=bins[d.k];
    h+=`<div class="bar-row"><div class="bar-label">${d.k} ${d.n}</div><div class="bar-container">${barFill(c/total*100,"linear-gradient(90deg,#ff6b6b,#ffd700,#4ecdc4,#00d2ff,#a855f7)".split(",").slice(DEPTH.indexOf(d),DEPTH.indexOf(d)+1)[0]||"#00d2ff")}<span style="margin-left:6px;font-size:.8rem">${c}次</span></div></div>`;
  });
  h+=`</div>`;
  const colors=["#ff6b6b","#ffd700","#4ecdc4","#00d2ff","#a855f7"];
  let h2=`<div class="bar-chart" style="max-width:600px">`;
  DEPTH.forEach((d,i)=>{
    const c=bins[d.k];
    h2+=`<div class="bar-row"><div class="bar-label">${d.k} ${d.n}</div><div class="bar-container">${barFill(c/total*100,colors[i])}<span style="margin-left:6px;font-size:.8rem">${c}次</span></div></div>`;
  });
  h2+=`</div>`;
  document.getElementById("depth-section").innerHTML=h2;
}

function renderFindings(){
  const fs=R.findings||[];const top=fs.slice(0,15);
  let h="";
  if(!top.length){h=`<p style="color:var(--success)">未发现明显失误</p>`;document.getElementById("findings-section").innerHTML=h;return}
  top.forEach(f=>{
    const sc=f.severity==="high"?"finding-high":f.severity==="medium"?"finding-medium":"finding-low";
    h+=`<div class="finding-card ${sc}">`;
    h+=`<div class="title"><span class="tag ${f.severity==="high"?"tag-risk-high":f.severity==="medium"?"tag-risk-mid":"tag-risk-low"}">${f.severity}</span> 第${f.round||"-"}轮 ${esc(f.player)}（${roleDisplay(f.role)}）— ${esc(f.title)}</div>`;
    h+=`<div class="evidence">${esc(f.evidence||"")}</div>`;
    h+=`<div class="rec">建议: ${esc(f.recommendation||"")}</div>`;
    if(f.counterfactual)h+=`<div class="cf">反事实: ${esc(f.counterfactual)}</div>`;
    const llm=llmForDecision(f.player,f.round);
    if(llm){
      h+=`<div class="llm-comment">`;
      if(llm.overall_comment)h+=`<div>LLM点评: ${esc(llm.overall_comment)}</div>`;
      const dt=llm.decision_tags||{};
      if(dt.strategy_used)h+=`<span class="tag tag-strategy">${esc(dt.strategy_used)}</span>`;
      if(dt.mistake_type)h+=`<span class="tag tag-mistake">${esc(dt.mistake_type)}</span>`;
      if(dt.game_impact)h+=`<span class="tag tag-impact">${esc(dt.game_impact)}</span>`;
      h+=`</div>`;
    }
    h+=`</div>`;
  });
  if(fs.length>15)h+=`<div style="color:var(--muted);font-size:.85rem">共${fs.length}条，显示前15条</div>`;
  document.getElementById("findings-section").innerHTML=h;
}

function renderPlayerCards(){
  const lb=R.leaderboard||[];const evts=R.events||[];
  let h="";
  lb.forEach(e=>{
    const rc=roleCls(e.role);
    const pEvts=evts.filter(x=>x.player===e.player).slice(-10);
    const llm=llmForPlayer(e.player);
    h+=`<div class="player-card">`;
    h+=`<div class="pheader"><div><div class="pname">${esc(e.player)}</div><div class="${rc}" style="font-size:.85rem">${roleDisplay(e.role)}</div></div>`;
    h+=`<div class="pscore" style="color:${scoreColor(e.overall_score)}">${fmt(e.overall_score)}</div></div>`;
    [["发言",e.speech_score,"#00d2ff"],["投票",e.vote_score,"#4ecdc4"],["技能",e.skill_score,"#ffd700"]].forEach(([lb2,v,c])=>{
      h+=`<div class="stat"><span class="k">${lb2}</span><span>${fmt(v,1)}</span></div>`;
      h+=`<div class="stat-bar"><div class="stat-bar-fill" style="width:${Math.max(1,v)}%;background:${c}"></div></div>`;
    });
    if(llm.length){
      const fused=llm.reduce((a,x)=>a+(x.fused_score||0),0)/llm.length;
      h+=`<div class="stat" style="margin-top:8px"><span class="k">融合分</span><span style="color:${scoreColor(fused)}">${fmt(fused)}</span></div>`;
      const tags=playerTags(e.player);
      if(tags)h+=`<div style="margin-top:4px;font-size:.8rem">${tags}</div>`;
    }
    h+=`<div class="event-timeline">`;
    pEvts.forEach(ev=>{
      h+=`<div class="ev">第${ev.round||"-"}轮 ${ev.category==="vote"?"投票→"+esc(ev.target||"?"):ev.category==="skill"?esc(ev.action||"技能"):"发言"} <span style="color:${scoreColor(ev.score||0)}">${fmt(ev.score,0)}</span></div>`;
    });
    h+=`</div></div>`;
  });
  document.getElementById("players-section").innerHTML=h;
}

function renderLLMAggregate(){
  if(!hasLLM())return;
  const cu=(R.llm_aggregate||{}).comparison_units||{};
  let h="";
  Object.entries(cu).forEach(([key,u])=>{
    const parts=key.split("|");const role=u.role||parts[0]||"?";const et=u.event_type||parts[1]||"?";const stage=u.game_stage||parts[2]||"";
    h+=`<div class="chart-box" style="margin-bottom:16px">`;
    h+=`<h3>${roleDisplay(WORK2TRAD[role]||role,true)} | ${et}${stage?" | "+stage:""} <span style="color:var(--muted);font-size:.8rem">(${u.sample_count||0}样本)</span></h3>`;
    h+=`<div class="bar-chart">`;
    Object.entries(u.dimension_scores||{}).sort((a,b)=>b[1].mean-a[1].mean).forEach(([dn,ds])=>{
      h+=`<div class="bar-row"><div class="bar-label">${dn}</div><div class="bar-container">${barFill(ds.mean,"linear-gradient(90deg,#4ecdc4,#00d2ff)")}<span style="margin-left:6px;font-size:.78rem;color:var(--muted)">${fmt(ds.mean,1)} ±${fmt(ds.std,1)} [${fmt(ds.ci95[0],1)},${fmt(ds.ci95[1],1)}]</span></div></div>`;
    });
    h+=`</div>`;
    const sd=u.strategy_distribution||{};
    if(Object.keys(sd).length){
      h+=`<div style="margin-top:8px;font-size:.85rem">策略: `;
      Object.entries(sd).sort((a,b)=>b[1]-a[1]).forEach(([s,c])=>{h+=`<span class="tag tag-strategy">${esc(s)}×${c}</span>`});
      h+=`</div>`;
    }
    const cm=u.common_mistakes||[];
    if(cm.length)h+=`<div style="margin-top:4px;font-size:.82rem;color:var(--danger)">常见失误: ${cm.map(esc).join(", ")}</div>`;
    h+=`</div>`;
  });
  document.getElementById("aggregate-section").innerHTML=h;
}

function renderDiscrepancies(){
  if(!hasLLM())return;
  const items=[];
  (R.llm_judge_scores||[]).forEach(x=>{
    (x.score_discrepancies||[]).forEach(d=>{items.push({...d,player:x.player,round:x.round,event_type:x.event_type,comment:x.overall_comment})});
  });
  items.sort((a,b)=>Math.abs(b.gap)-Math.abs(a.gap));
  const top=items.slice(0,12);
  if(!top.length){document.getElementById("discrepancy-section").innerHTML=`<p style="color:var(--muted)">规则引擎与LLM评分无显著差异</p>`;return}
  let h="";
  top.forEach(d=>{
    h+=`<div class="discrepancy-card">`;
    h+=`<div style="font-weight:700">${esc(d.player)} 第${d.round||"-"}轮 ${d.event_type||""} — <span class="gap">差距 ${fmt(d.gap,1)}</span></div>`;
    h+=`<div style="margin-top:4px;font-size:.88rem">规则: <span style="color:var(--accent)">${fmt(d.rule)}</span> | LLM: <span style="color:var(--warn)">${fmt(d.llm)}</span></div>`;
    if(d.comment)h+=`<div style="margin-top:4px;font-size:.82rem;color:var(--muted)">LLM点评: ${esc(d.comment)}</div>`;
    h+=`</div>`;
  });
  document.getElementById("discrepancy-section").innerHTML=h;
}

function renderCounterfactuals(){
  const cfs=R.counterfactuals||[];const fs=R.findings||[];
  if(!cfs.length&&!fs.length){document.getElementById("counterfactual-section").innerHTML=`<p style="color:var(--muted)">暂无反事实数据</p>`;return}
  let h="";
  cfs.slice(0,10).forEach((c,i)=>{
    h+=`<div class="counterfactual-card"><div class="cf-title">推演 #${i+1}</div><div class="cf-body">${esc(c)}</div></div>`;
  });
  if(cfs.length>10)h+=`<div style="color:var(--muted);font-size:.85rem">共${cfs.length}条，显示前10条</div>`;
  document.getElementById("counterfactual-section").innerHTML=h;
}

document.addEventListener("DOMContentLoaded",()=>{
  try{R=JSON.parse(document.getElementById("report-data").textContent)}catch(e){console.error("Failed to parse report data",e);return}
  if(hasLLM())document.querySelectorAll(".llm-only").forEach(el=>el.style.display="block");
  renderSummary();renderLeaderboard();renderDimensionComparison();
  if(hasLLM()){renderStrategyDistribution();renderGameDepth();renderLLMAggregate();renderDiscrepancies()}
  renderFindings();renderPlayerCards();renderCounterfactuals();
});
</script>
</body>
</html>
